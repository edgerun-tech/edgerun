# Android cross-compilation configuration
#
# To build for Android, install the NDK and set $ANDROID_NDK_ROOT:
#   export ANDROID_NDK_ROOT=$HOME/Android/Sdk/ndk/27.0.12077973
#
# Then build:
#   cargo build --target aarch64-linux-android --features android-real
#
# Or with cargo-ndk:
#   cargo ndk --target aarch64-linux-android --platform 34 -- build --features android-real

[target.aarch64-linux-android]
linker = "ld.lld"
rustflags = ["-C", "link-arg=-landroid", "-C", "link-arg=-llog"]

[target.armv7-linux-androideabi]
linker = "ld.lld"
rustflags = ["-C", "link-arg=-landroid", "-C", "link-arg=-llog"]

[target.x86_64-linux-android]
linker = "ld.lld"
rustflags = ["-C", "link-arg=-landroid", "-C", "link-arg=-llog"]

[target.i686-linux-android]
linker = "ld.lld"
rustflags = ["-C", "link-arg=-landroid", "-C", "link-arg=-llog"]

[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static"]

[target.xtensa-esp32s3-none-elf]
linker = "/home/ken/edgerun_core/devices/edgerun-tcl-usb-ap-bridge/.embuild/espressif/tools/xtensa-esp-elf/esp-15.2.0_20251204/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc"

[build]
# Native Linux is the default workspace target for local development and tests.
# Platform targets remain explicit overrides.
target = "x86_64-unknown-linux-gnu"

# Android cross-compilation — override with --target
# Set ANDROID_NDK_ROOT to your NDK installation path
# Example: export ANDROID_NDK_ROOT=$HOME/Android/Sdk/ndk/27.0.12077973

[source.crates-io]
replace-with = "vendored-sources"

[source."git+https://github.com/openai-oss-forks/tokio-tungstenite?rev=132f5b39c862e3a970f731d709608b3e6276d5f6"]
git = "https://github.com/openai-oss-forks/tokio-tungstenite"
rev = "132f5b39c862e3a970f731d709608b3e6276d5f6"
replace-with = "vendored-sources"

[source."git+https://github.com/openai-oss-forks/tungstenite-rs?rev=9200079d3b54a1ff51072e24d81fd354f085156f"]
git = "https://github.com/openai-oss-forks/tungstenite-rs"
rev = "9200079d3b54a1ff51072e24d81fd354f085156f"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor/cargo"
