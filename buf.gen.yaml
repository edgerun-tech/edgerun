version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: edgerun-codegen/gen/go/edgerun/v0
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
    strategy: all
  - local: protoc-gen-ts
    out: crates/edgerun-dash-webapp/gen
    opt:
      - output_types_only
    strategy: all
  - local: protoc-gen-prost
    out: crates/edgerun-proto/src/gen
    opt:
      - enable_type_names
    strategy: all
