version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: lifegraph-reference-core/gen
plugins:
  - local: protoc-gen-go
    out: go/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: go/gen
    opt:
      - paths=source_relative
