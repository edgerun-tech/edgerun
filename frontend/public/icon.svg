<svg width="180" height="180" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .logo { color: black; }
    }
    @media (prefers-color-scheme: dark) {
      .logo { color: white; }
    }
  </style>
  <g class="logo">
    <!-- Outer glow ring -->
    <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-opacity="0.08" stroke-width="1" />
    
    <!-- Connection lines - E shape -->
    <!-- Top horizontal: node A(4,6) → node B(26,6) -->
    <line x1="6" y1="7" x2="24" y2="7" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />
    <!-- Middle horizontal: node A(4,16) → node C(20,16) -->
    <line x1="6" y1="16" x2="22" y2="16" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />
    <!-- Bottom horizontal: node A(4,25) → node D(26,25) -->
    <line x1="6" y1="25" x2="24" y2="25" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />
    <!-- Vertical spine: A-top(4,6) → A-mid(4,16) → A-bot(4,25) -->
    <line x1="6" y1="7" x2="6" y2="25" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />
    
    <!-- Diagonal accent lines -->
    <line x1="22" y1="16" x2="24" y2="7" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="1.5 2" />
    <line x1="22" y1="16" x2="24" y2="25" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="1.5 2" />
    
    <!-- Node dots -->
    <!-- Spine node - top -->
    <circle cx="6" cy="7" r="2.5" fill="currentColor" fill-opacity="0.5" />
    <!-- Top-right node -->
    <circle cx="24" cy="7" r="2" fill="currentColor" fill-opacity="0.6" />
    <!-- Mid-right node - primary -->
    <circle cx="22" cy="16" r="3" fill="currentColor" />
    <!-- Spine node - mid -->
    <circle cx="6" cy="16" r="2.5" fill="currentColor" fill-opacity="0.5" />
    <!-- Bottom-right node -->
    <circle cx="24" cy="25" r="2" fill="currentColor" fill-opacity="0.6" />
    <!-- Spine node - bottom -->
    <circle cx="6" cy="25" r="2.5" fill="currentColor" fill-opacity="0.5" />
    
    <!-- Pulse ring on primary node -->
    <circle cx="22" cy="16" r="5.5" stroke="currentColor" stroke-opacity="0.25" stroke-width="1" />
  </g>
</svg>
