<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segmented Verifiable Execution</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #171d26;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f7f9; color: #171d26; }
    main { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid #d7dee9;
      background: #fff;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0; }
    .sub { margin: 4px 0 0; color: #626f83; font-size: 12px; line-height: 1.45; }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid #bdd6c7;
      border-radius: 999px;
      background: #edf9f1;
      color: #166534;
      font: 700 11px/1 ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #dfe5ee;
      background: #f0f3f7;
    }
    button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #2f6fde;
      border-radius: 7px;
      background: #2f6fde;
      color: #fff;
      font: 650 13px/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    button.secondary {
      border-color: #c7d0dc;
      background: #fff;
      color: #2d3748;
    }
    button:disabled { cursor: wait; opacity: .55; }
    .grid {
      display: grid;
      grid-template-columns: minmax(320px, .95fr) minmax(420px, 1.25fr);
      gap: 14px;
      padding: 14px;
      align-content: start;
    }
    section {
      border: 1px solid #dbe2ec;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 0 12px;
      border-bottom: 1px solid #e3e8f0;
      background: #f7f9fc;
    }
    h2 { margin: 0; font-size: 12px; text-transform: uppercase; color: #596579; letter-spacing: 0; }
    .body { padding: 12px; display: grid; gap: 10px; }
    label { display: grid; gap: 6px; color: #5c687a; font-size: 12px; font-weight: 650; }
    textarea, input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: #111827;
      padding: 10px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    textarea { min-height: 150px; resize: vertical; }
    .nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
    .node {
      min-height: 118px;
      border: 1px solid #e0e7f0;
      border-radius: 7px;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 8px;
      background: #fbfcfe;
    }
    .node strong { font-size: 13px; }
    .node span { color: #647084; font-size: 11px; overflow-wrap: anywhere; }
    .proof-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .metric {
      min-height: 66px;
      border: 1px solid #e0e7f0;
      border-radius: 7px;
      padding: 10px;
      background: #fbfcfe;
    }
    .metric span { display: block; color: #667085; font-size: 11px; }
    .metric strong { display: block; margin-top: 6px; font: 700 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
    pre {
      margin: 0;
      min-height: 246px;
      max-height: 430px;
      padding: 12px;
      overflow: auto;
      border-radius: 7px;
      background: #111827;
      color: #e8edf6;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
    .wide { grid-column: 1 / -1; }
    @media (max-width: 920px) {
      header { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .nodes, .proof-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-color-scheme: dark) {
      :root, body { background: #0f1319; color: #e8edf6; }
      header, section, button.secondary { background: #151b24; border-color: #2b3442; color: #e8edf6; }
      .toolbar, .section-head { background: #1a2230; border-color: #2b3442; }
      .sub, label, h2, .node span, .metric span { color: #9aa7b7; }
      textarea, input, .node, .metric { background: #111827; color: #e8edf6; border-color: #303946; }
      .status { border-color: #285943; background: #10231b; color: #75d69b; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Segmented Verifiable Execution</h1>
        <p class="sub" id="summary">Waiting for EdgeRun host runtime.</p>
      </div>
      <span class="status" id="status">Ready</span>
    </header>
    <div class="toolbar">
      <button id="run" type="button">Run proof</button>
      <button id="verify" class="secondary" type="button">Verify log</button>
      <button id="replay" class="secondary" type="button">Replay same input</button>
      <button id="reset" class="secondary" type="button">Reset log</button>
    </div>
    <div class="grid">
      <section>
        <div class="section-head"><h2>Input</h2></div>
        <div class="body">
          <label>
            Workload
            <textarea id="payload" spellcheck="false">{"agent":"invoice-auditor","authority":["read:invoice","write:audit-note"],"task":"check invoice INV-1042 against purchase-order PO-77","amount":"1842.50","currency":"USD"}</textarea>
          </label>
          <label>
            Private policy salt
            <input id="policy" spellcheck="false" value="department=finance;limit=5000;approval=local-agent">
          </label>
        </div>
      </section>
      <section>
        <div class="section-head"><h2>Nodes</h2></div>
        <div class="body nodes" id="nodes"></div>
      </section>
      <section>
        <div class="section-head"><h2>User Node Anchor</h2></div>
        <div class="body">
          <div class="proof-grid" id="user-node"></div>
        </div>
      </section>
      <section>
        <div class="section-head"><h2>Proof</h2></div>
        <div class="body proof-grid" id="proof"></div>
      </section>
      <section>
        <div class="section-head"><h2>Browser Node</h2></div>
        <div class="body">
          <pre id="node-log">Host runtime details will appear here after install.</pre>
        </div>
      </section>
      <section class="wide">
        <div class="section-head"><h2>Hash-linked Signed Event Log</h2></div>
        <div class="body">
          <pre id="event-log">No proof has run yet.</pre>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./edgerun-browser.js"></script>
</body>
</html>
