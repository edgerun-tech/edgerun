<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeRun Chat</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f9;
      --panel: #ffffff;
      --line: #d8e0e7;
      --text: #17212b;
      --muted: #657381;
      --accent: #156f63;
      --accent-2: #334e68;
      --danger: #a13d36;
      --queued: #8a6914;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      height: 34px;
      padding: 0 10px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.icon {
      width: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 300px;
    }

    .sidebar, .details {
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .details {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .topbar {
      min-height: 57px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    .brand strong, .thread-title strong {
      font-size: 14px;
      line-height: 18px;
    }

    .brand span, .thread-title span, .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: #dbeafe;
      color: #17324d;
      border: 1px solid #c5d5e5;
      font-weight: 700;
      font-size: 13px;
    }

    .search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input {
      height: 34px;
      padding: 0 10px;
    }

    textarea {
      min-height: 42px;
      max-height: 120px;
      resize: vertical;
      padding: 10px;
    }

    .contacts {
      overflow: auto;
      min-height: 0;
    }

    .contact-row {
      width: 100%;
      min-height: 62px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid #edf1f4;
      border-radius: 0;
      text-align: left;
      background: #fff;
    }

    .contact-row.active {
      background: #e8f3f1;
    }

    .contact-row strong {
      display: block;
      font-size: 13px;
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: 57px minmax(0, 1fr) auto;
    }

    .thread-head {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .thread-title {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: min(680px, 76%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: #fff;
      align-self: flex-start;
      box-shadow: 0 1px 0 rgba(15, 23, 42, .03);
    }

    .msg.me {
      align-self: flex-end;
      background: #e7f6f1;
      border-color: #c8e7dd;
    }

    .msg p {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 20px;
    }

    .msg .meta {
      margin-top: 4px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 11px;
      line-height: 14px;
    }

    .msg .queued { color: var(--queued); }
    .msg .failed { color: var(--danger); }

    .composer {
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .detail-section {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .detail-section h2 {
      margin: 0;
      font-size: 13px;
      line-height: 18px;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row input {
      min-width: 0;
      flex: 1;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9aa6b2;
    }

    .status-dot.on { background: var(--accent); }
    .status-dot.bad { background: var(--danger); }

    .empty {
      margin: auto;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }

    .hash {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 260px minmax(0, 1fr); }
      .details { display: none; }
    }

    @media (max-width: 680px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100%;
        grid-template-columns: 1fr;
      }
      .sidebar {
        height: 230px;
        border-right: 0;
      }
      .main {
        min-height: calc(100vh - 230px);
      }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="topbar">
        <div class="avatar">ER</div>
        <div class="brand">
          <strong>EdgeRun Chat</strong>
          <span id="identityLabel">loading node</span>
        </div>
        <button class="icon" id="newContactBtn" title="New contact">+</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="Search contacts">
      </div>
      <div class="contacts" id="contacts"></div>
    </aside>

    <section class="main">
      <header class="thread-head">
        <div class="avatar" id="threadAvatar">--</div>
        <div class="thread-title">
          <strong id="threadName">No thread selected</strong>
          <span id="threadMeta">Create or select a contact</span>
        </div>
      </header>
      <div class="messages" id="messages">
        <div class="empty">No messages yet.</div>
      </div>
      <form class="composer" id="composer">
        <textarea id="messageInput" placeholder="Message" disabled></textarea>
        <button class="primary" id="sendBtn" disabled>Send</button>
      </form>
    </section>

    <aside class="details">
      <section class="detail-section">
        <h2>Relay</h2>
        <div class="row">
          <span class="status-dot" id="relayDot"></span>
          <span class="small" id="relayState">disconnected</span>
        </div>
        <div class="field">
          <label for="relayUrl">WebSocket URL</label>
          <input id="relayUrl" value="ws://127.0.0.1:7999/work">
        </div>
        <div class="field">
          <label for="relayNode">Relay node id</label>
          <input id="relayNode">
        </div>
        <div class="field">
          <label for="channelId">Channel id</label>
          <input id="channelId">
        </div>
        <div class="field">
          <label for="routeHash">Route hash</label>
          <input id="routeHash">
        </div>
        <div class="row">
          <button id="connectBtn">Connect</button>
          <button id="disconnectBtn" disabled>Disconnect</button>
        </div>
        <div class="row">
          <button id="saveRouteBtn">Save route</button>
          <button id="newChannelBtn">New channel</button>
        </div>
      </section>

      <section class="detail-section">
        <h2>This node</h2>
        <div class="hash" id="ownerNode">-</div>
        <div class="hash" id="ownerPublicKey">-</div>
        <div class="field">
          <label for="unlockSecret">Unlock secret</label>
          <input id="unlockSecret" type="password" autocomplete="current-password">
        </div>
        <div class="row">
          <button id="unlockIdentityBtn">Unlock</button>
          <button id="saveIdentityBtn">Save identity</button>
        </div>
        <button id="clearIdentityBtn">Clear saved identity</button>
        <div class="field">
          <label for="ownContactCard">Signed contact card</label>
          <textarea id="ownContactCard" readonly></textarea>
        </div>
        <div class="row">
          <button id="refreshCardBtn">Refresh card</button>
          <button id="copyCardBtn">Copy card</button>
        </div>
      </section>

      <section class="detail-section">
        <h2>Contact</h2>
        <div class="field">
          <label for="contactCardImport">Import signed card</label>
          <textarea id="contactCardImport"></textarea>
        </div>
        <button id="importCardBtn">Import card</button>
        <div class="field">
          <label>Name</label>
          <input id="contactName">
        </div>
        <div class="field">
          <label>Public node id</label>
          <input id="contactNode">
        </div>
        <div class="field">
          <label>Public signing key</label>
          <input id="contactPublicKey">
        </div>
        <div class="field">
          <label>External contact</label>
          <input id="contactExternal">
        </div>
        <button id="saveContactBtn">Save contact</button>
      </section>

      <section class="detail-section">
        <h2>Thread</h2>
        <div class="hash" id="threadHash">-</div>
      </section>
    </aside>
  </main>

  <script>
    const DB_NAME = "edgerun-chat-v1";
    const DB_VERSION = 2;
    const ZERO_HASH = "0".repeat(64);
    const DEFAULT_CHANNEL_ID = "03".repeat(32);
    const DEFAULT_ROUTE_HASH = "04".repeat(32);
    const SEALED_RECORD_HEADER_LEN = 292;
    const stores = ["contacts", "threads", "messages", "payloads", "settings", "outbox", "inbox"];
    const enc = new TextEncoder();

    let db;
    let state = {
      owner: "",
      contacts: [],
      selectedContactId: null,
      messages: [],
      ws: null,
      connected: false,
      wasm: null,
      ownerPublicKey: "",
      route: {
        relayNode: ZERO_HASH,
        channelId: DEFAULT_CHANNEL_ID,
        routeHash: DEFAULT_ROUTE_HASH
      }
    };

    const $ = id => document.getElementById(id);

    function bytesToHex(bytes) {
      return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
      return out;
    }

    function hexInputToBytes(value) {
      const hex = value.trim().replace(/^0x/i, "").replace(/\s+/g, "");
      if (!hex || hex.length % 2 || !/^[0-9a-fA-F]+$/.test(hex)) throw new Error("invalid hex");
      return hexToBytes(hex);
    }

    function wasmHashHex(value) {
      const bytes = typeof value === "string" ? enc.encode(value) : value;
      return bytesToHex(callChatWasm("edgerun_chat_hash", bytes));
    }

    function short(id) {
      return id ? id.slice(0, 8) + "..." + id.slice(-6) : "-";
    }

    function initials(name) {
      return (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0]).join("").toUpperCase();
    }

    function tx(store, mode = "readonly") {
      return db.transaction(store, mode).objectStore(store);
    }

    function request(req) {
      return new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function all(store) {
      return request(tx(store).getAll());
    }

    function put(store, value) {
      return request(tx(store, "readwrite").put(value));
    }

    function del(store, key) {
      return request(tx(store, "readwrite").delete(key));
    }

    async function openDb() {
      db = await new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains("contacts")) {
            const s = d.createObjectStore("contacts", { keyPath: "contact_id" });
            s.createIndex("primary_node_id", "primary_node_id");
            s.createIndex("updated_unix_ms", "updated_unix_ms");
          }
          if (!d.objectStoreNames.contains("threads")) {
            const s = d.createObjectStore("threads", { keyPath: "thread_id" });
            s.createIndex("updated_unix_ms", "updated_unix_ms");
          }
          if (!d.objectStoreNames.contains("messages")) {
            const s = d.createObjectStore("messages", { keyPath: "message_id" });
            s.createIndex("thread_id", "thread_id");
            s.createIndex("sequence", "sequence");
          }
          if (!d.objectStoreNames.contains("inbox")) d.createObjectStore("inbox", { keyPath: "message_id" });
          if (!d.objectStoreNames.contains("payloads")) d.createObjectStore("payloads", { keyPath: "hash" });
          if (!d.objectStoreNames.contains("settings")) d.createObjectStore("settings", { keyPath: "key" });
          if (!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath: "message_id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getSetting(key) {
      const row = await request(tx("settings").get(key));
      return row && row.value;
    }

    async function setSetting(key, value) {
      await put("settings", { key, value });
    }

    async function loadRouteSettings() {
      state.route = {
        relayNode: await getSetting("relay_node_id") || ZERO_HASH,
        channelId: await getSetting("channel_id") || DEFAULT_CHANNEL_ID,
        routeHash: await getSetting("route_hash") || DEFAULT_ROUTE_HASH
      };
      $("relayUrl").value = await getSetting("relay_url") || $("relayUrl").value;
      $("relayNode").value = state.route.relayNode;
      $("channelId").value = state.route.channelId;
      $("routeHash").value = state.route.routeHash;
    }

    async function saveRouteSettings() {
      const route = readRouteInputs();
      state.route = route;
      await setSetting("relay_url", $("relayUrl").value.trim());
      await setSetting("relay_node_id", route.relayNode);
      await setSetting("channel_id", route.channelId);
      await setSetting("route_hash", route.routeHash);
      $("relayState").textContent = "route saved";
    }

    function readRouteInputs() {
      const route = {
        relayNode: $("relayNode").value.trim() || ZERO_HASH,
        channelId: $("channelId").value.trim() || DEFAULT_CHANNEL_ID,
        routeHash: $("routeHash").value.trim() || DEFAULT_ROUTE_HASH
      };
      if (!isHashHex(route.relayNode)) throw new Error("relay node id must be 32-byte hex");
      if (!isHashHex(route.channelId)) throw new Error("channel id must be 32-byte hex");
      if (!isHashHex(route.routeHash)) throw new Error("route hash must be 32-byte hex");
      return route;
    }

    async function newChannel() {
      if (!state.wasm) return;
      const seed = concatBytes([
        enc.encode("edgerun-chat-channel"),
        hexToBytes(state.owner || ZERO_HASH),
        enc.encode(String(Date.now())),
        crypto.getRandomValues(new Uint8Array(32))
      ]);
      $("channelId").value = wasmHashHex(seed);
      await saveRouteSettings();
    }

    async function loadChatWasm() {
      try {
        const response = await fetch("./edgerun_chat.wasm");
        if (!response.ok) throw new Error("chat wasm missing");
        const source = await response.arrayBuffer();
        const { instance } = await WebAssembly.instantiate(source, {});
        state.wasm = instance.exports;
        return true;
      } catch (error) {
        console.warn("EdgeRun chat WASM unavailable.", error);
        state.wasm = null;
        return false;
      }
    }

    function callChatWasm(name, input) {
      if (!state.wasm) throw new Error("chat wasm unavailable");
      if (input.length > state.wasm.input_capacity()) throw new Error("chat wasm input too large");
      let memory = new Uint8Array(state.wasm.memory.buffer);
      memory.set(input, state.wasm.input_ptr());
      const len = state.wasm[name](input.length);
      const status = state.wasm.status();
      if (status !== 0) throw new Error("chat wasm " + name + " failed with status " + status);
      memory = new Uint8Array(state.wasm.memory.buffer);
      return memory.slice(state.wasm.output_ptr(), state.wasm.output_ptr() + len);
    }

    function u32be(value) {
      const out = new Uint8Array(4);
      new DataView(out.buffer).setUint32(0, value, false);
      return out;
    }

    function u64be(value) {
      const out = new Uint8Array(8);
      new DataView(out.buffer).setBigUint64(0, BigInt(value), false);
      return out;
    }

    function u64From(bytes, offset) {
      return Number(new DataView(bytes.buffer, bytes.byteOffset + offset, 8).getBigUint64(0, false));
    }

    function u32From(bytes, offset) {
      return new DataView(bytes.buffer, bytes.byteOffset + offset, 4).getUint32(0, false);
    }

    function concatBytes(parts) {
      const len = parts.reduce((sum, part) => sum + part.length, 0);
      const out = new Uint8Array(len);
      let offset = 0;
      for (const part of parts) {
        out.set(part, offset);
        offset += part.length;
      }
      return out;
    }

    function initWasmIdentity() {
      const entropy = crypto.getRandomValues(new Uint8Array(64));
      const out = callChatWasm("edgerun_chat_init", entropy);
      return {
        nodeId: bytesToHex(out.slice(0, 32)),
        publicKey: bytesToHex(out.slice(32, 64))
      };
    }

    function publicIdentityFromWasm() {
      const out = callChatWasm("edgerun_chat_public_identity", new Uint8Array());
      return {
        nodeId: bytesToHex(out.slice(0, 32)),
        publicKey: bytesToHex(out.slice(32, 64))
      };
    }

    async function ensureIdentity() {
      if (!state.wasm) {
        state.owner = "";
        state.ownerPublicKey = "";
        $("identityLabel").textContent = "WASM required";
        $("ownerNode").textContent = "node unavailable";
        $("ownerPublicKey").textContent = "public key unavailable";
        $("ownContactCard").value = "";
        setComposerEnabled(false);
        return;
      }
      const sealed = await getSetting("sealed_identity");
      if (sealed) {
        state.owner = "";
        state.ownerPublicKey = "";
        $("identityLabel").textContent = "unlock identity";
        $("ownerNode").textContent = "node locked";
        $("ownerPublicKey").textContent = "public key locked";
        $("ownContactCard").value = "";
        setComposerEnabled(false);
        return;
      }
      const identity = initWasmIdentity();
      await applyIdentity(identity);
    }

    async function applyIdentity(identity) {
      state.owner = identity.nodeId;
      state.ownerPublicKey = identity.publicKey;
      await setSetting("owner_node_id", identity.nodeId);
      await setSetting("owner_public_key", identity.publicKey);
      $("identityLabel").textContent = "message node " + short(state.owner);
      $("ownerNode").textContent = "node " + state.owner;
      $("ownerPublicKey").textContent = state.ownerPublicKey ? "public key " + state.ownerPublicKey : "public key unavailable";
      refreshOwnContactCard();
    }

    function refreshOwnContactCard() {
      if (!state.wasm || !state.owner) {
        $("ownContactCard").value = "";
        return;
      }
      $("ownContactCard").value = bytesToHex(callChatWasm("edgerun_chat_contact_card", new Uint8Array()));
    }

    async function copyOwnContactCard() {
      refreshOwnContactCard();
      if (!$("ownContactCard").value) return;
      await navigator.clipboard.writeText($("ownContactCard").value);
    }

    async function importContactCard() {
      if (!state.wasm) return;
      const card = hexInputToBytes($("contactCardImport").value);
      const out = callChatWasm("edgerun_chat_import_contact_card", card);
      if (!state.selectedContactId) await createContact("Imported contact");
      $("contactNode").value = bytesToHex(out.slice(0, 32));
      $("contactPublicKey").value = bytesToHex(out.slice(32, 64));
      if (!$("contactName").value.trim()) $("contactName").value = "Imported contact";
      $("contactCardImport").value = "";
      await saveSelectedContact();
    }

    function takeUnlockBytes() {
      const input = $("unlockSecret");
      const bytes = enc.encode(input.value);
      input.value = "";
      return bytes;
    }

    async function saveIdentity() {
      if (!state.wasm || !state.owner) return;
      const unlock = takeUnlockBytes();
      if (!unlock.length) return;
      const sealed = callChatWasm("edgerun_chat_seal_identity", concatBytes([
        u32be(unlock.length),
        unlock
      ]));
      await setSetting("sealed_identity", Array.from(sealed));
      $("identityLabel").textContent = "message node " + short(state.owner);
    }

    async function unlockIdentity() {
      if (!state.wasm) return;
      const saved = await getSetting("sealed_identity");
      if (!saved) {
        const identity = initWasmIdentity();
        await applyIdentity(identity);
        return;
      }
      const sealed = new Uint8Array(saved);
      const unlock = takeUnlockBytes();
      if (!unlock.length) return;
      callChatWasm("edgerun_chat_unseal_identity", concatBytes([
        u32be(unlock.length),
        u32be(sealed.length),
        unlock,
        sealed
      ]));
      await applyIdentity(publicIdentityFromWasm());
      await refreshContacts();
    }

    async function clearSavedIdentity() {
      await del("settings", "sealed_identity");
      if (state.wasm) await applyIdentity(initWasmIdentity());
    }

    function orderedPair(a, b) {
      return a < b ? [a, b] : [b, a];
    }

    async function threadIdFor(a, b) {
      return bytesToHex(callChatWasm("edgerun_chat_thread_id", concatBytes([hexToBytes(a), hexToBytes(b)])));
    }

    async function contactHash(contact) {
      return wasmHashHex(JSON.stringify({
        primary_node_id: contact.primary_node_id,
        public_key: contact.public_key,
        display_name: contact.display_name,
        avatar_payload_hash: contact.avatar_payload_hash,
        public_ids: contact.public_ids,
        external_contacts: contact.external_contacts,
        updated_unix_ms: contact.updated_unix_ms
      }));
    }

    async function refreshContacts() {
      state.contacts = (await all("contacts")).sort((a, b) => b.updated_unix_ms - a.updated_unix_ms);
      renderContacts();
      if (!state.selectedContactId && state.contacts[0]) selectContact(state.contacts[0].contact_id);
    }

    async function createContact(name = "New contact") {
      const contact = {
        abi_version: 1,
        contact_id: "",
        primary_node_id: "",
        public_key: "",
        display_name: name,
        avatar_payload_hash: ZERO_HASH,
        public_ids: [],
        external_contacts: [],
        updated_unix_ms: Date.now()
      };
      contact.contact_id = await contactHash(contact);
      await put("contacts", contact);
      await refreshContacts();
      await selectContact(contact.contact_id);
    }

    async function saveSelectedContact() {
      const contact = state.contacts.find(c => c.contact_id === state.selectedContactId);
      if (!contact) return;
      const previousId = contact.contact_id;
      contact.display_name = $("contactName").value.trim() || "Unnamed";
      contact.primary_node_id = $("contactNode").value.trim() || contact.primary_node_id;
      contact.public_key = $("contactPublicKey").value.trim() || contact.public_key || "";
      const ext = $("contactExternal").value.trim();
      contact.external_contacts = ext ? [{ kind: 1, value: ext, label: "email" }] : [];
      contact.public_ids = [{ kind: 1, value: contact.primary_node_id, label: "message node", verified_at_unix_ms: Date.now() }];
      contact.updated_unix_ms = Date.now();
      contact.contact_id = await contactHash(contact);
      state.selectedContactId = contact.contact_id;
      await put("contacts", contact);
      if (previousId !== contact.contact_id) await del("contacts", previousId);
      await refreshContacts();
      await selectContact(contact.contact_id);
    }

    async function ensureThread(contact) {
      const id = await threadIdFor(state.owner, contact.primary_node_id);
      let thread = await request(tx("threads").get(id));
      if (!thread) {
        const [a, b] = orderedPair(state.owner, contact.primary_node_id);
        thread = {
          abi_version: 1,
          thread_id: id,
          participant_a: a,
          participant_b: b,
          created_unix_ms: Date.now(),
          updated_unix_ms: Date.now(),
          message_count: 0,
          head_message_hash: "0".repeat(64),
          tail_message_hash: "0".repeat(64),
          entries: [],
          thread_hash: ""
        };
        thread.thread_hash = wasmHashHex(JSON.stringify(thread));
        await put("threads", thread);
      }
      return thread;
    }

    async function loadThreadMessages(threadId) {
      const rows = await all("messages");
      const messages = rows
        .filter(m => m.thread_id === threadId)
        .sort((a, b) => a.sequence - b.sequence);
      for (const msg of messages) msg.text = "Encrypted message";
      state.messages = messages;
      renderMessages();
    }

    async function selectContact(contactId) {
      state.selectedContactId = contactId;
      const contact = state.contacts.find(c => c.contact_id === contactId);
      if (!contact) return;
      const canThread = canUseContact(contact) && !!state.owner;
      const thread = canThread ? await ensureThread(contact) : null;
      $("threadName").textContent = contact.display_name;
      $("threadMeta").textContent = canThread ? "node " + short(contact.primary_node_id) : "missing contact routing keys";
      $("threadAvatar").textContent = initials(contact.display_name);
      $("threadHash").textContent = thread ? thread.thread_id : "-";
      setComposerEnabled(canThread);
      $("contactName").value = contact.display_name;
      $("contactNode").value = contact.primary_node_id;
      $("contactPublicKey").value = contact.public_key || "";
      $("contactExternal").value = contact.external_contacts[0]?.value || "";
      renderContacts();
      if (thread) {
        await loadThreadMessages(thread.thread_id);
      } else {
        state.messages = [];
        renderMessages();
      }
    }

    async function sendMessage(text) {
      const contact = state.contacts.find(c => c.contact_id === state.selectedContactId);
      if (!contact || !text.trim()) return;
      if (!state.wasm || !canUseContact(contact)) {
        $("threadMeta").textContent = "missing contact routing keys";
        return;
      }
      const thread = await ensureThread(contact);
      const sequence = thread.message_count + 1;
      const plaintext = enc.encode(text.trim());
      const createdUnixMs = Date.now();
      let sealed;
      try {
        sealed = await wireEncodeEnvelope(contact, thread, sequence, createdUnixMs, plaintext);
      } catch (error) {
        $("threadMeta").textContent = error.message;
        return;
      }
      const frame = sealed.frame;
      const frameHash = sealed.frameHash;
      await put("payloads", { hash: frameHash, frame: Array.from(frame), created_unix_ms: Date.now() });
      const msg = {
        abi_version: 1,
        message_id: sealed.messageId,
        thread_id: sealed.threadId,
        from: sealed.from,
        to: sealed.to,
        sequence: sealed.sequence,
        created_unix_ms: sealed.createdUnixMs,
        message_kind: 1,
        payload_hash: sealed.payloadHash,
        payload_len: sealed.payloadLen,
        sealed_payload_hash: sealed.sealedPayloadHash,
        frame_hash: frameHash,
        storage_ref: "",
        previous_message_hash: sealed.previousMessageHash,
        status: state.connected ? "queued" : "local"
      };
      thread.entries.push({
        message_id: msg.message_id,
        payload_hash: msg.payload_hash,
        sequence: msg.sequence,
        created_unix_ms: msg.created_unix_ms,
        from: msg.from,
        message_kind: msg.message_kind
      });
      thread.message_count = sequence;
      if (/^0+$/.test(thread.tail_message_hash)) thread.tail_message_hash = msg.message_id;
      thread.head_message_hash = msg.message_id;
      thread.updated_unix_ms = msg.created_unix_ms;
      thread.thread_hash = wasmHashHex(JSON.stringify(thread));
      await put("messages", msg);
      await put("threads", thread);
      await put("outbox", msg);
      await tryFlushOutbox();
      await loadThreadMessages(thread.thread_id);
    }

    async function receiveEnvelopeFrame(frame) {
      if (!state.wasm) return;
      const sealed = sealedRecordFromBytes(callChatWasm("edgerun_chat_index_envelope", concatBytes([
        u32be(frame.length),
        frame
      ])));
      await put("payloads", { hash: sealed.frameHash, frame: Array.from(sealed.frame), created_unix_ms: Date.now() });
      const contact = state.contacts.find(c => c.primary_node_id === sealed.from || c.primary_node_id === sealed.to);
      const thread = await ensureThread(contact || {
        primary_node_id: sealed.from === state.owner ? sealed.to : sealed.from
      });
      const msg = {
        abi_version: 1,
        message_id: sealed.messageId,
        thread_id: sealed.threadId,
        from: sealed.from,
        to: sealed.to,
        sequence: sealed.sequence,
        created_unix_ms: sealed.createdUnixMs || Date.now(),
        message_kind: 1,
        payload_hash: sealed.payloadHash,
        payload_len: sealed.payloadLen,
        sealed_payload_hash: sealed.sealedPayloadHash,
        frame_hash: sealed.frameHash,
        storage_ref: "",
        previous_message_hash: sealed.previousMessageHash,
        status: "received"
      };
      await put("messages", msg);
      await put("inbox", msg);
      await mergeThreadMessage(thread, msg);
      if (thread.thread_id === $("threadHash").textContent) await loadThreadMessages(thread.thread_id);
    }

    async function mergeThreadMessage(thread, msg) {
      if (!thread.entries.some(entry => entry.message_id === msg.message_id)) {
        thread.entries.push({
          message_id: msg.message_id,
          payload_hash: msg.payload_hash,
          sequence: msg.sequence,
          created_unix_ms: msg.created_unix_ms,
          from: msg.from,
          message_kind: msg.message_kind
        });
      }
      thread.entries.sort((a, b) => a.sequence - b.sequence);
      thread.message_count = thread.entries.length;
      thread.tail_message_hash = thread.entries[0]?.message_id || ZERO_HASH;
      thread.head_message_hash = thread.entries[thread.entries.length - 1]?.message_id || ZERO_HASH;
      thread.updated_unix_ms = Math.max(thread.updated_unix_ms || 0, msg.created_unix_ms);
      thread.thread_hash = wasmHashHex(JSON.stringify(thread));
      await put("threads", thread);
    }

    async function wireEncodeEnvelope(contact, thread, sequence, createdUnixMs, plaintext) {
      if (!state.wasm) throw new Error("chat wasm unavailable");
      if (!contact?.public_key) throw new Error("recipient public key missing");
      const route = readRouteInputs();
      state.route = route;
      const record = callChatWasm("edgerun_chat_seal_envelope", concatBytes([
        hexToBytes(contact.primary_node_id),
        hexToBytes(contact.public_key),
        hexToBytes(route.relayNode),
        hexToBytes(route.channelId),
        hexToBytes(route.routeHash),
        hexToBytes(thread.head_message_hash || ZERO_HASH),
        u64be(sequence),
        u64be(createdUnixMs),
        u32be(plaintext.length),
        plaintext
      ]));
      return sealedRecordFromBytes(record);
    }

    function sealedRecordFromBytes(record) {
      if (record.length < SEALED_RECORD_HEADER_LEN) throw new Error("short sealed record");
      const frameLen = u32From(record, 280);
      if (SEALED_RECORD_HEADER_LEN + frameLen !== record.length) throw new Error("sealed record length mismatch");
      return {
        messageId: bytesToHex(record.slice(0, 32)),
        threadId: bytesToHex(record.slice(32, 64)),
        payloadHash: bytesToHex(record.slice(64, 96)),
        sealedPayloadHash: bytesToHex(record.slice(96, 128)),
        frameHash: bytesToHex(record.slice(128, 160)),
        from: bytesToHex(record.slice(160, 192)),
        to: bytesToHex(record.slice(192, 224)),
        previousMessageHash: bytesToHex(record.slice(224, 256)),
        sequence: u64From(record, 256),
        createdUnixMs: u64From(record, 264),
        payloadLen: u64From(record, 272),
        frame: record.slice(SEALED_RECORD_HEADER_LEN)
      };
    }

    async function tryFlushOutbox() {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
      if (!state.wasm) return;
      const rows = await all("outbox");
      for (const msg of rows) {
        try {
          const payload = await request(tx("payloads").get(msg.frame_hash));
          if (!payload?.frame) throw new Error("missing sealed frame");
          state.ws.send(new Uint8Array(payload.frame));
          msg.status = "sent";
          await put("messages", msg);
          await del("outbox", msg.message_id);
        } catch (_error) {
          msg.status = "failed";
          await put("messages", msg);
        }
      }
    }

    function isHashHex(value) {
      return /^[0-9a-fA-F]{64}$/.test(value || "");
    }

    function canUseContact(contact) {
      return !!state.wasm && isHashHex(contact?.primary_node_id) && isHashHex(contact?.public_key);
    }

    function setComposerEnabled(enabled) {
      $("messageInput").disabled = !enabled;
      $("sendBtn").disabled = !enabled;
    }

    function renderContacts() {
      const q = $("searchInput").value.trim().toLowerCase();
      const visible = state.contacts.filter(c => c.display_name.toLowerCase().includes(q));
      $("contacts").innerHTML = visible.map(c => `
        <button class="contact-row ${c.contact_id === state.selectedContactId ? "active" : ""}" data-id="${c.contact_id}">
          <span class="avatar">${initials(c.display_name)}</span>
          <span>
            <strong>${escapeHtml(c.display_name)}</strong>
            <span class="small">node ${short(c.primary_node_id)}</span>
          </span>
        </button>
      `).join("");
      document.querySelectorAll(".contact-row").forEach(btn => {
        btn.onclick = () => selectContact(btn.dataset.id);
      });
    }

    function renderMessages() {
      if (!state.messages.length) {
        $("messages").innerHTML = '<div class="empty">No messages yet.</div>';
        return;
      }
      $("messages").innerHTML = state.messages.map(m => `
        <article class="msg ${m.from === state.owner ? "me" : ""}">
          <p>${escapeHtml(m.text || "")}</p>
          <div class="meta">
            <span>${new Date(m.created_unix_ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
            <span class="${m.status === "failed" ? "failed" : m.status === "queued" ? "queued" : ""}">${m.status || "stored"}</span>
          </div>
        </article>
      `).join("");
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function setRelayState(kind, text) {
      $("relayDot").className = "status-dot" + (kind ? " " + kind : "");
      $("relayState").textContent = text;
      $("connectBtn").disabled = kind === "on";
      $("disconnectBtn").disabled = kind !== "on";
    }

    async function connectRelay() {
      if (!state.wasm) {
        setRelayState("bad", "WASM required");
        return;
      }
      const url = $("relayUrl").value.trim();
      if (!url) return;
      try {
        await saveRouteSettings();
      } catch (error) {
        setRelayState("bad", error.message);
        return;
      }
      const ws = new WebSocket(url, "edgerun-work-v1");
      ws.binaryType = "arraybuffer";
      ws.onopen = async () => {
        state.ws = ws;
        state.connected = true;
        setRelayState("on", "connected");
        await tryFlushOutbox();
        const contact = state.contacts.find(c => c.contact_id === state.selectedContactId);
        if (contact) await loadThreadMessages((await ensureThread(contact)).thread_id);
      };
      ws.onclose = () => {
        state.connected = false;
        if (state.ws === ws) state.ws = null;
        setRelayState("", "disconnected");
      };
      ws.onerror = () => setRelayState("bad", "connection error");
      ws.onmessage = async event => {
        const data = event.data instanceof ArrayBuffer
          ? new Uint8Array(event.data)
          : new Uint8Array(await event.data.arrayBuffer());
        await receiveEnvelopeFrame(data);
      };
      setRelayState("", "connecting");
    }

    function disconnectRelay() {
      if (state.ws) state.ws.close();
      state.ws = null;
      state.connected = false;
      setRelayState("", "disconnected");
    }

    $("newContactBtn").onclick = () => createContact();
    $("saveContactBtn").onclick = saveSelectedContact;
    $("unlockIdentityBtn").onclick = unlockIdentity;
    $("saveIdentityBtn").onclick = saveIdentity;
    $("clearIdentityBtn").onclick = clearSavedIdentity;
    $("refreshCardBtn").onclick = refreshOwnContactCard;
    $("copyCardBtn").onclick = copyOwnContactCard;
    $("importCardBtn").onclick = importContactCard;
    $("connectBtn").onclick = connectRelay;
    $("disconnectBtn").onclick = disconnectRelay;
    $("saveRouteBtn").onclick = saveRouteSettings;
    $("newChannelBtn").onclick = newChannel;
    $("searchInput").oninput = renderContacts;
    $("composer").onsubmit = async event => {
      event.preventDefault();
      const input = $("messageInput");
      const text = input.value;
      input.value = "";
      await sendMessage(text);
    };

    (async function init() {
      await openDb();
      await loadRouteSettings();
      const wasmReady = await loadChatWasm();
      await ensureIdentity();
      await refreshContacts();
      if (!wasmReady) {
        $("messages").innerHTML = '<div class="empty">edgerun_chat.wasm is required.</div>';
        $("newContactBtn").disabled = true;
        $("saveContactBtn").disabled = true;
        $("importCardBtn").disabled = true;
        $("refreshCardBtn").disabled = true;
        $("copyCardBtn").disabled = true;
        $("connectBtn").disabled = true;
        $("saveRouteBtn").disabled = true;
        $("newChannelBtn").disabled = true;
        return;
      }
      if (!state.contacts.length) await createContact("New contact");
    })().catch(error => {
      console.error(error);
      $("messages").innerHTML = '<div class="empty">Failed to open local chat store.</div>';
    });
  </script>
</body>
</html>
