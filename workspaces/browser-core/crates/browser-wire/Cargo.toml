[package]
name = "edgerun-browser-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "minimal rkyv-only EdgeRun browser wire boundary"

[lib]
name = "edgerun_browser_wire"

[features]
default = []
std = []

[dependencies]
edgerun-crypto = { path = "../../../../crates/utility/edgerun-crypto", default-features = false, features = ["sha2"] }
rkyv = { path = "../../../../crates/utility/edgerun-rkyv", default-features = false, features = ["alloc", "bytecheck"] }

[lints]
workspace = true
