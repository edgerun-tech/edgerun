name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace

      - name: Workspace metadata
        run: cargo metadata --no-deps --format-version 1 >/tmp/edgerun_metadata.json

      - name: License policy
        run: cargo deny check licenses

      - name: Internal path dependency versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad = []
          line_re = re.compile(
              r'^\s*edgerun-[A-Za-z0-9_-]+\s*=\s*\{'
              r'(?=[^}\n]*\bpath\s*=)(?![^}\n]*\bversion\s*=)'
          )
          roots = [Path('Cargo.toml'), Path('crates'), Path('devices'), Path('programs'), Path('scripts')]
          for root in roots:
              files = [root] if root.is_file() else root.rglob('Cargo.toml')
              for path in files:
                  text_path = str(path)
                  if '/.embuild/' in text_path or '/tests/runc/src/' in text_path:
                      continue
                  for line_no, line in enumerate(path.read_text().splitlines(), 1):
                      if line_re.search(line):
                          bad.append(f'{path}:{line_no}:{line}')
          if bad:
              print('Internal edgerun path dependencies need version requirements:')
              print('\n'.join(bad))
              raise SystemExit(1)
          PY

      - name: Package previews
        run: |
          cargo package -p edgerun-log --list --allow-dirty
          cargo package -p edgerun-wire --list --allow-dirty
          cargo package -p edgerun-core --list --allow-dirty

      - name: Release binary check
        run: cargo check -p edgerun-node

      - name: Docker build check
        run: docker build --target builder --file Dockerfile .

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Integration targets
        run: ./scripts/integration-tests.py --list

      - name: Integration tests
        run: ./scripts/integration-tests.py

      - name: Benchmark entry points
        run: ./scripts/benchmark-report.py --list

      - name: Benchmark smoke
        run: ./scripts/benchmark-report.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust coverage report
        env:
          RUST_COVERAGE_PACKAGES: edgerun-core edgerun-stream edgerun-storage edgerun-node
        run: ./scripts/coverage-report.sh --rust-only --require-rust-tool

      - name: Upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: target/coverage/rust

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: target/benchmarks
