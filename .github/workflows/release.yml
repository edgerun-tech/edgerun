name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1 >/tmp/edgerun_metadata.json

      - name: Build
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          cargo build --release -p edgerun-node
          mkdir -p release
          cp target/release/edgerund "release/edgerund-${V}-linux-amd64"
          cp LICENSE LICENSE-MIT LICENSE-APACHE NOTICE release/
          (cd release && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: edgerun-release
          path: release/*

      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
