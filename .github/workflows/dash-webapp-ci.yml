name: Dash Webapp CI

on:
  push:
    paths:
      - "crates/edgerun-dash-webapp/**"
      - ".github/workflows/dash-webapp-ci.yml"
  pull_request:
    paths:
      - "crates/edgerun-dash-webapp/**"
      - ".github/workflows/dash-webapp-ci.yml"

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/edgerun-dash-webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
