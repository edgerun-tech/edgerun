id = "udp-tftp-must-program"
name = "UDP plus TFTP MUST-only program"
profile = "must-only"
description = "Seed composed RFC program for UDP payloads carrying TFTP messages."

definitions = [
  "udp-datagram",
  "tftp-message",
]

clauses = [
  "udp-rfc768-length-0001",
  "tftp-rfc1350-opcode-0001",
  "tftp-rfc1350-ack-length-0001",
  "tftp-rfc1350-data-length-0001",
]

components = []
depends_on = []

[[edge]]
from = "udp-datagram"
to = "tftp-message"
type = "udp-payload"
predicate = "udp.destination_port == 69 || udp.source_port == 69"

[identity]
profile_sha256 = ""
clause_set_sha256 = ""
component_graph_sha256 = ""
program_sha256 = ""
