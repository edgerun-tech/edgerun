id = "ipv6"
name = "Internet Protocol Version 6"
summary = "Packet format, addressing, extension headers, and host behavior for IPv6 networks."
layer = "network"
runs_over = ["Ethernet"]
depends_on = ["Ethernet"]
implementation_crates = []
profiles = ["ipv6-minimal-host", "bare-metal-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = true
requires_entropy = false
requires_network_io = true
requires_packet_io = true
requires_stream_io = false
requires_filesystem = false
requires_threads = false
requires_allocator = false
requires_crypto = false
no_std_viability = "plausible"
bare_metal_viability = "plausible-with-link-io"

[[standard]]
id = "RFC8200"
title = "Internet Protocol, Version 6 (IPv6) Specification"
url = "https://www.rfc-editor.org/rfc/rfc8200.html"
xml = "https://www.rfc-editor.org/rfc/rfc8200.xml"
status = "Internet Standard"
published = "2017-07"
role = "base"

[[registry]]
name = "Internet Protocol Version 6 (IPv6) Parameters"
url = "https://www.iana.org/assignments/ipv6-parameters/ipv6-parameters.xhtml"
owner = "IANA"

[[behavior]]
id = "ipv6-header-parse"
kind = "packet-format"
standards = ["RFC8200"]
implementation = []
status = "unknown"

[[behavior]]
id = "ipv6-extension-header-chain"
kind = "packet-format"
standards = ["RFC8200"]
implementation = []
status = "unknown"

[composition]
accepts = ["ethernet-frame"]
emits = ["ipv6-packet"]
lower = ["ethernet"]
upper = ["icmpv6", "tcp", "udp"]

