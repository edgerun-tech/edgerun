id = "udp"
name = "User Datagram Protocol"
summary = "Connectionless transport datagram format over IP."
layer = "transport"
runs_over = ["IPv4", "IPv6"]
depends_on = ["IPv4", "IPv6"]
implementation_crates = []
profiles = ["udp-datagram-codec", "bare-metal-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = false
requires_entropy = false
requires_network_io = true
requires_packet_io = true
requires_stream_io = false
requires_filesystem = false
requires_threads = false
requires_allocator = false
requires_crypto = false
no_std_viability = "plausible"
bare_metal_viability = "plausible-with-ip"

[[standard]]
id = "RFC768"
title = "User Datagram Protocol"
url = "https://www.rfc-editor.org/rfc/rfc768.html"
xml = "https://www.rfc-editor.org/rfc/rfc768.xml"
status = "Internet Standard"
published = "1980-08"
role = "base"

[[standard]]
id = "RFC1122"
title = "Requirements for Internet Hosts - Communication Layers"
url = "https://www.rfc-editor.org/rfc/rfc1122.html"
xml = "https://www.rfc-editor.org/rfc/rfc1122.xml"
status = "Internet Standard"
published = "1989-10"
role = "host-requirements"

[[registry]]
name = "Service Name and Transport Protocol Port Number Registry"
url = "https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml"
owner = "IANA"

[[behavior]]
id = "udp-header-parse"
kind = "packet-format"
standards = ["RFC768"]
implementation = []
status = "unknown"

[[behavior]]
id = "udp-checksum"
kind = "checksum"
standards = ["RFC768", "RFC1122"]
implementation = []
status = "unknown"

[composition]
accepts = ["ipv4-packet", "ipv6-packet"]
emits = ["udp-datagram"]
lower = ["ipv4", "ipv6"]
upper = ["dhcpv4", "dhcpv6", "dns", "quic", "tftp"]

