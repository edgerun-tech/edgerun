id = "tls"
name = "Transport Layer Security"
summary = "Cryptographic protocol for authenticated key exchange and secure records."
layer = "security"
runs_over = ["TCP", "QUIC"]
depends_on = []
implementation_crates = [
  "standards/build/wasm/codec-primitives/tls-frame.wat",
  "standards/build/wasm/codec-primitives/tls-vector.wat",
  "standards/build/wasm/codec-primitives/tls-clienthello.wat",
  "standards/build/wasm/codec-primitives/tls-extension-walk.wat",
  "standards/build/wasm/codec-primitives/tls-certificate-list.wat",
  "standards/build/wasm/codec-primitives/tls-core-state.wat",
]
profiles = ["client", "server", "no_std-candidate", "unikernel-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = true
requires_entropy = true
requires_network_io = true
requires_packet_io = false
requires_stream_io = true
requires_filesystem = false
requires_threads = false
requires_allocator = true
requires_crypto = true
no_std_viability = "plausible-with-alloc"
bare_metal_viability = "plausible-with-clock-entropy-io"

[[standard]]
id = "RFC8446"
title = "The Transport Layer Security (TLS) Protocol Version 1.3"
url = "https://www.rfc-editor.org/rfc/rfc8446.html"
xml = "https://www.rfc-editor.org/rfc/rfc8446.xml"
status = "Proposed Standard"
published = "2018-08"
role = "base"

[[registry]]
name = "Transport Layer Security (TLS) Parameters"
url = "https://www.iana.org/assignments/tls-parameters/tls-parameters.xhtml"
owner = "IANA"

[[behavior]]
id = "tls13-handshake"
kind = "state-machine"
standards = ["RFC8446"]
implementation = [
  "standards/build/wasm/codec-primitives/tls-clienthello.wat",
  "standards/build/wasm/codec-primitives/tls-extension-walk.wat",
  "standards/build/wasm/codec-primitives/tls-core-state.wat",
]
status = "wat-available"

[[behavior]]
id = "tls13-record-layer"
kind = "record-format"
standards = ["RFC8446"]
implementation = [
  "standards/build/wasm/codec-primitives/tls-frame.wat",
  "standards/build/wasm/codec-primitives/tls-vector.wat",
]
status = "wat-available"
