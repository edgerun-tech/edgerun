id = "qpack"
name = "QPACK"
summary = "Header compression format for HTTP/3 over QUIC."
layer = "presentation"
runs_over = ["HTTP/3", "QUIC"]
depends_on = ["HTTP/3", "QUIC"]
implementation_crates = ["crates/utility/edgerun-qpack"]
profiles = ["encoder", "decoder", "no_std-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = false
requires_entropy = false
requires_network_io = false
requires_packet_io = false
requires_stream_io = false
requires_filesystem = false
requires_threads = false
requires_allocator = true
requires_crypto = false
no_std_viability = "plausible-with-alloc"
bare_metal_viability = "plausible"

[[standard]]
id = "RFC9204"
title = "QPACK: Field Compression for HTTP/3"
url = "https://www.rfc-editor.org/rfc/rfc9204.html"
xml = "https://www.rfc-editor.org/rfc/rfc9204.xml"
status = "Proposed Standard"
published = "2022-06"
role = "base"

[[behavior]]
id = "qpack-integer-codec"
kind = "codec"
standards = ["RFC9204"]
implementation = ["crates/utility/edgerun-qpack"]
status = "unknown"

[[behavior]]
id = "qpack-blocking"
kind = "state-machine"
standards = ["RFC9204"]
implementation = ["crates/utility/edgerun-qpack"]
status = "unknown"

