id = "ipv4"
name = "Internet Protocol Version 4"
summary = "Packet format, addressing, fragmentation, and forwarding basis for IPv4 networks."
layer = "network"
runs_over = ["Ethernet"]
depends_on = ["Ethernet"]
implementation_crates = []
profiles = ["ipv4-minimal-host", "bare-metal-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = true
requires_entropy = false
requires_network_io = true
requires_packet_io = true
requires_stream_io = false
requires_filesystem = false
requires_threads = false
requires_allocator = false
requires_crypto = false
no_std_viability = "plausible"
bare_metal_viability = "plausible-with-link-io"

[[standard]]
id = "RFC791"
title = "Internet Protocol"
url = "https://www.rfc-editor.org/rfc/rfc791.html"
xml = "https://www.rfc-editor.org/rfc/rfc791.xml"
status = "Internet Standard"
published = "1981-09"
role = "base"

[[standard]]
id = "RFC1122"
title = "Requirements for Internet Hosts - Communication Layers"
url = "https://www.rfc-editor.org/rfc/rfc1122.html"
xml = "https://www.rfc-editor.org/rfc/rfc1122.xml"
status = "Internet Standard"
published = "1989-10"
role = "host-requirements"

[[registry]]
name = "Protocol Numbers"
url = "https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml"
owner = "IANA"

[[behavior]]
id = "ipv4-header-parse"
kind = "packet-format"
standards = ["RFC791"]
implementation = []
status = "unknown"

[[behavior]]
id = "ipv4-header-checksum"
kind = "checksum"
standards = ["RFC791"]
implementation = []
status = "unknown"

[composition]
accepts = ["ethernet-frame"]
emits = ["ipv4-packet"]
lower = ["ethernet"]
upper = ["icmpv4", "tcp", "udp"]

