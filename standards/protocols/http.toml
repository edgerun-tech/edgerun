id = "http"
name = "HTTP"
summary = "Application semantics and message mappings for HTTP/1.1, HTTP/2, and HTTP/3."
layer = "application"
runs_over = ["TCP", "TLS", "QUIC"]
depends_on = ["HPACK for HTTP/2", "QPACK for HTTP/3"]
implementation_crates = ["crates/edgerun-http"]
profiles = ["client", "server", "proxy", "no_std-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = false
requires_entropy = false
requires_network_io = true
requires_packet_io = false
requires_stream_io = true
requires_filesystem = false
requires_threads = false
requires_allocator = true
requires_crypto = false
no_std_viability = "plausible-with-alloc"
bare_metal_viability = "plausible-with-io"

[[standard]]
id = "RFC9110"
title = "HTTP Semantics"
url = "https://www.rfc-editor.org/rfc/rfc9110.html"
xml = "https://www.rfc-editor.org/rfc/rfc9110.xml"
status = "Internet Standard"
published = "2022-06"
role = "semantics"

[[standard]]
id = "RFC9112"
title = "HTTP/1.1"
url = "https://www.rfc-editor.org/rfc/rfc9112.html"
xml = "https://www.rfc-editor.org/rfc/rfc9112.xml"
status = "Internet Standard"
published = "2022-06"
role = "http1"

[[standard]]
id = "RFC9113"
title = "HTTP/2"
url = "https://www.rfc-editor.org/rfc/rfc9113.html"
xml = "https://www.rfc-editor.org/rfc/rfc9113.xml"
status = "Internet Standard"
published = "2022-06"
role = "http2"

[[standard]]
id = "RFC9114"
title = "HTTP/3"
url = "https://www.rfc-editor.org/rfc/rfc9114.html"
xml = "https://www.rfc-editor.org/rfc/rfc9114.xml"
status = "Proposed Standard"
published = "2022-06"
role = "http3"

[[registry]]
name = "Hypertext Transfer Protocol (HTTP) Status Code Registry"
url = "https://www.iana.org/assignments/http-status-codes/http-status-codes.xhtml"
owner = "IANA"

[[registry]]
name = "HTTP Field Name Registry"
url = "https://www.iana.org/assignments/http-fields/http-fields.xhtml"
owner = "IANA"

[[behavior]]
id = "http-message-parsing"
kind = "message-format"
standards = ["RFC9110", "RFC9112"]
implementation = ["crates/edgerun-http"]
status = "unknown"

[[behavior]]
id = "http-content-coding"
kind = "semantics"
standards = ["RFC9110"]
implementation = ["crates/edgerun-http/src/http1/compression.rs"]
status = "unknown"

