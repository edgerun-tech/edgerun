id = "bt-stdio"
name = "Bluetooth Stdio Tunnel"
summary = "Encrypted bidirectional stdio tunnel over Bluetooth with TPM hardware identity."
layer = "application"
runs_over = ["bluetooth"]
depends_on = ["bluetooth"]
implementation_crates = []
profiles = ["stdio-tunnel", "tpm-identity"]
standards_bodies = ["EdgeRun"]

[environment]
requires_clock = true
requires_entropy = true
requires_network_io = false
requires_packet_io = true
requires_stream_io = true
requires_filesystem = true
requires_threads = true
requires_allocator = true
requires_crypto = true
tpm_required = true
no_std_viability = "unknown"
bare_metal_viability = "plausible-with-tpm"

[[standard]]
id = "ER-BT-STDIO-1"
title = "Bluetooth Stdio Tunnel Protocol v1"
url = ""
status = "private"
published = "2026-06"
role = "protocol-spec"

[[standard]]
id = "TPM2-1.38"
title = "TPM 2.0 Library Specification"
url = "https://trustedcomputinggroup.org/resource/tpm-library-specification/"
status = "ISO/IEC 11889"
published = "2019-11"
role = "tpm-spec"

[[behavior]]
id = "bt-stdio-handshake"
kind = "state-machine"
standards = ["ER-BT-STDIO-1"]
implementation = ["implementations/bt-stdio/"]
status = "implemented"

[[behavior]]
id = "bt-stdio-data"
kind = "data-flow"
standards = ["ER-BT-STDIO-1"]
implementation = ["implementations/bt-stdio/"]
status = "implemented"
