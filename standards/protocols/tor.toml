[[behavior]]
id = "tor-hidden-service-descriptor-crypto"
kind = "descriptor-encryption"
standards = ["tor-spec"]
implementation = ["standards/build/wasm/app-primitives/tor-hs-descriptor-crypto/tor-hs-descriptor-crypto.wat"]
