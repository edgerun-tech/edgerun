id = "tftp"
name = "Trivial File Transfer Protocol"
summary = "Small lock-step file transfer protocol over UDP, useful for boot and provisioning flows."
layer = "application"
runs_over = ["UDP"]
depends_on = []
implementation_crates = ["crates/protocol/edgerun-protocols"]
profiles = ["client", "server", "boot"]
standards_bodies = ["IETF"]

[environment]
requires_clock = true
requires_entropy = false
requires_network_io = true
requires_packet_io = true
requires_stream_io = false
requires_filesystem = true
requires_threads = false
requires_allocator = false
requires_crypto = false
no_std_viability = "plausible"
bare_metal_viability = "plausible-with-clock-udp-storage"

[[standard]]
id = "RFC1350"
title = "The TFTP Protocol (Revision 2)"
url = "https://www.rfc-editor.org/rfc/rfc1350.html"
xml = "https://www.rfc-editor.org/rfc/rfc1350.xml"
status = "Internet Standard"
published = "1992-07"
role = "base"

[[standard]]
id = "RFC2347"
title = "TFTP Option Extension"
url = "https://www.rfc-editor.org/rfc/rfc2347.html"
xml = "https://www.rfc-editor.org/rfc/rfc2347.xml"
status = "Proposed Standard"
published = "1998-05"
role = "options"

[[standard]]
id = "RFC2348"
title = "TFTP Blocksize Option"
url = "https://www.rfc-editor.org/rfc/rfc2348.html"
xml = "https://www.rfc-editor.org/rfc/rfc2348.xml"
status = "Proposed Standard"
published = "1998-05"
role = "blocksize"

[[standard]]
id = "RFC2349"
title = "TFTP Timeout Interval and Transfer Size Options"
url = "https://www.rfc-editor.org/rfc/rfc2349.html"
xml = "https://www.rfc-editor.org/rfc/rfc2349.xml"
status = "Proposed Standard"
published = "1998-05"
role = "timeout-tsize"

[[registry]]
name = "Trivial File Transfer Protocol (TFTP) Opcodes"
url = "https://www.iana.org/assignments/tftp-parameters/tftp-parameters.xhtml"
owner = "IANA"

[[behavior]]
id = "tftp-lockstep-transfer"
kind = "state-machine"
standards = ["RFC1350"]
implementation = ["crates/protocol/edgerun-protocols"]
status = "unknown"
