id = "quic"
name = "QUIC"
summary = "UDP-based multiplexed transport with TLS 1.3 integration, loss recovery, and congestion control."
layer = "transport"
runs_over = ["UDP"]
depends_on = ["TLS 1.3"]
implementation_crates = ["crates/edgerun-quic"]
profiles = ["client", "server", "no_std-candidate", "unikernel-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = true
requires_entropy = true
requires_network_io = true
requires_packet_io = true
requires_stream_io = false
requires_filesystem = false
requires_threads = false
requires_allocator = true
requires_crypto = true
no_std_viability = "plausible-with-alloc"
bare_metal_viability = "plausible-with-clock-entropy-udp"

[[standard]]
id = "RFC9000"
title = "QUIC: A UDP-Based Multiplexed and Secure Transport"
url = "https://www.rfc-editor.org/rfc/rfc9000.html"
xml = "https://www.rfc-editor.org/rfc/rfc9000.xml"
status = "Proposed Standard"
published = "2021-05"
role = "base"

[[standard]]
id = "RFC9001"
title = "Using TLS to Secure QUIC"
url = "https://www.rfc-editor.org/rfc/rfc9001.html"
xml = "https://www.rfc-editor.org/rfc/rfc9001.xml"
status = "Proposed Standard"
published = "2021-05"
role = "security"

[[standard]]
id = "RFC9002"
title = "QUIC Loss Detection and Congestion Control"
url = "https://www.rfc-editor.org/rfc/rfc9002.html"
xml = "https://www.rfc-editor.org/rfc/rfc9002.xml"
status = "Proposed Standard"
published = "2021-05"
role = "recovery"

[[registry]]
name = "QUIC"
url = "https://www.iana.org/assignments/quic/quic.xhtml"
owner = "IANA"

[[behavior]]
id = "quic-packet-parsing"
kind = "packet-format"
standards = ["RFC9000"]
implementation = ["crates/edgerun-quic"]
status = "unknown"

[[behavior]]
id = "quic-version-negotiation"
kind = "state-machine"
standards = ["RFC9000"]
implementation = ["crates/edgerun-quic"]
status = "unknown"

