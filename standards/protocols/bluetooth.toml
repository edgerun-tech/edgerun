id = "bluetooth"
name = "Bluetooth"
summary = "Short-range wireless protocol family including BR/EDR (classic) and BLE (Low Energy)."
layer = "link"
runs_over = []
depends_on = []
implementation_crates = []
profiles = ["spp-server", "ble-gatt-server", "ble-uart-service"]
standards_bodies = ["Bluetooth SIG"]

[environment]
requires_clock = true
requires_entropy = false
requires_network_io = false
requires_packet_io = true
requires_stream_io = true
requires_filesystem = false
requires_threads = true
requires_allocator = true
requires_crypto = false
no_std_viability = "unknown"
bare_metal_viability = "plausible-with-ble-driver"

[[standard]]
id = "BLUETOOTH-CORE-5.4"
title = "Bluetooth Core Specification 5.4"
url = "https://www.bluetooth.com/specifications/specs/core-specification-5-4/"
status = "adopted"
published = "2023-02"
role = "base"

[[standard]]
id = "BLUETOOTH-SPP-1.2"
title = "Serial Port Profile 1.2"
url = "https://www.bluetooth.com/specifications/specs/serial-port-profile-1-2/"
status = "adopted"
published = "2012-07"
role = "serial-port-profile"

[[standard]]
id = "BLUETOOTH-GATT-1.1"
title = "GATT Specification Supplement 1.1"
url = "https://www.bluetooth.com/specifications/specs/gatt-specification-supplement-1-1/"
status = "adopted"
published = "2022-08"
role = "gatt-profile"

[[behavior]]
id = "bt-spp-accept"
kind = "state-machine"
standards = ["BLUETOOTH-SPP-1.2"]
implementation = ["implementations/bt-ssh-bridge/"]
status = "implemented"

[[behavior]]
id = "bt-ble-uart-service"
kind = "state-machine"
standards = ["BLUETOOTH-GATT-1.1"]
implementation = ["implementations/bt-ssh-bridge/"]
status = "implemented"
