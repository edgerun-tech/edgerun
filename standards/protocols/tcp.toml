id = "tcp"
name = "Transmission Control Protocol"
summary = "Reliable ordered byte-stream transport over IP."
layer = "transport"
runs_over = ["IPv4", "IPv6"]
depends_on = ["IPv4", "IPv6"]
implementation_crates = []
profiles = ["tcp-segment-codec", "tcp-minimal-host", "bare-metal-candidate"]
standards_bodies = ["IETF"]

[environment]
requires_clock = true
requires_entropy = true
requires_network_io = true
requires_packet_io = true
requires_stream_io = true
requires_filesystem = false
requires_threads = false
requires_allocator = true
requires_crypto = false
no_std_viability = "plausible-with-alloc"
bare_metal_viability = "plausible-with-clock-entropy-ip"

[[standard]]
id = "RFC9293"
title = "Transmission Control Protocol (TCP)"
url = "https://www.rfc-editor.org/rfc/rfc9293.html"
xml = "https://www.rfc-editor.org/rfc/rfc9293.xml"
status = "Internet Standard"
published = "2022-08"
role = "base"

[[standard]]
id = "RFC1122"
title = "Requirements for Internet Hosts - Communication Layers"
url = "https://www.rfc-editor.org/rfc/rfc1122.html"
xml = "https://www.rfc-editor.org/rfc/rfc1122.xml"
status = "Internet Standard"
published = "1989-10"
role = "host-requirements"

[[registry]]
name = "Transmission Control Protocol (TCP) Parameters"
url = "https://www.iana.org/assignments/tcp-parameters/tcp-parameters.xhtml"
owner = "IANA"

[[registry]]
name = "Service Name and Transport Protocol Port Number Registry"
url = "https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml"
owner = "IANA"

[[behavior]]
id = "tcp-segment-parse"
kind = "packet-format"
standards = ["RFC9293"]
implementation = []
status = "unknown"

[[behavior]]
id = "tcp-state-machine"
kind = "state-machine"
standards = ["RFC9293"]
implementation = []
status = "unknown"

[[behavior]]
id = "tcp-checksum"
kind = "checksum"
standards = ["RFC9293"]
implementation = []
status = "unknown"

[composition]
accepts = ["ipv4-packet", "ipv6-packet"]
emits = ["tcp-segment", "tcp-stream-event"]
lower = ["ipv4", "ipv6"]
upper = ["http", "tls"]

