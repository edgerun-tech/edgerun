[[case]]
id = "valid-ack"
file = "valid-ack.hex"
description = "UDP datagram carrying a valid TFTP ACK for block 1."
expect_exit = 0
expect = [
  ["udp-rfc768-length-0001", "pass"],
  ["tftp-rfc1350-opcode-0001", "pass"],
  ["tftp-rfc1350-ack-length-0001", "pass"],
  ["tftp-rfc1350-data-length-0001", "pass"],
]

[[case]]
id = "invalid-udp-length"
file = "invalid-length.hex"
description = "UDP length field is larger than the actual datagram."
expect_exit = 2
expect = [
  ["udp-rfc768-length-0001", "reject"],
]

[[case]]
id = "invalid-ack-length"
file = "invalid-ack-length.hex"
description = "TFTP ACK opcode with an extra trailing octet."
expect_exit = 2
expect = [
  ["udp-rfc768-length-0001", "pass"],
  ["tftp-rfc1350-opcode-0001", "pass"],
  ["tftp-rfc1350-ack-length-0001", "reject"],
  ["tftp-rfc1350-data-length-0001", "pass"],
]

[[case]]
id = "invalid-data-length"
file = "invalid-data-length.hex"
description = "TFTP DATA opcode without a two-octet block number."
expect_exit = 2
expect = [
  ["udp-rfc768-length-0001", "pass"],
  ["tftp-rfc1350-opcode-0001", "pass"],
  ["tftp-rfc1350-ack-length-0001", "pass"],
  ["tftp-rfc1350-data-length-0001", "reject"],
]

[[case]]
id = "invalid-opcode"
file = "invalid-opcode.hex"
description = "UDP datagram carrying an unknown TFTP opcode."
expect_exit = 2
expect = [
  ["udp-rfc768-length-0001", "pass"],
  ["tftp-rfc1350-opcode-0001", "reject"],
  ["tftp-rfc1350-ack-length-0001", "pass"],
  ["tftp-rfc1350-data-length-0001", "pass"],
]
