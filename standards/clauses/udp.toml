[[clause]]
id = "udp-rfc768-length-0001"
standard = "RFC768"
section = "Format"
paragraph = ""
keyword = "MUST"
kind = "constraint"
subject = "udp-datagram"
text = "The UDP length field covers the header and data octets."

[clause.input]
type = "udp-datagram"
bindings = { length = "field.length", payload_len = "len(field.payload)" }

[clause.predicate]
language = "edgerun-clause-expr"
expr = "length >= 8 && length == payload_len + 8"

[clause.on_violation]
severity = "reject"
code = "UDP_LENGTH_INVALID"
message = "UDP length does not match header plus payload length."

[clause.wasm]
manifest = "standards/components/manifests/udp-rfc768-length-0001.toml"
sha256 = ""

[clause.review]
status = "draft"
reviewer = ""
notes = "Seed clause for proving the clause/policy model."

