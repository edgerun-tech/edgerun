id = "codec-http1-lines"
name = "http1-lines"
kind = "codec-primitive"
version = "0.1.0"
standard_id = 300008
abi_version = 2
wat = "standards/build/wasm/codec-primitives/http1-lines.wat"
runner = "standards/runners/http1-lines-smoke.js"
entrypoint = "proto_abi_version"
