id = "codec-yaml-scan"
name = "yaml-scan"
kind = "codec-primitive"
version = "0.1.0"
standard_id = 300042
abi_version = 2
wat = "standards/build/wasm/codec-primitives/yaml-scan.wat"
runner = "standards/runners/yaml-scan-smoke.js"
entrypoint = "proto_abi_version"
deterministic = true
inputs = ["bytes", "offsets"]
outputs = ["status", "records"]
depends_on = ["codec-json-scalar"]
exports = [
  "memory",
  "proto_abi_version",
  "proto_standard_id",
  "yaml_scan_scalar",
  "yaml_scan_line",
  "yaml_scan_document",
]
parity_sources = [
  "crates/utility/edgerun-json/src/yaml_parse.rs",
]
