id = "app-tor-device"
name = "tor-device"
kind = "app-primitive"
version = "0.1.0"
standard_id = 300204
abi_version = 1
wat = "standards/build/wasm/app-primitives/tor-device/tor-device.wat"
entrypoint = "version"
deterministic = true
inputs = ["bytes", "scalars"]
outputs = ["bytes", "status", "records"]
exports = [
  "memory",
  "identity_from_pubkey",
  "route_decode",
  "route_encode",
  "beacon_encode",
  "beacon_decode",
  "cell_encode",
  "cell_decode",
  "sha3_256",
  "version",
]
parity_sources = [
  "/home/ken/tor-device/src/root.zig",
  "/home/ken/tor-device/src/cell.zig",
  "/home/ken/tor-device/src/beacon.zig",
  "/home/ken/tor-device/src/route.zig",
  "/home/ken/tor-device/src/identity.zig",
]
