id = "app-tor-wat-protocol"
name = "tor-wat-protocol"
kind = "app-primitive"
version = "0.1.0"
standard_id = 300202
abi_version = 1
wat = "standards/build/wasm/app-primitives/tor-wat/protocol.wat"
entrypoint = "tor_init"
deterministic = true
inputs = ["bytes", "scalars"]
outputs = ["bytes", "status", "records"]
exports = [
  "memory",
  "tor_init",
  "constant",
  "cell_len",
  "parse_fixed_cell",
  "build_fixed_cell",
  "build_versions_cell",
  "parse_versions",
  "parse_var_cell",
  "build_var_cell",
  "build_netinfo_cell",
  "validate_netinfo_cell",
  "parse_relay_payload",
  "build_relay_payload",
  "build_relay_cell",
  "parse_relay_cell",
  "build_create2_cell",
  "parse_created2_cell",
  "build_extend2_body",
  "parse_extended2_body",
  "ntor_state_init",
  "ntor_state_build_handshake",
]
depends_on = ["app-tor-ntor-crypto"]
parity_sources = [
  "kernel/x86_64/crypto/tor.asm",
  "kernel/x86_64/crypto/tor_cell.asm",
  "kernel/x86_64/crypto/tor_ntor.asm",
]
