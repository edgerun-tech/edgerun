id = "app-tor-directory-authority"
name = "tor-directory-authority"
kind = "app-primitive"
version = "0.1.0"
standard_id = 300218
abi_version = 1
wat = "standards/build/wasm/app-primitives/tor-directory-authority/tor-directory-authority.wat"
runner = "standards/runners/tor-directory-authority-smoke.js"
entrypoint = "tor_da_accept_descriptor"
deterministic = true
inputs = ["relay-identity", "nickname", "ports", "bandwidth", "uptime", "protocol-bits", "next-hop", "published-time"]
outputs = ["descriptor-record", "consensus-entry", "route-entry", "status"]
depends_on = ["app-tor-full-spec", "app-tor-relay-full", "app-tor-directory-vote"]
exports = [
  "memory",
  "proto_standard_id",
  "proto_abi_version",
  "tor_da_max_descriptors",
  "tor_da_descriptor_size",
  "tor_da_consensus_entry_size",
  "tor_da_init",
  "tor_da_descriptor_upload_path",
  "tor_da_consensus_path",
  "tor_da_vote_path",
  "tor_da_accept_descriptor",
  "tor_da_descriptor_ptr",
  "tor_da_descriptor_count",
  "tor_da_required_protocols_ok",
  "tor_da_build_consensus",
  "tor_da_consensus_entry_ptr",
  "tor_da_route_lookup",
]
app_model = "local-directory-authority"
app_ports = "not-exposed"
app_dns = "not-used"
app_ip_addressing = "identity-next-hop"
parity_sources = [
  "/home/ken/tor-spec/00-os-mapping.md",
  "/home/ken/tor-spec/03-directory-protocol.md",
  "/home/ken/tor-spec/21-parameters.md",
]
