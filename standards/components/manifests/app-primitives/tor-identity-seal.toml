id = "app-tor-identity-seal"
name = "tor-identity-seal"
kind = "app-primitive"
version = "0.1.0"
standard_id = 300220
abi_version = 1
wat = "standards/build/wasm/app-primitives/tor-identity-seal/tor-identity-seal.wat"
runner = "standards/runners/tor-identity-seal-smoke.js"
entrypoint = "tor_identity_seal"
deterministic = true
inputs = ["sender-identity", "recipient-identity", "ephemeral-secret", "iv", "plaintext"]
outputs = ["sealed-message", "plaintext", "status"]
depends_on = ["app-tor-ntor-crypto"]
exports = [
  "memory",
  "proto_standard_id",
  "proto_abi_version",
  "tor_identity_seal_overhead",
  "tor_identity_seal_public",
  "tor_identity_seal_key_material",
  "tor_identity_seal",
  "tor_identity_open",
]
notes = "App identity message sealing over the Tor fabric: X25519 shared secret, WAT-local key derivation, AES-256-CTR payload encryption, HMAC-SHA256 authentication, and no TLS dependency."
