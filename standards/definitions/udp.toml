id = "udp-datagram"
kind = "frame"
standard = "RFC768"
section = "Format"

[[field]]
name = "source_port"
type = "u16be"

[[field]]
name = "destination_port"
type = "u16be"

[[field]]
name = "length"
type = "u16be"
constraint = "length >= 8"

[[field]]
name = "checksum"
type = "u16be"

[[field]]
name = "payload"
type = "bytes"
length = "length - 8"

[emits]
type = "udp-payload"
when = "length == payload_len + 8"

[consumes]
type = "ip-payload"
when = "ip.protocol == 17"

[wasm]
manifest = "standards/components/manifests/udp-datagram-definition.toml"
sha256 = ""

