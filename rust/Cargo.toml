[workspace]
resolver = "2"
members = [
  # Protocol / core
  "crates/lifegraph-core",
  "crates/lifegraph-proto",
  "crates/lifegraph-cpufeatures",
  "crates/lifegraph-const-oid",
  "crates/lifegraph-rand_core",
  "crates/lifegraph-base16ct",
  "crates/lifegraph-cfg-if",
  "crates/lifegraph-zeroize",
  "crates/lifegraph-subtle",
  "crates/lifegraph-log",
  "crates/lifegraph-rt",
  "crates/lifegraph-json",
  "crates/lifegraph-capabilities",
  "crates/lifegraph-capability-policy",
  "crates/lifegraph-machine-report",
  "crates/lifegraph-remote-capability",
  "crates/lifegraph-stream",

  # Device & media abstraction
  "crates/lifegraph-input",
  "crates/lifegraph-evdev-input",
  "crates/lifegraph-microphone",
  "crates/lifegraph-alsa-microphone",
  "crates/lifegraph-speaker",
  "crates/lifegraph-alsa-speaker",
  "crates/lifegraph-audio-calibration",
  "crates/lifegraph-v4l2-camera",
  "crates/lifegraph-camera-biometrics",
  "crates/lifegraph-cec",
  "crates/lifegraph-linux-cec",
  "crates/lifegraph-display",
  "crates/lifegraph-drm-display",
  "crates/lifegraph-gpu",
  "crates/lifegraph-linux-gpu",
  "crates/lifegraph-power",
  "crates/lifegraph-linux-power",

  # Biometric & identity backends
  "crates/lifegraph-fingerprint",
  "crates/lifegraph-goodix-fingerprint",
  "crates/lifegraph-biometrics",
  "crates/lifegraph-yubikey",
  "crates/lifegraph-crypto-common",
  "crates/lifegraph-block-buffer",
  "crates/lifegraph-typenum",
  "crates/lifegraph-generic-array",
  "crates/lifegraph-signature",
  "crates/lifegraph-hkdf",
  "crates/lifegraph-rfc6979",
  "crates/lifegraph-hmac",
  "crates/lifegraph-digest",
  "crates/lifegraph-der",
  "crates/lifegraph-sec1",
  "crates/lifegraph-group",
  "crates/lifegraph-ff",
  "crates/lifegraph-crypto-bigint",
  "crates/lifegraph-primeorder",
  "crates/lifegraph-elliptic-curve",
  "crates/lifegraph-ecdsa",
  "crates/lifegraph-p256",
  "crates/lifegraph-tpm",
  "crates/lifegraph-android-keystore",
  "crates/lifegraph-hardware-signing",

  # Connectivity and transport backends
  "crates/lifegraph-bluetooth",
  "crates/lifegraph-mgmt-bluetooth",
  "crates/lifegraph-wifi",
  "crates/lifegraph-linux-wifi",
  "crates/lifegraph-network-interface",
  "crates/lifegraph-linux-netif",
  "crates/lifegraph-usb",
  "crates/lifegraph-linux-usb",
  "crates/lifegraph-pci",
  "crates/lifegraph-linux-pci",
  "crates/lifegraph-nfc",
  "crates/lifegraph-linux-nfc",
  "crates/lifegraph-npu",
  "crates/lifegraph-linux-npu",
  "crates/lifegraph-linux-sysfs",
  "crates/lifegraph-mesh",
  "crates/lifegraph-mesh-session",
  "crates/lifegraph-mesh-capability",
  "crates/lifegraph-mesh-daemon",
  "crates/lifegraph-node",
  "crates/lifegraph-mesh-link",
  "crates/lifegraph-mesh-router",
  "crates/lifegraph-virtual-disk",
  "crates/lifegraph-storage",

  # Experiments
  "crates/lifegraph-amd-xdna",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
getrandom = "=0.4.2"
libc = "=0.2.183"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
prost = "=0.14.3"
prost-build = "=0.14.3"
prost-types = "=0.14.3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rusqlite = "=0.37.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
unicode-normalization = "=0.1.25"
x509-parser = "0.16"

# Dev-only
rand_core = "=0.6.4"

[patch.crates-io]
base16ct = { path = "crates/lifegraph-base16ct" }
block-buffer = { path = "crates/lifegraph-block-buffer" }
cfg-if = { path = "crates/lifegraph-cfg-if" }
const-oid = { path = "crates/lifegraph-const-oid" }
cpufeatures = { path = "crates/lifegraph-cpufeatures" }
crypto-bigint = { path = "crates/lifegraph-crypto-bigint" }
crypto-common = { path = "crates/lifegraph-crypto-common" }
der = { path = "crates/lifegraph-der" }
digest = { path = "crates/lifegraph-digest" }
ecdsa = { path = "crates/lifegraph-ecdsa" }
elliptic-curve = { path = "crates/lifegraph-elliptic-curve" }
ff = { path = "crates/lifegraph-ff" }
generic-array = { path = "crates/lifegraph-generic-array" }
group = { path = "crates/lifegraph-group" }
hkdf = { path = "crates/lifegraph-hkdf" }
hmac = { path = "crates/lifegraph-hmac" }
p256 = { path = "crates/lifegraph-p256" }
primeorder = { path = "crates/lifegraph-primeorder" }
rand_core = { path = "crates/lifegraph-rand_core" }
rfc6979 = { path = "crates/lifegraph-rfc6979" }
sec1 = { path = "crates/lifegraph-sec1" }
signature = { path = "crates/lifegraph-signature" }
subtle = { path = "crates/lifegraph-subtle" }
typenum = { path = "crates/lifegraph-typenum" }
zeroize = { path = "crates/lifegraph-zeroize" }
