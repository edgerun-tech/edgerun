[workspace]
resolver = "2"
members = [
  # Protocol / core
  "crates/lifegraph-core",
  "crates/lifegraph-proto",
  "crates/lifegraph-log",
  "crates/lifegraph-rt",
  "crates/lifegraph-json",
  "crates/lifegraph-capabilities",
  "crates/lifegraph-capability-policy",
  "crates/lifegraph-machine-report",
  "crates/lifegraph-remote-capability",
  "crates/lifegraph-stream",

  # Device & media abstraction
  "crates/lifegraph-input",
  "crates/lifegraph-evdev-input",
  "crates/lifegraph-microphone",
  "crates/lifegraph-alsa-microphone",
  "crates/lifegraph-speaker",
  "crates/lifegraph-alsa-speaker",
  "crates/lifegraph-audio-calibration",
  "crates/lifegraph-v4l2-camera",
  "crates/lifegraph-camera-biometrics",
  "crates/lifegraph-cec",
  "crates/lifegraph-linux-cec",
  "crates/lifegraph-display",
  "crates/lifegraph-drm-display",
  "crates/lifegraph-gpu",
  "crates/lifegraph-linux-gpu",
  "crates/lifegraph-power",
  "crates/lifegraph-linux-power",

  # Biometric & identity backends
  "crates/lifegraph-fingerprint",
  "crates/lifegraph-goodix-fingerprint",
  "crates/lifegraph-biometrics",
  "crates/lifegraph-yubikey",
  "crates/lifegraph-tpm",
  "crates/lifegraph-android-keystore",
  "crates/lifegraph-hardware-signing",

  # Connectivity and transport backends
  "crates/lifegraph-bluetooth",
  "crates/lifegraph-mgmt-bluetooth",
  "crates/lifegraph-wifi",
  "crates/lifegraph-linux-wifi",
  "crates/lifegraph-network-interface",
  "crates/lifegraph-linux-netif",
  "crates/lifegraph-usb",
  "crates/lifegraph-linux-usb",
  "crates/lifegraph-pci",
  "crates/lifegraph-linux-pci",
  "crates/lifegraph-nfc",
  "crates/lifegraph-linux-nfc",
  "crates/lifegraph-npu",
  "crates/lifegraph-linux-npu",
  "crates/lifegraph-linux-sysfs",
  "crates/lifegraph-mesh",
  "crates/lifegraph-mesh-session",
  "crates/lifegraph-mesh-capability",
  "crates/lifegraph-mesh-daemon",
  "crates/lifegraph-node",
  "crates/lifegraph-mesh-link",
  "crates/lifegraph-mesh-router",
  "crates/lifegraph-virtual-disk",
  "crates/lifegraph-storage",

  # Experiments
  "crates/lifegraph-amd-xdna",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
getrandom = "=0.4.2"
libc = "=0.2.183"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
prost = "=0.14.3"
prost-build = "=0.14.3"
prost-types = "=0.14.3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rusqlite = "=0.37.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
unicode-normalization = "=0.1.25"
x509-parser = "0.16"

# Dev-only
rand_core = "=0.6.4"
