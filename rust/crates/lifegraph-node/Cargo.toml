[package]
name = "lifegraph-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lifegraphd"
path = "src/main.rs"

[dependencies]
lifegraph-core = { path = "../lifegraph-core" }
lifegraph-proto = { path = "../lifegraph-proto" }
lifegraph-capabilities = { path = "../lifegraph-capabilities" }
lifegraph-capability-policy = { path = "../lifegraph-capability-policy" }
lifegraph-stream = { path = "../lifegraph-stream" }
lifegraph-hardware-signing = { path = "../lifegraph-hardware-signing" }
lifegraph-mesh = { path = "../lifegraph-mesh" }
lifegraph-mesh-link = { path = "../lifegraph-mesh-link" }
lifegraph-mesh-router = { path = "../lifegraph-mesh-router" }
lifegraph-linux-netif = { path = "../lifegraph-linux-netif" }
lifegraph-network-interface = { path = "../lifegraph-network-interface" }
ctrlc = "3"
sha2.workspace = true
p256.workspace = true
prost.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
hex.workspace = true
rand = "0.8.5"

[dev-dependencies]
rand = "0.8.5"
