[workspace.package]
edition = "2021"
license = "MIT"
publish = true
rust-version = "1.81"
version = "0.1.1"

# Version management:
# - Run: cargo install cargo-public-api
# - CI automatically bumps version on main push based on API changes:
#   - patch: bug fixes only, no API changes
#   - minor: new public APIs added
#   - major: public APIs removed/renamed
# - Git tag triggers release build

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = 1
debug = false

[workspace.lints.rust]
dead_code = "allow"
missing_docs = "allow"
unused_variables = "allow"
unused_assignments = "allow"
unused_imports = "allow"
unused_mut = "allow"
non_upper_case_globals = "allow"
non_snake_case = "allow"
unused_must_use = "allow"
unused_comparisons = "allow"
unexpected_cfgs = "allow"
unused_parens = "allow"
deprecated = "allow"
function_casts_as_integer = "allow"

[workspace.dependencies]
# Core edgerun crates
edgerun-core = { path = "crates/edgerun-core" }
edgerun-proto = { path = "crates/edgerun-proto" }
edgerun-proxy = { path = "crates/edgerun-proxy" }
edgerun-storage = { path = "crates/edgerun-storage" }
edgerun-stream = { path = "crates/edgerun-stream" }
edgerun-http = { path = "crates/edgerun-http", default-features = false }
edgerun-node = { path = "crates/edgerun-node" }
edgerun-hardware-signing = { path = "crates/edgerun-hardware-signing" }
edgerun-capabilities = { path = "crates/edgerun-capabilities" }
edgerun-mesh = { path = "crates/edgerun-mesh" }
edgerun-mesh-link = { path = "crates/edgerun-mesh-link" }
edgerun-mesh-session = { path = "crates/edgerun-mesh-session" }
edgerun-mesh-capability = { path = "crates/edgerun-mesh-capability" }
edgerun-mesh-daemon = { path = "crates/edgerun-mesh-daemon" }
edgerun-secret-service = { path = "crates/edgerun-secret-service" }
edgerun-biometrics = { path = "crates/edgerun-biometrics" }
edgerun-mgmt-bluetooth = { path = "crates/edgerun-mgmt-bluetooth" }
edgerun-bluetooth-gatt = { path = "crates/edgerun-bluetooth-gatt" }
edgerun-tcl-ac = { path = "crates/edgerun-tcl-ac" }
edgerun-tcl-ac-cli = { path = "crates/edgerun-tcl-ac-cli" }
edgerun-matter = { path = "crates/edgerun-matter" }
edgerun-capability-policy = { path = "crates/edgerun-capability-policy" }
edgerun-linux-wifi = { path = "crates/edgerun-linux-wifi" }
edgerun-input = { path = "crates/edgerun-input" }
edgerun-oci = { path = "crates/edgerun-oci" }
edgerun-edgefs = { path = "crates/edgerun-edgefs" }
edgerun-encoding = { path = "crates/edgerun-encoding" }
edgerun-acme = { path = "crates/edgerun-acme" }
edgerun-dns = { path = "crates/edgerun-dns" }
edgerun-tls = { path = "crates/edgerun-tls" }
edgerun-url = { path = "crates/edgerun-url" }
edgerun-glob = { path = "crates/edgerun-glob" }
edgerun-regex = { path = "crates/edgerun-regex" }
edgerun-email = { path = "crates/edgerun-email" }
edgerun-log = { path = "crates/edgerun-log" }
edgerun-rt = { path = "crates/edgerun-rt" }
# Single crypto boundary — all crypto flows through edgerun-crypto
edgerun-crypto = { path = "crates/edgerun-crypto", default-features = false }
# edgerun-json as drop-in replacement for serde_json
edgerun-json = { path = "crates/edgerun-json", default-features = false, features = ["alloc"] }
edgerun-error = { path = "crates/edgerun-error" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
# Browser deps
edgerun-display = { path = "crates/edgerun-display" }
edgerun-gpu = { path = "crates/edgerun-gpu" }
# edgerun-wgpu = { path = "crates/edgerun-wgpu" }
# edgerun-rasterizer = { path = "crates/edgerun-rasterizer" }
# edgerun-css-cascade = { path = "crates/edgerun-css-cascade" }
# Compression libraries for HTTP content-encoding
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
brotli = { version = "8", default-features = false }
sha2 = { version = "0.10", default-features = false }
libc = "0.2"
prost = { version = "0.14", default-features = false, features = ["derive"] }
prost-types = { version = "0.14", default-features = false }
der = { version = "0.8", features = ["heapless"] }

[patch.crates-io]
const-oid = { path = "crates/edgerun-crypto/vendor/const-oid-0.9" }
