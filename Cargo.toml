[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = 1
debug = false

[workspace.dependencies]
# Single crypto boundary — all crypto flows through edgerun-crypto
edgerun-crypto = { path = "crates/edgerun-crypto" }
libc = "0.2"
itertools = "0.14"
prost = { version = "0.14", default-features = false, features = ["derive"] }
prost-types = "0.14"
