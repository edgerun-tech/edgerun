[workspace]
resolver = "2"
exclude = [
  "crates/edgerun-codex",
  "crates/edgerun-exec-runner",
  "crates/edgerun-unikernel",
]

members = [
  "crates/apps/edgerun-email",
  "crates/apps/edgerun-exchange-api",
  "crates/apps/edgerun-oauth",
  "crates/apps/edgerun-secret-service",
  "crates/apps/edgerun-tuya",
  "crates/authority/edgerun-storage",
  "crates/authority/edgerun-virtual-disk",
  "crates/capability/edgerun-capabilities",
  "crates/capability/edgerun-remote-capability",
  "crates/device-types/edgerun-devices",
  "crates/edgerun-codelyzer",
  "crates/edgerun-compositor",
  "crates/edgerun-exchange",
  "crates/edgerun-network-driver",
  "crates/edgerun-oci",
  "crates/edgerun-platform",
  "crates/edgerun-sdk",
  "crates/edgerun-tcl-ac",
  "crates/edgerun-term/edgerun-term-core",
  "crates/edgerun-unit",
  "crates/edgerun-virtio",
  "crates/edgerun-wallet",
  "crates/identity/edgerun-hardware-signing",
  "crates/identity/edgerun-tpm",
  "crates/identity/edgerun-yubikey",
  "crates/linux-adapters/edgerun-bluetooth-gatt",
  "crates/linux-adapters/edgerun-evdev-input",
  "crates/linux-adapters/edgerun-linux-netif",
  "crates/linux-adapters/edgerun-linux-pci",
  "crates/linux-adapters/edgerun-linux-sysfs",
  "crates/linux-adapters/edgerun-linux-usb",
  "crates/linux-adapters/edgerun-linux-wifi",
  "crates/mesh/edgerun-mesh",
  "crates/node/edgerun-machine-report",
  "crates/node/edgerun-node",
  "crates/protocol/edgerun-core",
  "crates/protocol/edgerun-protocols",
  "crates/protocol/edgerun-wire",
  "crates/protocol/edgerun-work",
  "crates/utility/edgerun-async-channel",
  "crates/utility/edgerun-async-trait",
  "crates/utility/edgerun-bytes",
  "crates/utility/edgerun-clipboard",
  "crates/utility/edgerun-crypto",
  "crates/utility/edgerun-deno-core-icudata",
  "crates/utility/edgerun-emoji",
  "crates/utility/edgerun-encoding",
  "crates/utility/edgerun-error",
  "crates/utility/edgerun-error-derive",
  "crates/utility/edgerun-eventsource-stream",
  "crates/utility/edgerun-futures",
  "crates/utility/edgerun-hpack",
  "crates/utility/edgerun-http-client",
  "crates/utility/edgerun-http",
  "crates/utility/edgerun-icu-decimal",
  "crates/utility/edgerun-icu-locale-core",
  "crates/utility/edgerun-icu-provider",
  "crates/utility/edgerun-inventory",
  "crates/utility/edgerun-json",
  "crates/utility/edgerun-json-derive",
  "crates/utility/edgerun-landlock",
  "crates/utility/edgerun-locale",
  "crates/utility/edgerun-log",
  "crates/utility/edgerun-log-macros",
  "crates/utility/edgerun-opentelemetry",
  "crates/utility/edgerun-opentelemetry-sdk",
  "crates/utility/edgerun-pty",
  "crates/utility/edgerun-random",
  "crates/utility/edgerun-reqwest",
  "crates/utility/edgerun-rmcp",
  "crates/utility/edgerun-runtime",
  "crates/utility/edgerun-schemars",
  "crates/utility/edgerun-schemars-derive",
  "crates/utility/edgerun-seccompiler",
  "crates/utility/edgerun-serde",
  "crates/utility/edgerun-shlex",
  "crates/utility/edgerun-similar",
  "crates/utility/edgerun-sixel",
  "crates/utility/edgerun-strum",
  "crates/utility/edgerun-strum-macros",
  "crates/utility/edgerun-subtle",
  "crates/utility/edgerun-terminal-parser",
  "crates/utility/edgerun-time",
  "crates/utility/edgerun-tokio",
  "crates/utility/edgerun-tokio-tungstenite",
  "crates/utility/edgerun-tokio-util",
  "crates/utility/edgerun-tracing-opentelemetry",
  "crates/utility/edgerun-ts-rs",
  "crates/utility/edgerun-ts-rs-derive",
  "crates/utility/edgerun-tungstenite",
  "crates/utility/edgerun-ui-core",
  "crates/utility/edgerun-unicode",
  "crates/utility/edgerun-unit-macros",
  "crates/utility/edgerun-url",
  "crates/utility/edgerun-zeroize",
  "crates/utility/edgerun-zstd",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Sylchi/edgerun_reference_core"
homepage = "https://github.com/Sylchi/edgerun_reference_core"
rust-version = "1.95"
version = "0.1.1"

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true

[profile.dev]
opt-level = 1
debug = false

[workspace.lints.rust]
dead_code = "allow"
missing_docs = "allow"
unused_variables = "allow"
unused_assignments = "allow"
unused_imports = "allow"
unused_mut = "allow"
non_upper_case_globals = "allow"
non_snake_case = "allow"
unused_must_use = "allow"
unused_comparisons = "allow"
unexpected_cfgs = "allow"
unused_parens = "allow"
deprecated = "allow"
function_casts_as_integer = "allow"

[workspace.dependencies]
edgerun-core = { version = "0.1", path = "crates/protocol/edgerun-core", default-features = false }
edgerun-protocols = { version = "0.1", path = "crates/protocol/edgerun-protocols", default-features = false }
edgerun-storage = { version = "0.1", path = "crates/authority/edgerun-storage" }
edgerun-virtual-disk = { version = "0.1", path = "crates/authority/edgerun-virtual-disk", default-features = false }
edgerun-node = { version = "0.1", path = "crates/node/edgerun-node" }
edgerun-hardware-signing = { version = "0.1", path = "crates/identity/edgerun-hardware-signing" }
edgerun-capabilities = { version = "0.1", path = "crates/capability/edgerun-capabilities" }
edgerun-mesh = { version = "0.1", path = "crates/mesh/edgerun-mesh" }
edgerun-secret-service = { version = "0.1", path = "crates/apps/edgerun-secret-service" }
edgerun-devices = { version = "0.1", path = "crates/device-types/edgerun-devices" }
edgerun-bluetooth-gatt = { version = "0.1", path = "crates/linux-adapters/edgerun-bluetooth-gatt" }
edgerun-async-channel = { version = "0.1", path = "crates/utility/edgerun-async-channel" }
edgerun-async-trait = { version = "0.1", path = "crates/utility/edgerun-async-trait" }
edgerun-linux-wifi = { version = "0.1", path = "crates/linux-adapters/edgerun-linux-wifi" }
edgerun-evdev-input = { version = "0.1", path = "crates/linux-adapters/edgerun-evdev-input" }
edgerun-oci = { version = "0.1", path = "crates/edgerun-oci" }
edgerun-encoding = { version = "0.1", path = "crates/utility/edgerun-encoding", default-features = false }
edgerun-futures = { version = "0.1", path = "crates/utility/edgerun-futures" }
edgerun-url = { version = "0.1", path = "crates/utility/edgerun-url" }
edgerun-shlex = { version = "0.1", path = "crates/utility/edgerun-shlex" }
edgerun-inventory = { version = "0.1", path = "crates/utility/edgerun-inventory" }
edgerun-serde = { version = "0.1", path = "crates/utility/edgerun-serde" }
edgerun-strum = { version = "0.1", path = "crates/utility/edgerun-strum" }
edgerun-strum-macros = { version = "0.1", path = "crates/utility/edgerun-strum-macros" }
edgerun-time = { version = "0.1", path = "crates/utility/edgerun-time" }
edgerun-reqwest = { version = "0.1", path = "crates/utility/edgerun-reqwest" }
edgerun-log = { version = "0.1", path = "crates/utility/edgerun-log" }
edgerun-wire = { version = "0.1", path = "crates/protocol/edgerun-wire", default-features = false }
edgerun-work = { version = "0.1", path = "crates/protocol/edgerun-work", default-features = false }
edgerun-crypto = { version = "0.1", path = "crates/utility/edgerun-crypto", default-features = false }
edgerun-json = { version = "0.1", path = "crates/utility/edgerun-json", default-features = false }
edgerun-locale = { version = "0.1", path = "crates/utility/edgerun-locale", default-features = false }
edgerun-random = { version = "0.1", path = "crates/utility/edgerun-random" }
edgerun-error = { version = "0.1", path = "crates/utility/edgerun-error" }
edgerun-emoji = { version = "0.1", path = "crates/utility/edgerun-emoji" }
edgerun-sixel = { version = "0.1", path = "crates/utility/edgerun-sixel" }
edgerun-terminal-parser = { version = "0.1", path = "crates/utility/edgerun-terminal-parser" }
edgerun-virtio = { version = "0.1", path = "crates/edgerun-virtio" }
edgerun-network-driver = { version = "0.1", path = "crates/edgerun-network-driver", default-features = false }
edgerun-unicode = { version = "0.1", path = "crates/utility/edgerun-unicode" }

rkyv = { version = "0.8.16", default-features = true }
libc = "0.2"

[patch.crates-io]
