[workspace]
resolver = "2"

members = [
  "crates/edgerun-alsa-microphone",
  "crates/edgerun-alsa-speaker",
  "crates/edgerun-amd-xdna",
  "crates/edgerun-android-keystore",
  "crates/edgerun-audio-calibration",
  "crates/edgerun-audio-liveliness",
  "crates/edgerun-biometrics",
  "crates/edgerun-bench",
  "crates/edgerun-bluetooth",
  "crates/edgerun-camera-biometrics",
  "crates/edgerun-capabilities",
  "crates/edgerun-capability-policy",
  "crates/edgerun-cec",
  "crates/edgerun-config",
  "crates/edgerun-core",
  "crates/edgerun-crypto",
  "crates/edgerun-dhcp",
  "crates/edgerun-dhcpv6",
  "crates/edgerun-dns",
  "crates/edgerun-drm-display",
  "crates/edgerun-e2e-capability",
  "crates/edgerun-edit",
  "crates/edgerun-evdev-input",
  "crates/edgerun-face-detection",
  "crates/edgerun-fingerprint",
  "crates/edgerun-goodix-fingerprint",
  "crates/edgerun-hardware-signing",
  "crates/edgerun-http",
  "crates/edgerun-imap",
  "crates/edgerun-input",
  "crates/edgerun-json",
  "crates/edgerun-linux-cec",
  "crates/edgerun-linux-gpu",
  "crates/edgerun-linux-netif",
  "crates/edgerun-linux-nfc",
  "crates/edgerun-linux-npu",
  "crates/edgerun-linux-pci",
  "crates/edgerun-linux-power",
  "crates/edgerun-linux-sysfs",
  "crates/edgerun-linux-usb",
  "crates/edgerun-linux-wifi",
  "crates/edgerun-log",
  "crates/edgerun-machine-report",
  "crates/edgerun-mesh",
  "crates/edgerun-mesh-capability",
  "crates/edgerun-mesh-daemon",
  "crates/edgerun-mesh-link",
  "crates/edgerun-mesh-session",
  "crates/edgerun-mgmt-bluetooth",
  "crates/edgerun-microphone",
  "crates/edgerun-net",
  "crates/edgerun-network-interface",
  "crates/edgerun-nfc",
  "crates/edgerun-node",
  "crates/edgerun-npu",
  "crates/edgerun-oauth",
  "crates/edgerun-oci",
  "crates/edgerun-pci",
  "crates/edgerun-power",
  "crates/edgerun-proto",
  "crates/edgerun-qpack",
  "crates/edgerun-remote-capability",
  "crates/edgerun-rt",
  "crates/edgerun-secret-service",
  "crates/edgerun-server",
  "crates/edgerun-smtp",
  "crates/edgerun-speaker",
  "crates/edgerun-storage",
  "crates/edgerun-stream",
  "crates/edgerun-tftp",
  "crates/edgerun-tls",
  "crates/edgerun-tpm",
  "crates/edgerun-usb",
  "crates/edgerun-v4l2-camera",
  "crates/edgerun-virtual-disk",
  "crates/edgerun-wifi",
  "crates/edgerun-yubikey",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = 1
debug = false

[workspace.lints.rust]
dead_code = "allow"
missing_docs = "allow"
unused_variables = "allow"
unused_assignments = "allow"
unused_imports = "allow"
unused_mut = "allow"
non_upper_case_globals = "allow"
non_snake_case = "allow"
unused_must_use = "allow"
unused_comparisons = "allow"
unexpected_cfgs = "allow"
unused_parens = "allow"
deprecated = "allow"
function_casts_as_integer = "allow"

[workspace.dependencies]
# Core edgerun crates
edgerun-core = { path = "crates/edgerun-core" }
edgerun-proto = { path = "crates/edgerun-proto" }
edgerun-storage = { path = "crates/edgerun-storage" }
edgerun-stream = { path = "crates/edgerun-stream" }
edgerun-http = { path = "crates/edgerun-http" }
edgerun-node = { path = "crates/edgerun-node" }
edgerun-hardware-signing = { path = "crates/edgerun-hardware-signing" }
edgerun-mesh = { path = "crates/edgerun-mesh" }
edgerun-mesh-link = { path = "crates/edgerun-mesh-link" }
edgerun-mesh-session = { path = "crates/edgerun-mesh-session" }
edgerun-mesh-capability = { path = "crates/edgerun-mesh-capability" }
edgerun-mesh-daemon = { path = "crates/edgerun-mesh-daemon" }
edgerun-secret-service = { path = "crates/edgerun-secret-service" }
edgerun-biometrics = { path = "crates/edgerun-biometrics" }
edgerun-mgmt-bluetooth = { path = "crates/edgerun-mgmt-bluetooth" }
edgerun-capability-policy = { path = "crates/edgerun-capability-policy" }
edgerun-linux-wifi = { path = "crates/edgerun-linux-wifi" }
edgerun-input = { path = "crates/edgerun-input" }
edgerun-oci = { path = "crates/edgerun-oci" }
# Single crypto boundary — all crypto flows through edgerun-crypto
edgerun-crypto = { path = "crates/edgerun-crypto" }
# edgerun-json as drop-in replacement for serde_json
edgerun-json = { path = "crates/edgerun-json", features = ["serde"] }
# Cross-workspace browser deps (edgerun-browser reference repo)
edgerun-display = { path = "../edgerun-browser/crates/edgerun-display" }
edgerun-gpu = { path = "../edgerun-browser/crates/edgerun-gpu" }
edgerun-wgpu = { path = "../edgerun-browser/crates/edgerun-wgpu" }
edgerun-rasterizer = { path = "../edgerun-browser/crates/edgerun-rasterizer" }
edgerun-css-cascade = { path = "../edgerun-browser/crates/edgerun-css-cascade" }
# Compression libraries for HTTP content-encoding
flate2 = "1"
brotli = "8"
sha2 = "0.10"
num-bigint = "0.4"
libc = "0.2"
parking_lot = "0.12"
prost = { version = "0.14", default-features = false, features = ["derive"] }
prost-types = "0.14"
