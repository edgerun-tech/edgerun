[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Sylchi/edgerun_reference_core"
homepage = "https://github.com/Sylchi/edgerun_reference_core"
rust-version = "1.81"
version = "0.1.1"

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true

[profile.dev]
opt-level = 1
debug = false

[workspace.lints.rust]
dead_code = "allow"
missing_docs = "allow"
unused_variables = "allow"
unused_assignments = "allow"
unused_imports = "allow"
unused_mut = "allow"
non_upper_case_globals = "allow"
non_snake_case = "allow"
unused_must_use = "allow"
unused_comparisons = "allow"
unexpected_cfgs = "allow"
unused_parens = "allow"
deprecated = "allow"
function_casts_as_integer = "allow"

[workspace.dependencies]
edgerun-core = { version = "0.1", path = "crates/edgerun-core", default-features = false }
edgerun-proxy = { version = "0.1", path = "crates/edgerun-proxy" }
