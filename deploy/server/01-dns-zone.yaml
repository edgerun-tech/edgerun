---
apiVersion: edgerun.io/v1alpha1
kind: DnsZone
metadata:
  name: example.edgerun.local
  namespace: edgerun-dns
spec:
  origin: example.edgerun.local
  soa:
    mname: ns1.example.edgerun.local
    rname: admin.example.edgerun.local
    serial: 2026043001
    refresh: 3600
    retry: 900
    expire: 604800
    minimum: 86400
  dnssec:
    algorithm: ecdsap256
    key_path: /etc/edgerun/server/dnssec-zone-ksk.pem
    key_flags: 257
    key_ttl: 86400
    signature_validity: 2592000
    nsec3: false
  records:
    - name: "@"
      type: NS
      value: ns1.example.edgerun.local
      ttl: 86400
    - name: "@"
      type: NS
      value: ns2.example.edgerun.local
      ttl: 86400
    - name: "@"
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: mail
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: mta-sts
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: blog
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: git
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: ns1
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: ns2
      type: A
      value: "203.0.113.10"
      ttl: 3600
    - name: "@"
      type: MX
      value: "0 mail.example.edgerun.local"
      ttl: 3600
    - name: "@"
      type: TXT
      value: "v=spf1 mx -all"
      ttl: 3600
    - name: nodes
      type: MX
      value: "0 mail.example.edgerun.local"
      ttl: 3600
    - name: nodes
      type: TXT
      value: "v=spf1 -all"
      ttl: 3600
    - name: "@"
      type: CAA
      value: "0 issue letsencrypt.org"
      ttl: 3600
    - name: "@"
      type: CAA
      value: "0 iodef mailto:admin@example.edgerun.local"
      ttl: 3600
    - name: _dmarc
      type: TXT
      value: "v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@example.edgerun.local"
      ttl: 3600
    - name: _mta-sts
      type: TXT
      value: "v=STSv1; id=2026043001"
      ttl: 3600
    - name: _smtp._tls
      type: TXT
      value: "v=TLSRPTv1; rua=mailto:tls-reports@example.edgerun.local"
      ttl: 3600
    - name: default._bimi
      type: TXT
      value: "v=BIMI1; l=https://mail.example.edgerun.local/bimi/logo.svg"
      ttl: 3600
    - name: mail._domainkey
      type: TXT
      value: "v=DKIM1; k=rsa; p=REPLACE_WITH_DKIM_PUBLIC_KEY"
      ttl: 86400
