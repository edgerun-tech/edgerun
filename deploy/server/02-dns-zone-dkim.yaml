---
apiVersion: edgerun.io/v1alpha1
kind: DnsZone
metadata:
  name: edgerun.tech.dkim
  namespace: edgerun-dns
spec:
  origin: edgerun.tech
  soa:
    mname: ns1.edgerun.tech
    rname: admin.edgerun.tech
    serial: 2025041801
    refresh: 3600
    retry: 900
    expire: 604800
    minimum: 86400
  records:
    - name: mail._domainkey
      type: TXT
      value: "v=DKIM1; k=rsa; "
      ttl: 86400
