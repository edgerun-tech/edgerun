syntax = "proto3";

package lifegraph.v0.capability_runtime;

import "lifegraph/v0/common.proto";
import "lifegraph/v0/capability.proto";

enum CapabilitySessionMode {
  CAPABILITY_SESSION_MODE_UNSPECIFIED = 0;
  CAPABILITY_SESSION_MODE_UNARY = 1;
  CAPABILITY_SESSION_MODE_STREAM = 2;
}

message CapabilitySessionOpen {
  uint32 version = 1;
  bytes session_id = 2;
  lifegraph.v0.capability.CapabilitySelector selector = 3;
  CapabilitySessionMode mode = 4;
  repeated lifegraph.v0.capability.CapabilityOperation requested_operations = 5;
  lifegraph.v0.capability.CapabilityAccessClass requested_access_class = 6;
  repeated lifegraph.v0.capability.CapabilityConstraint requested_constraints = 7;
  bytes correlation_id = 8;
}

message CapabilitySessionAccept {
  uint32 version = 1;
  bytes session_id = 2;
  bool accepted = 3;
  repeated lifegraph.v0.capability.CapabilityOperation granted_operations = 4;
  lifegraph.v0.capability.CapabilityAccessClass granted_access_class = 5;
  string error_reason = 6;
}

message CapabilitySessionEvent {
  uint32 version = 1;
  bytes session_id = 2;
  uint64 sequence_no = 3;
  repeated lifegraph.v0.capability.CapabilityEventKind event_kinds = 4;
  lifegraph.v0.common.ObjectRef payload_object = 5;
  bytes inline_payload = 6;
}

message CapabilitySessionClose {
  uint32 version = 1;
  bytes session_id = 2;
  string reason = 3;
}

message CapabilityInvocationFrame {
  lifegraph.v0.capability.CapabilityInvocation invocation = 1;
  bytes inline_parameters = 2;
}

message CapabilityResultFrame {
  lifegraph.v0.capability.CapabilityResult result = 1;
  bytes inline_payload = 2;
}

message CapabilityRemoteEnvelope {
  oneof message {
    CapabilitySessionOpen session_open = 1;
    CapabilitySessionAccept session_accept = 2;
    lifegraph.v0.capability.CapabilityInvocation invocation = 3;
    lifegraph.v0.capability.CapabilityResult result = 4;
    CapabilitySessionEvent session_event = 5;
    CapabilitySessionClose session_close = 6;
    lifegraph.v0.capability.CapabilityRequest request = 7;
    lifegraph.v0.capability.CapabilityGrant grant = 8;
    lifegraph.v0.capability.CapabilityRevocation revocation = 9;
    CapabilityInvocationFrame invocation_frame = 10;
    CapabilityResultFrame result_frame = 11;
  }
}
