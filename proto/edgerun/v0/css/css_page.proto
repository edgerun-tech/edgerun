syntax = "proto3";

package edgerun.v0.css.page;

/// CSS Page Types — generated from CSS Paged Media Level 3.
/// DO NOT EDIT. Regenerate with: scripts/generate_web_platform5.py

/// Page size keywords.
enum PageSize {
  PAGE_SIZE_UNSPECIFIED = 0;
  AUTO = 1;
  A3 = 2;
  A4 = 3;
  A5 = 4;
  B4 = 5;
  B5 = 6;
  LETTER = 7;
  LEGAL = 8;
  LEDGER = 9;
}

/// Page orientation.
enum PageOrientation {
  PAGE_ORIENTATION_UNSPECIFIED = 0;
  PORTRAIT = 1;
  LANDSCAPE = 2;
}

/// Page pseudo-class types.
enum PagePseudo {
  PAGE_PSEUDO_UNSPECIFIED = 0;
  FIRST = 1;
  LEFT = 2;
  RIGHT = 3;
  BLANK = 4;
}

/// @page margin box.
message MarginBox {
  string name = 1; // @top-left, @bottom-center, etc.
  repeated CssDeclaration declarations = 2;
}

/// Css declaration.
message CssDeclaration {
  string property = 1;
  string value = 2;
  bool important = 3;
}

/// @page rule.
message PageRule {
  optional string selector = 1; // named page
  optional PagePseudo pseudo = 2;
  optional PageSize size = 3;
  optional PageOrientation orientation = 4;
  repeated MarginBox margin_boxes = 5;
  repeated CssDeclaration declarations = 6;
}
