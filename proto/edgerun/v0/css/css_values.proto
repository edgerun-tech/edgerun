syntax = "proto3";

package edgerun.v0.css.values;

/// CSS Value Types — generated from CSS Values and Units Level 4.
/// DO NOT EDIT. Regenerate with: scripts/generate_web_platform5.py

/// CSS length units.
enum LengthUnit {
  LENGTH_UNIT_UNSPECIFIED = 0;
  PX = 1;
  EM = 2;
  REM = 3;
  EX = 4;
  CAP = 5;
  CH = 6;
  IC = 7;
  LH = 8;
  RCH = 9;
  REM_IC = 10;
  VW = 11;
  VH = 12;
  VI = 13;
  VB = 14;
  VMIN = 15;
  VMAX = 16;
  SVW = 17;
  SVH = 18;
  LVW = 19;
  LVH = 20;
  DVW = 21;
  DVH = 22;
  Q = 23;
  CM = 24;
  MM = 25;
  IN = 26;
  PC = 27;
  PT = 28;
  PX_RELATIVE = 29;
  FR = 30;
}

/// CSS angle units.
enum AngleUnit {
  ANGLE_UNIT_UNSPECIFIED = 0;
  DEG = 1;
  GRAD = 2;
  RAD = 3;
  TURN = 4;
}

/// CSS time units.
enum TimeUnit {
  TIME_UNIT_UNSPECIFIED = 0;
  S = 1;
  MS = 2;
}

/// CSS frequency units.
enum FrequencyUnit {
  FREQUENCY_UNIT_UNSPECIFIED = 0;
  HZ = 1;
  KHZ = 2;
}

/// CSS resolution units.
enum ResolutionUnit {
  RESOLUTION_UNIT_UNSPECIFIED = 0;
  DPI = 1;
  DPCM = 2;
  DPPX = 3;
}

/// CSS value type classification.
enum CssValueKind {
  CSS_VALUE_KIND_UNSPECIFIED = 0;
  IDENTIFIER = 1;
  STRING = 2;
  NUMBER = 3;
  PERCENTAGE = 4;
  DIMENSION = 5;
  URL = 6;
  FUNCTION = 7;
  HASH_COLOR = 8; // #RRGGBB
  HASH_ALPHA = 9; // #RRGGBBAA
}

/// A CSS dimension value (number + unit).
message CssDimension {
  double value = 1;
  optional LengthUnit length_unit = 2;
  optional AngleUnit angle_unit = 3;
  optional TimeUnit time_unit = 4;
  optional FrequencyUnit frequency_unit = 5;
  optional ResolutionUnit resolution_unit = 6;
}

/// CSS calc() function.
message CalcExpr {
  repeated CalcTerm terms = 1; // terms are added/subtracted
}

message CalcTerm {
  bool negative = 1;
  CalcFactor factor = 2;
}

message CalcFactor {
  oneof value {
    CssDimension dimension = 1;
    double number = 2;
    double percentage = 3;
    CalcExpr calc = 4;
  }
}

/// var() custom property reference.
message VarRef {
  string custom_property_name = 1; // without leading --
  optional string fallback_value = 2;
}

/// attr() attribute reference.
message AttrRef {
  string attribute_name = 1;
  optional string type = 2; // expected CSS value type
  optional string fallback = 3;
}

/// min() / max() / clamp() functions.
message MinMaxCalc {
  enum MinMaxKind {
    MIN_MAX_KIND_UNSPECIFIED = 0;
    MIN = 1;
    MAX = 2;
    CLAMP = 3;
  }
  MinMaxKind kind = 1;
  CalcExpr minimum = 2;
  CalcExpr maximum = 3;
  CalcExpr preferred = 4; // only for clamp()
}

/// CSS-wide keywords.
enum CssWideKeyword {
  CSS_WIDE_KEYWORD_UNSPECIFIED = 0;
  INHERIT = 1;
  INITIAL = 2;
  UNSET = 3;
  REVERT = 4;
  REVERT_LAYER = 5;
}
