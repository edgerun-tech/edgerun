  DVW = 16; // dvw (value)
  VH = 17; // vh (value)
  SVH = 18; // svh (value)
  LVH = 19; // lvh (value)
  DVH = 20; // dvh (value)
  VI = 21; // vi (value)
  SVI = 22; // svi (value)
  LVI = 23; // lvi (value)
  DVI = 24; // dvi (value)
  VB = 25; // vb (value)
  SVB = 26; // svb (value)
  LVB = 27; // lvb (value)
  DVB = 28; // dvb (value)
  VMIN = 29; // vmin (value)
  SVMIN = 30; // svmin (value)
  LVMIN = 31; // lvmin (value)
  DVMIN = 32; // dvmin (value)
  VMAX = 33; // vmax (value)
  SVMAX = 34; // svmax (value)
  LVMAX = 35; // lvmax (value)
  DVMAX = 36; // dvmax (value)
  CM = 37; // cm (value)
  MM = 38; // mm (value)
  Q = 39; // Q (value)
  IN = 40; // in (value)
  PC = 41; // pc (value)
  PT = 42; // pt (value)
  PX = 43; // px (value)
  DEG = 44; // deg (value)
  GRAD = 45; // grad (value)
  RAD = 46; // rad (value)
  TURN = 47; // turn (value)
  S = 48; // s (value)
  MS = 49; // ms (value)
  HZ = 50; // Hz (value)
  KHZ = 51; // kHz (value)
  DPI = 52; // dpi (value)
  DPCM = 53; // dpcm (value)
