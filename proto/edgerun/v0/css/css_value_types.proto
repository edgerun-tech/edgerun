/// Definition of a CSS value type.
message ValueTypeDef {
  CssValueType value_type = 1;
  string name = 2;
  string kind = 3; // "value" or "type"
}

/// A CSS value of any type.
message CssValue {
  oneof value {
    string keyword = 1;
    string identifier = 2;
    string string_value = 3;
    double number_value = 4;
    double length_value = 5;
    string length_unit = 6;
    double percentage_value = 7;
    CssColor color = 8;
    CssFunction function = 9;
    CssUrl url = 10;
  }
}

/// CSS color value.
message CssColor {
  oneof color {
    string named_color = 1;
    CssRgb rgb = 2;
    CssHsl hsl = 3;
    CssHwb hwb = 4;
    CssLab lab = 5;
    CssLch lch = 6;
    string oklch = 7;
    string oklab = 8;
    string current_color = 9;
    string hex = 10;
  }
}

message CssRgb {
  double r = 1;
  double g = 2;
  double b = 3;
  optional double alpha = 4;
}

message CssHsl {
  double h = 1;
  double s = 2;
  double l = 3;
  optional double alpha = 4;
}

message CssHwb {
  double h = 1;
  double w = 2;
  double b = 3;
  optional double alpha = 4;
}

message CssLab {
  double l = 1;
  double a = 2;
  double b = 3;
  optional double alpha = 4;
}

message CssLch {
  double l = 1;
  double c = 2;
  double h = 3;
  optional double alpha = 4;
}

/// CSS function call (e.g., calc(), var(), env()).
message CssFunction {
  string name = 1;
  repeated CssValue arguments = 2;
}

/// CSS url() value.
message CssUrl {
  string url = 1;
}

/// Common CSS keywords.
enum CssKeyword {
  CSS_KEYWORD_UNSPECIFIED = 0;
  CSS_KEYWORD_AUTO = 1;
  CSS_KEYWORD_NONE = 2;
  CSS_KEYWORD_INHERIT = 3;
  CSS_KEYWORD_INITIAL = 4;
  CSS_KEYWORD_UNSET = 5;
  CSS_KEYWORD_REVERT = 6;
  CSS_KEYWORD_REVERT_LAYER = 7;
  CSS_KEYWORD_CURRENT_COLOR = 8;
}
