syntax = "proto3";

package edgerun.v0.css.images;

/// CSS Image Types — generated from CSS Images Level 4.
/// DO NOT EDIT. Regenerate with: scripts/generate_web_platform3.py

/// Gradient type.
enum GradientKind {
  GRADIENT_KIND_UNSPECIFIED = 0;
  LinearGradient = 1; // Gradient along a line
  RepeatingLinearGradient = 2; // Repeating linear gradient
  RadialGradient = 3; // Gradient radiating from center
  RepeatingRadialGradient = 4; // Repeating radial gradient
  ConicGradient = 5; // Gradient around a cone
  RepeatingConicGradient = 6; // Repeating conic gradient
}

/// Radial gradient shape.
enum GradientShape {
  GRADIENT_SHAPE_UNSPECIFIED = 0;
  Circle = 1;
  Ellipse = 2;
}

/// Radial gradient size keyword.
enum GradientSize {
  GRADIENT_SIZE_UNSPECIFIED = 0;
  ClosestSide = 1;
  ClosestCorner = 2;
  FarthestSide = 3;
  FarthestCorner = 4;
  Contain = 5;
  Cover = 6;
}

/// Linear gradient direction.
enum SideOrCorner {
  SIDE_OR_CORNER_UNSPECIFIED = 0;
  ToLeft = 1;
  ToRight = 2;
  ToTop = 3;
  ToBottom = 4;
  ToTopLeft = 5;
  ToTopRight = 6;
  ToBottomLeft = 7;
  ToBottomRight = 8;
}

/// A CSS image value.
message CssImage {
  oneof image {
    string url = 1;
    LinearGradientDef linear_gradient = 2;
    RadialGradientDef radial_gradient = 3;
    ConicGradientDef conic_gradient = 4;
    ImageListDef image_list = 5;
    ImageSetDef image_set = 6;
    CrossFadeDef cross_fade = 7;
    string paint = 8;
  }
}

/// Linear gradient.
message LinearGradientDef {
  optional string angle = 1;
  optional SideOrCorner side_corner = 2;
  repeated CssColorStop stops = 3;
}

/// Radial gradient.
message RadialGradientDef {
  optional GradientShape shape = 1;
  optional GradientSize size = 2;
  optional string position = 3;
  repeated CssColorStop stops = 4;
}

/// Conic gradient.
message ConicGradientDef {
  optional string from_angle = 1;
  optional string position = 2;
  repeated CssColorStop stops = 3;
}

/// image() with fallback URLs.
message ImageListDef {
  repeated string urls = 1;
}

/// image-set() entry.
message ImageSetEntry {
  string url = 1;
  optional string resolution = 2;
  optional string media = 3;
}

/// image-set().
message ImageSetDef {
  repeated ImageSetEntry entries = 1;
}

/// cross-fade() blend.
message CrossFadeDef {
  repeated CssImage images = 1;
  repeated double percentages = 2;
}

/// Color stop in a gradient.
message CssColorStop {
  string color = 1;
  optional string position = 2;
}
