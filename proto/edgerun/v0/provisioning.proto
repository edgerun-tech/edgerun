syntax = "proto3";

package edgerun.v0.provisioning;

option go_package = "github.com/edgerun/proto/edgerun/v0/provisioning";

import "edgerun/v0/common.proto";

// ============================================================================
// Provisioning Kind - enum instead of bool
// ============================================================================

enum ProvisioningKind {
  PROVISIONING_KIND_UNSPECIFIED = 0;  // Rejected
  PROVISIONING_KIND_SINGLE_NODE = 1;   // Normal path
  PROVISIONING_KIND_TEMPLATE = 2;       // Reserved - not supported yet
}

// ============================================================================
// Provisioning Contract Status
// ============================================================================

enum ProvisioningContractStatus {
  PROVISIONING_CONTRACT_STATUS_UNSPECIFIED = 0;
  PROVISIONING_CONTRACT_STATUS_ISSUED = 1;
  PROVISIONING_CONTRACT_STATUS_BAKED_INTO_ARTIFACT = 2;
  PROVISIONING_CONTRACT_STATUS_FIRST_BOOT_CLAIM_RECEIVED = 3;
  PROVISIONING_CONTRACT_STATUS_ACCEPTED = 4;
  PROVISIONING_CONTRACT_STATUS_REJECTED = 5;
  PROVISIONING_CONTRACT_STATUS_CONSUMED = 6;
  PROVISIONING_CONTRACT_STATUS_REPLAY_REJECTED = 7;
  PROVISIONING_CONTRACT_STATUS_REVOKED = 8;
}

// ============================================================================
// Provisioning Decision (Controller verdict)
// ============================================================================

enum ProvisioningDecision {
  PROVISIONING_DECISION_UNSPECIFIED = 0;
  PROVISIONING_DECISION_ACCEPTED = 1;
  PROVISIONING_DECISION_REJECTED = 2;
  PROVISIONING_DECISION_REPLAY_REJECTED = 3;
}

// ============================================================================
// Provisioning Contract
// ============================================================================

message ProvisioningContract {
  // Version of the contract schema
  string version = 1;

  // Unique identifier for this provisioning contract
  string provisioning_id = 2;

  // Controller identity that authorized this contract
  edgerun.v0.Identity controller = 3;

  // Intended node label/nickname
  string node_label = 4;

  // Intended node role (e.g., "compute", "storage", "gateway")
  string node_role = 5;

  // Scheduler tags for job assignment
  repeated string scheduler_tags = 6;

  // Bootstrap coordinator endpoint URL
  string bootstrap_coordinator_url = 7;

  // Networking profile identifier
  string network_profile_id = 8;

  // Resource advertisement policy
  string resource_advertisement_policy = 9;

  // Controller identity (repeated for clarity in genesis)
  // initial_controller_capabilities = 10;

  // Expected hardware/assurance policy
  string required_assurance = 11;

  // Build artifact hash (for supply chain integrity)
  string build_artifact_hash = 12;

  // Config hash (for configuration integrity)
  string config_hash = 13;

  // When this contract was issued
  edgerun.v0.Timestamp issued_at = 14;

  // When this contract expires (reject if first boot after this)
  edgerun.v0.Timestamp expires_at = 15;

  // Single-node or template (enum, not bool)
  ProvisioningKind kind = 16;

  // Controller signature over the contract payload
  edgerun.v0.Signature controller_signature = 17;
}

// ============================================================================
// Node Genesis Claim
// ============================================================================

message NodeGenesisClaim {
  // Version of the claim schema
  string version = 1;

  // Provisioning ID this claim is for
  string provisioning_id = 2;

  // Hash of the provisioning contract (committed to in genesis)
  string provisioning_contract_hash = 3;

  // Node identity (generated on first boot)
  edgerun.v0.Identity node_identity = 4;

  // Controller identity (from contract)
  edgerun.v0.Identity controller = 5;

  // Node stream ID (where genesis event will be written)
  string node_stream_id = 6;

  // Hash of the genesis event (for verification)
  string node_genesis_event_hash = 7;

  // Node label (from contract or generated)
  string node_label = 8;

  // Build artifact hash (from contract)
  string build_artifact_hash = 9;

  // Config hash (from contract)
  string config_hash = 10;

  // Boot measurement hash (optional, for secure boot scenarios)
  optional string boot_measurement_hash = 11;

  // When this claim was created
  edgerun.v0.Timestamp created_at = 12;

  // Node signature over the claim payload
  edgerun.v0.Signature node_signature = 13;
}

// ============================================================================
// Provisioning Acceptance (Controller accepts the claim)
// ============================================================================

message ProvisioningAcceptance {
  // Version of the acceptance schema
  string version = 1;

  // Provisioning ID this acceptance is for
  string provisioning_id = 2;

  // Controller identity
  edgerun.v0.Identity controller = 3;

  // Node identity (from the claim)
  edgerun.v0.Identity node_identity = 4;

  // Hash of the node genesis claim (for reference)
  string node_genesis_claim_hash = 5;

  // Capabilities granted to the node by the controller
  repeated edgerun.v0.Capability accepted_capabilities = 6;

  // When this decision was made
  edgerun.v0.Timestamp decided_at = 7;

  // Controller signature over the acceptance
  edgerun.v0.Signature controller_signature = 8;
}

// ============================================================================
// Provisioning Rejection (Controller rejects the claim)
// ============================================================================

message ProvisioningRejection {
  // Version of the rejection schema
  string version = 1;

  // Provisioning ID this rejection is for
  string provisioning_id = 2;

  // Node identity (if known, may be empty for early rejections)
  optional edgerun.v0.Identity node_identity = 3;

  // Machine-readable reason code
  string reason_code = 4;

  // Human-readable reason
  string reason = 5;

  // When this decision was made
  edgerun.v0.Timestamp decided_at = 6;

  // Controller signature over the rejection
  edgerun.v0.Signature controller_signature = 7;
}

// ============================================================================
// Provisioning Replay Rejection (Contract already consumed)
// ============================================================================

message ProvisioningReplayRejection {
  // Version of the rejection schema
  string version = 1;

  // Provisioning ID (already consumed)
  string provisioning_id = 2;

  // Identity of the first node that consumed this contract
  edgerun.v0.Identity first_consumer_identity = 3;

  // When this replay was detected
  edgerun.v0.Timestamp detected_at = 4;

  // Controller signature
  edgerun.v0.Signature controller_signature = 5;
}

// ============================================================================
// Node Stream Events (written by node)
// ============================================================================

// These are event types that may appear in the node's stream
// They are referenced here for clarity but defined in the main stream proto

// NODE_GENESIS_CREATED: Node created its genesis event
// PROVISIONING_CLAIM_SENT: Node sent its genesis claim to controller
// CONTROLLER_ACCEPTANCE_OBSERVED: Node observed controller acceptance
// CONTROLLER_REJECTION_OBSERVED: Node observed controller rejection
// PROVISIONING_REPLAY_WARNING: Node detected replay/reuse warning

// ============================================================================
// Controller Stream Events (written by controller)
// ============================================================================

// These are event types that may appear in the controller's stream

// PROVISIONING_CONTRACT_ISSUED: Controller issued a contract
// NODE_GENESIS_CLAIM_RECEIVED: Controller received a genesis claim
// NODE_PROVISIONING_ACCEPTED: Controller accepted a claim
// NODE_PROVISIONING_REJECTED: Controller rejected a claim
// PROVISIONING_REPLAY_REJECTED: Controller detected replay
// PROVISIONING_CONTRACT_REVOKED: Controller revoked a contract

// ============================================================================
// Query/Status Messages (for coordinator dashboard)
// ============================================================================

message ProvisioningStatusRequest {
  string provisioning_id = 1;
  optional edgerun.v0.Identity node_identity = 2;
}

message ProvisioningStatusResponse {
  ProvisioningContractStatus status = 1;
  ProvisioningDecision decision = 2;
  optional edgerun.v0.Identity node_identity = 3;
  optional string reason = 4;
  optional edgerun.v0.Timestamp decided_at = 5;
}

message ListProvisioningContractsRequest {
  optional ProvisioningContractStatus filter_status = 1;
  optional string filter_controller = 2;
}

message ListProvisioningContractsResponse {
  repeated ProvisioningContract contracts = 1;
  repeated ProvisioningStatusResponse statuses = 2;
}
