syntax = "proto3";

package edgerun.v0.common;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

enum IdentityKind {
  IDENTITY_KIND_UNSPECIFIED = 0;
  IDENTITY_KIND_USER = 1;
  IDENTITY_KIND_NODE = 2;
  IDENTITY_KIND_AGENT = 3;
  IDENTITY_KIND_SERVICE = 4;
  IDENTITY_KIND_OTHER = 5;
}

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_PAYLOAD = 1;
  OBJECT_KIND_ATTACHMENT = 2;
  OBJECT_KIND_SNAPSHOT = 3;
  OBJECT_KIND_MANIFEST = 4;
  OBJECT_KIND_INDEX = 5;
  OBJECT_KIND_COMMAND = 6;
  OBJECT_KIND_PROOF = 7;
  OBJECT_KIND_DERIVED_VIEW = 8;
  OBJECT_KIND_APP_PACKAGE = 9;
  OBJECT_KIND_UI_TREE = 10;
}

enum AssuranceClass {
  ASSURANCE_CLASS_UNSPECIFIED = 0;
  ASSURANCE_CLASS_SOFTWARE = 1;
  ASSURANCE_CLASS_HARDWARE_BACKED = 2;
  ASSURANCE_CLASS_ATTESTED_RUNTIME = 3;
}

enum TransportClass {
  TRANSPORT_CLASS_UNSPECIFIED = 0;
  TRANSPORT_CLASS_BLE = 1;
  TRANSPORT_CLASS_LAN_IP = 2;
  TRANSPORT_CLASS_QUIC = 3;
  TRANSPORT_CLASS_WIFI_DIRECT = 4;
  TRANSPORT_CLASS_RELAY = 5;
  TRANSPORT_CLASS_STORE_FORWARD = 6;
  TRANSPORT_CLASS_OTHER = 7;
}

enum Directness {
  DIRECTNESS_UNSPECIFIED = 0;
  DIRECTNESS_DIRECT = 1;
  DIRECTNESS_RELAYED = 2;
  DIRECTNESS_BRIDGE_REQUIRED = 3;
  DIRECTNESS_STORE_FORWARD = 4;
}

enum StorageClass {
  STORAGE_CLASS_UNSPECIFIED = 0;
  STORAGE_CLASS_HOT = 1;
  STORAGE_CLASS_WARM = 2;
  STORAGE_CLASS_COLD = 3;
  STORAGE_CLASS_ARCHIVE = 4;
}

enum ExecutionClass {
  EXECUTION_CLASS_UNSPECIFIED = 0;
  EXECUTION_CLASS_LOCAL_ONLY = 1;
  EXECUTION_CLASS_TRUSTED_PEER = 2;
  EXECUTION_CLASS_TEE_ALLOWED = 3;
  EXECUTION_CLASS_REDUNDANT_UNTRUSTED = 4;
  EXECUTION_CLASS_PUBLIC = 5;
}

message Digest {
  enum Algorithm {
    DIGEST_ALGORITHM_UNSPECIFIED = 0;
    DIGEST_ALGORITHM_SHA256 = 1;
  }

  Algorithm algorithm = 1;
  bytes value = 2;
}

message Signature {
  enum Algorithm {
    SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
    SIGNATURE_ALGORITHM_ECDSA_P256_SHA256 = 1;
  }

  Algorithm algorithm = 1;
  bytes value = 2;
}

message TimeWindow {
  google.protobuf.Timestamp not_before = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RateLimit {
  uint64 max_operations = 1;
  google.protobuf.Duration per = 2;
}

message IdentityRef {
  bytes identity_id = 1;
  optional IdentityKind identity_kind = 2;
  optional bytes key_hint = 3;
}

message NodeRef {
  bytes node_id = 1;
}

message StreamRef {
  bytes stream_id = 1;
}

message EventRef {
  bytes stream_id = 1;
  uint64 seq = 2;
  Digest event_hash = 3;
}

message HeadRef {
  bytes stream_id = 1;
  uint64 seq = 2;
  Digest event_hash = 3;
}

message CheckpointRef {
  optional bytes checkpoint_id = 1;
  repeated HeadRef heads = 2;
}

message ObjectRef {
  bytes object_id = 1;
  optional ObjectKind object_kind = 2;
}

message RepresentationRef {
  bytes representation_id = 1;
  bytes object_id = 2;
}

message CommandRef {
  bytes command_id = 1;
  Digest command_hash = 2;
}

message DelegationRef {
  bytes delegation_id = 1;
  Digest delegation_hash = 2;
}

message RevocationRef {
  bytes revocation_id = 1;
  Digest revocation_hash = 2;
}

message SnapshotRef {
  bytes snapshot_id = 1;
  optional bytes object_id = 2;
}

// ===========================================================================
// EncryptedEnvelope — strict E2E encryption with ECDH key exchange
//
// ALL private data MUST be:
// - encrypted using ECDH P-256 key agreement + AEAD payload encryption
// - ephemeral key per message (forward secrecy)
// - recipient-bound with per-recipient wrapped message keys
// - signature-protected
//
// Encryption model:
//   1. Generate ephemeral ECDH key pair
//   2. Generate random message key K_msg
//   3. For each recipient: K_wrapped = AEAD(ECDH(shared_secret), K_msg)
//   4. Ciphertext = AEAD(K_msg, plaintext)
//   5. Sign: sender || recipients || ephemeral_pub || nonce || ciphertext
//
// Domain separation: "edgerun:v0:hash:encrypted-envelope"
// ===========================================================================

enum CipherSuite {
  CIPHER_SUITE_UNSPECIFIED = 0;
  CIPHER_SUITE_XCHACHA20_POLY1305 = 1;
  CIPHER_SUITE_AES256_GCM = 2;
}

// Per-recipient wrapped message key
message RecipientKey {
  // Recipient identity public key (uncompressed P-256, 65 bytes)
  bytes identity = 1;
  // AEAD-encrypted message key, wrapped with ECDH-derived key
  bytes encrypted_key = 2;
  // Nonce used for wrapping the message key
  bytes key_nonce = 3;
}

message EncryptedEnvelope {
  uint32 version = 1;

  // Sender identity key (uncompressed P-256 public key, 65 bytes)
  bytes sender = 2;

  // Recipient keys — each contains identity + wrapped message key
  repeated RecipientKey recipients = 3;

  // Ephemeral ECDH public key (uncompressed P-256, 65 bytes)
  bytes ephemeral_pubkey = 4;

  // Cipher used for payload encryption
  CipherSuite cipher = 5;

  // Nonce for payload AEAD encryption
  bytes nonce = 6;

  // AEAD ciphertext (includes embedded tag for most ciphers)
  bytes ciphertext = 7;

  // Explicit authentication tag (for ciphers that separate it)
  bytes tag = 8;

  // ECDSA P-256 signature over (sender || recipients || ephemeral_pub || nonce || ciphertext)
  bytes signature = 9;
}
