syntax = "proto3";

package edgerun.v0.ui.touch;

/// Touch Event Types — generated from W3C Touch Events Level 2.
/// DO NOT EDIT. Regenerate with: scripts/generate_web_platform5.py

/// Touch point type.
enum TouchType {
  TOUCH_TYPE_UNSPECIFIED = 0;
  TOUCH = 1;
  PEN = 2;
  DIRECT = 3;
  STYLUS = 4;
}

/// Touch-action values.
enum TouchAction {
  TOUCH_ACTION_UNSPECIFIED = 0;
  AUTO = 1;
  NONE = 2;
  PAN_X = 3;
  PAN_Y = 4;
  PAN_LEFT = 5;
  PAN_RIGHT = 6;
  PAN_UP = 7;
  PAN_DOWN = 8;
  MANIPULATION = 9;
  PINCH_ZOOM = 10;
}

/// A single touch point.
message Touch {
  uint64 identifier = 1;
  uint64 target_node_id = 2;
  double screen_x = 3;
  double screen_y = 4;
  double client_x = 5;
  double client_y = 6;
  double page_x = 7;
  double page_y = 8;
  double radius_x = 9;
  double radius_y = 10;
  double rotation_angle = 11;
  double force = 12;
  TouchType touch_type = 13;
  optional double altitude_angle = 14;
  optional double azimuth_angle = 15;
}

/// Touch event data.
message TouchEvent {
  repeated Touch touches = 1;
  repeated Touch target_touches = 2;
  repeated Touch changed_touches = 3;
  bool ctrl_key = 4;
  bool shift_key = 5;
  bool alt_key = 6;
  bool meta_key = 7;
}
