syntax = "proto3";

package edgerun.v0.html.tree_builder;

/// HTML Tree Builder Rules — generated from WHATWG HTML Living Standard §13.2.6.
/// DO NOT EDIT. Regenerate with: go run ./cmd/html-codegen

import "edgerun/v0/html/tokenizer_states.proto";

// ---------------------------------------------------------------------------
// Insertion modes from WHATWG §13.2.6.
// ---------------------------------------------------------------------------

/// All insertion modes from WHATWG §13.2.6.
enum InsertionMode {
  INSERTION_MODE_UNSPECIFIED = 0;
  INITIAL_MODE = 1;
  BEFORE_HTML_MODE = 2;
  BEFORE_HEAD_MODE = 3;
  IN_HEAD_MODE = 4;
  IN_HEAD_NOSCRIPT_MODE = 5;
  AFTER_HEAD_MODE = 6;
  IN_BODY_MODE = 7;
  TEXT_MODE = 8;
  IN_TABLE_MODE = 9;
  IN_TABLE_TEXT_MODE = 10;
  IN_CAPTION_MODE = 11;
  IN_COLUMN_GROUP_MODE = 12;
  IN_TABLE_BODY_MODE = 13;
  IN_ROW_MODE = 14;
  IN_CELL_MODE = 15;
  IN_SELECT_MODE = 16;
  IN_SELECT_IN_TABLE_MODE = 17;
  IN_TEMPLATE_MODE = 18;
  AFTER_BODY_MODE = 19;
  IN_FRAMESET_MODE = 20;
  AFTER_FRAMESET_MODE = 21;
  AFTER_AFTER_BODY_MODE = 22;
  AFTER_AFTER_FRAMESET_MODE = 23;
}

// ---------------------------------------------------------------------------
// Tree builder actions.
// ---------------------------------------------------------------------------

/// Actions the tree builder can take in response to a token.
enum TreeAction {
  TREE_ACTION_UNSPECIFIED = 0;

  // Create an element for the token and push to open elements stack.
  TREE_ACTION_INSERT = 1;
  // Foster-parent the element (used in table mode).
  TREE_ACTION_INSERT_FOSTER = 2;
  // Ignore the token entirely.
  TREE_ACTION_IGNORE = 3;
  // Report a parse error and ignore the token.
  TREE_ACTION_PARSE_ERROR = 4;
  // Reprocess the current token in the new insertion mode.
  TREE_ACTION_REPROCESS = 5;
  // Pop the current node from the stack of open elements.
  TREE_ACTION_POP = 6;
  // Pop elements until a specific element has been popped.
  TREE_ACTION_POP_UNTIL = 7;
  // Reset the insertion mode to the appropriate one.
  TREE_ACTION_RESET_INSERTION_MODE = 8;
  // Acknowledge the self-closing flag on a start tag.
  TREE_ACTION_ACKNOWLEDGE_SELF_CLOSING = 9;
  // Switch the tokenizer to RCDATA state.
  TREE_ACTION_SWITCH_TO_RCDATA = 10;
  // Switch the tokenizer to RAWTEXT state.
  TREE_ACTION_SWITCH_TO_RAWTEXT = 11;
  // Switch the tokenizer to SCRIPT_DATA state.
  TREE_ACTION_SWITCH_TO_SCRIPT_DATA = 12;
  // Switch the tokenizer to PLAINTEXT state.
  TREE_ACTION_SWITCH_TO_PLAINTEXT = 13;
  // Append the character token to the current node.
  TREE_ACTION_APPEND_CHARACTER = 14;
  // Append the comment token to the current node.
  TREE_ACTION_APPEND_COMMENT = 15;
  // Append the DOCTYPE token to the current node.
  TREE_ACTION_APPEND_DOCTYPE = 16;
  // Set the frameset-ok flag to "not ok".
  TREE_ACTION_SET_FRAMESET_NOT_OK = 17;
  // Pop all nodes until an HTML element (or head, body) is popped.
  TREE_ACTION_POP_ALL = 18;
}

// ---------------------------------------------------------------------------
// Token trigger for a rule.
// ---------------------------------------------------------------------------

/// What kind of token triggers this rule.
message TokenTrigger {
  oneof trigger {
    edgerun.v0.html.tokenizer.TokenType token_type = 1;  // EOF, comment, character, doctype
    string start_tag = 2;           // e.g. "html", "head", "div", "table"
    string end_tag = 3;             // e.g. "body", "html", "p"
    bool any_start_tag = 4;         // any start tag not matched by a specific rule
    bool any_end_tag = 5;           // any end tag not matched by a specific rule
    bool character_token = 6;       // any character token
    bool whitespace_character = 7;  // whitespace-only character token
  }
}

// ---------------------------------------------------------------------------
// Stack of open elements conditions.
// ---------------------------------------------------------------------------

/// Conditions on the stack of open elements for a rule to apply.
message StackCondition {
  // "has element in scope" — pop until finding this tag or hitting a boundary.
  repeated string has_in_scope = 1;
  // "has element in button scope" — scope but <button> is a boundary.
  repeated string has_in_button_scope = 2;
  // "has element in list item scope" — scope but <ol>/<ul> are boundaries.
  repeated string has_in_list_scope = 3;
  // "has element in table scope" — scope but <table>/<template> are boundaries.
  repeated string has_in_table_scope = 4;
  // "has element in select scope" — scope but <select> is a boundary.
  repeated string has_in_select_scope = 5;
  // "has element in specific scope" with custom boundaries.
  repeated string has_in_specific_scope = 6;  // tags to look for
  repeated string specific_scope_boundaries = 7;  // boundary tags
}

// ---------------------------------------------------------------------------
// A single tree builder rule.
// ---------------------------------------------------------------------------

/// A rule: given insertion mode + token trigger → actions + next mode.
message TreeRule {
  InsertionMode mode = 1;
  TokenTrigger trigger = 2;
  repeated TreeAction actions = 3;

  // For POP_UNTIL: which tag name to pop until.
  string pop_until_tag = 4;

  // For rules that switch insertion mode.
  InsertionMode next_mode = 5;

  // Optional: if this rule has a stack condition, it only applies
  // when the condition is met. If no condition, rule always applies.
  StackCondition condition = 6;

  // Optional: if condition is NOT met, fall through to the next rule.
  // This models the "otherwise" clauses in the spec.
  bool otherwise = 7;

  // WHATWG spec section for tracing.
  string spec_paragraph = 8;     // e.g. "13.2.6.4.16.7 In body"
}

// ---------------------------------------------------------------------------
// Complete tree builder rule set.
// ---------------------------------------------------------------------------

/// Complete tree builder rules for all insertion modes.
message TreeBuilderRuleSet {
  string spec_section = 1;       // "13.2.6"
  string spec_date = 2;
  repeated TreeRule rules = 3;
  int32 total_rules = 4;
  int32 total_insertion_modes = 5;
}

// ---------------------------------------------------------------------------
// Scope definitions for the stack of open elements.
// ---------------------------------------------------------------------------

/// Scope definition: which tags to look for and what stops the search.
message ScopeDefinition {
  string name = 1;               // "default", "button", "list_item", "table", "select"
  repeated string boundaries = 2;  // tags that stop the search
}

/// All scope definitions used by the tree builder.
message ScopeDefinitions {
  repeated ScopeDefinition scopes = 1;
}
