syntax = "proto3";

package edgerun.v0.html.tokenizer;

/// HTML Tokenizer State Machine — generated from WHATWG HTML Living Standard §13.2.5.
/// DO NOT EDIT. Regenerate with: go run ./cmd/html-codegen

// ---------------------------------------------------------------------------
// Character classes — each input code point maps to exactly one class.
// ---------------------------------------------------------------------------

/// Character classes for tokenizer state transitions.
/// Each input byte/code point maps to exactly one class.
enum CharClass {
  CHAR_CLASS_UNSPECIFIED = 0;
  CHAR_CLASS_EOF = 1;
  CHAR_CLASS_TAB = 2;             // U+0009 CHARACTER TABULATION
  CHAR_CLASS_LF = 3;              // U+000A LINE FEED
  CHAR_CLASS_FF = 4;              // U+000C FORM FEED
  CHAR_CLASS_CR = 5;              // U+000D CARRIAGE RETURN
  CHAR_CLASS_SPACE = 6;           // U+0020 SPACE
  CHAR_CLASS_QUOT = 7;            // U+0022 QUOTATION MARK
  CHAR_CLASS_AMP = 8;             // U+0026 AMPERSAND
  CHAR_CLASS_APOS = 9;            // U+0027 APOSTROPHE
  CHAR_CLASS_HYPHEN = 10;         // U+002D HYPHEN-MINUS
  CHAR_CLASS_SLASH = 11;          // U+002F SOLIDUS
  CHAR_CLASS_DIGIT = 12;          // U+0030–U+0039 DIGIT ZERO–NINE
  CHAR_CLASS_UPPER_ALPHA = 13;    // U+0041–U+005A LATIN CAPITAL LETTER A–Z
  CHAR_CLASS_LOWER_ALPHA = 14;    // U+0061–U+007A LATIN SMALL LETTER A–Z
  CHAR_CLASS_GT = 15;             // U+003E GREATER-THAN SIGN
  CHAR_CLASS_EQ = 16;             // U+003D EQUALS SIGN
  CHAR_CLASS_LT = 17;             // U+003C LESS-THAN SIGN
  CHAR_CLASS_QUESTION = 18;       // U+003F QUESTION MARK
  CHAR_CLASS_NULL = 19;           // U+0000 NULL
  CHAR_CLASS_SEMICOLON = 20;      // U+003B SEMICOLON
  CHAR_CLASS_EXCLAMATION = 21;    // U+0021 EXCLAMATION MARK
  CHAR_CLASS_SQUARE_CLOSE = 22;   // U+005D RIGHT SQUARE BRACKET
  CHAR_CLASS_PERCENT = 23;        // U+0025 PERCENT SIGN
  CHAR_CLASS_OTHER = 24;          // everything else
}

// ---------------------------------------------------------------------------
// Token types emitted by the tokenizer.
// ---------------------------------------------------------------------------

/// Token types emitted by the tokenizer.
enum TokenType {
  TOKEN_TYPE_UNSPECIFIED = 0;
  TOKEN_TYPE_DOCTYPE = 1;
  TOKEN_TYPE_START_TAG = 2;
  TOKEN_TYPE_END_TAG = 3;
  TOKEN_TYPE_COMMENT = 4;
  TOKEN_TYPE_CHARACTER = 5;       // one or more character tokens
  TOKEN_TYPE_EOF = 6;
  TOKEN_TYPE_NULL = 7;            // U+FFFD replacement for null
}

// ---------------------------------------------------------------------------
// All tokenizer states from WHATWG §13.2.5.
// ---------------------------------------------------------------------------

