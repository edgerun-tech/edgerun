// ---------------------------------------------------------------------------
// Actions taken during a state transition.
// ---------------------------------------------------------------------------

/// Action to take during a state transition.
message TransitionAction {
  oneof action {
    // Emit the current input character as a character token.
    bool emit_current_char = 1;
    // Emit the current input character as a U+FFFD REPLACEMENT CHARACTER.
    bool emit_replacement_char = 2;
    // Emit a null token.
    bool emit_null_token = 3;
    // Emit an EOF token.
    bool emit_eof_token = 4;
    // Emit a token of the given type (start tag, end tag, comment, doctype).
    TokenType emit_token_type = 5;
    // Reconsume the current input character in the next state.
    bool reconsume = 6;
    // Parse error: unexpected null character.
    bool error_unexpected_null = 7;
    // Parse error: unexpected character.
    bool error_unexpected_char = 8;
    // Parse error: missing semicolon for character reference.
    bool error_missing_semicolon = 9;
    // Append current char to the current token's data.
    bool append_current_to_token_data = 10;
    // Append current char to the current token's tag name.
    bool append_current_to_tag_name = 11;
    // Append current char to the current token's attribute name.
    bool append_current_to_attr_name = 12;
    // Append current char to the current token's attribute value.
    bool append_current_to_attr_value = 13;
    // Append current char to the temporary buffer.
    bool append_current_to_temp_buffer = 14;
    // Append replacement char (U+FFFD) to the current token's data.
    bool append_replacement_to_token_data = 15;
    // Set the self-closing flag on the current start tag token.
    bool set_self_closing_flag = 16;
    // Set the return state for character reference processing.
    TokenizerState set_return_state = 17;
    // Switch tokenizer state (without reconsuming).
    TokenizerState switch_tokenizer_state = 18;
    // Flush code points consumed as a character reference.
    bool flush_char_ref = 19;
    // Create a new start tag token.
    bool create_start_tag_token = 20;
    // Create a new end tag token.
    bool create_end_tag_token = 21;
    // Create a new comment token.
    bool create_comment_token = 22;
    // Create a new DOCTYPE token.
    bool create_doctype_token = 23;
    // Mark DOCTYPE force-quirks flag.
    bool set_doctype_force_quirks = 24;
    // Check if current tag name matches an appropriate end tag.
    bool check_appropriate_end_tag = 25;
    // Check if current temp buffer is "script".
    bool check_temp_buffer_is_script = 26;
  }
}

/// A single state transition: given state + char class → next state + actions.
message StateTransition {
  TokenizerState current_state = 1;
  CharClass char_class = 2;
  TokenizerState next_state = 3;
  repeated TransitionAction actions = 4;
  string spec_section = 5;       // e.g. "13.2.5.1" (Data state)
}

/// Complete tokenizer state machine.
message TokenizerStateMachine {
  string spec_section = 1;       // "13.2.5"
  string spec_url = 2;           // WHATWG URL
  string spec_date = 3;          // date of spec snapshot
  repeated StateTransition transitions = 4;
  TokenizerState initial_state = 5;
  int32 total_states = 6;
  int32 total_transitions = 7;
}
