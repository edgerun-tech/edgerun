[app]
id = "com-google-android-contactkeys"
source_android_package = "com.google.android.contactkeys"
status = "draft_static_analysis"

[capabilities]
network = { default = "deny", allow_domains = ["fonts.gstatic.com", "github.com"] }
location = { mode = "coarse", prompt = "per_use" }
storage = { app_private = true, document_grants = "prompt" }
local_state = { backend = "structured_store" }
notifications = { channel = "app_scoped", prompt = true }
background_tasks = { scheduler = "explicit", event_subscriptions = "review" }
camera_media = { sessions = "explicit_prompt" }
bluetooth_nearby = { scan = "prompt", connect = "allowlist" }
secrets_crypto = { keystore = "edgerun", certificates = "review" }

[analysis]
unique_signatures = 6623
total_call_sites = 82131
confidence = "medium_static_needs_dynamic_trace"
