[package]
name = "edgerun-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Minimal epoll-based async runtime for edgerun"

[dependencies]
libc.workspace = true
edgerun-log = { path = "../edgerun-log" }

[dev-dependencies]
loom = "0.7"

[lints]
workspace = true

[[example]]
name = "tcp_echo"

# =============================================================================
# Test layer organization — see tests/README.md
# Layer 0: Core runtime primitives (yield_now, sleep_until)
# Layer 1: Basic async primitives (notify, semaphore, cancellation, once_cell, latch)
# Layer 2: Async synchronization (mutex, rwlock, barrier)
# Layer 3: Channels (oneshot, mpsc, unbounded, watch, broadcast)
# Layer 4: Control flow (join!, select!, JoinSet)
# Layer 5: Timers (sleep, timeout, interval)
# Layer 6: I/O primitives (async_fd, cursor, duplex, buf, io_util, lines)
# Layer 7: Network I/O (tcp, udp, unix, unix_dgram)
# Layer 8: Higher-level (fs, process, signal, rate_limiter, abort, metrics, shutdown)
# Layer 9: Stress / race tests
# Layer 10: E2E integration tests
# =============================================================================

# Layer 0: Core runtime primitives
