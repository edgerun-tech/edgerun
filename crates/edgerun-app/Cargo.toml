[package]
name = "edgerun-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun native app — eframe (egui+winit+wgpu) + WASM runtime"

[[bin]]
name = "edgerun-app"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["eframe/default"]
wayland = ["eframe/wayland"]
x11 = ["eframe/x11"]
external_compositor = ["wayland", "eframe/glow"]

[dependencies]
edgerun-ui = { workspace = true }
edgerun-proto = { workspace = true }
edgerun-core = { workspace = true }
edgerun-node = { workspace = true }
edgerun-storage = { workspace = true }
edgerun-hardware-signing = { workspace = true }
edgerun-crypto = { workspace = true, default-features = false, features = ["p256"] }
wasmtime = { workspace = true }
eframe = { workspace = true, default-features = false, optional = true }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
prost = { workspace = true }
prost-types = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
