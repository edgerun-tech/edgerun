<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeRun</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #e0e0e0; }
    #output { background: #0d0d0d; padding: 10px; border-radius: 4px; white-space: pre-wrap; margin-top: 10px; }
    #status { color: #888; margin-bottom: 10px; }
    .label { color: #6a6; }
  </style>
</head>
<body>
  <h1>EdgeRun Browser Runtime</h1>
  <div id="status">Loading...</div>
  <div id="output"></div>

  <script type="module">
    import { BrowserAdapter } from './adapter.js';

    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');

    const adapter = new BrowserAdapter({
      verbose: true,
      onOutput: (data) => {
        if (data.length >= 10) {
          const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
          const status = view.getUint16(0, true);
          const ctLen = view.getUint32(2, true);
          const ct = new TextDecoder().decode(data.slice(6, 6 + ctLen));
          const bodyOffset = 6 + ctLen;
          if (bodyOffset + 4 <= data.length) {
            const bodyLen = view.getUint32(bodyOffset, true);
            const body = new TextDecoder().decode(data.slice(bodyOffset + 4, bodyOffset + 4 + bodyLen));
            outputEl.textContent = `[${status}] ${ct}\n${body}`;
          } else {
            outputEl.textContent = `[${status}] ${ct}\n(incomplete body)`;
          }
        } else {
          outputEl.textContent = new TextDecoder().decode(data);
        }
      }
    });

    adapter.listenStorageEvent();

    try {
      statusEl.textContent = 'Loading WASM module...';
      const instance = await adapter.loadModule('app.wasm');

      const run = instance.exports.run;
      if (!run) {
        throw new Error('WASM module missing required export: run');
      }

      statusEl.textContent = 'Running WASM module...';

      const result = run(0, 0);

      statusEl.textContent = `Done (run returned: ${result})`;

      adapter.setTimer(5000);

    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
      outputEl.textContent = err.stack;
      console.error(err);
    }
  </script>
</body>
</html>
