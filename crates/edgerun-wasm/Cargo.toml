[package]
name = "edgerun-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun WASM Toolchain - Validator & Runtime"

[[bin]]
name = "edgerun-validate"
path = "src/validate.rs"

[[bin]]
name = "edgerun-runtime"
path = "src/runtime.rs"

[[bin]]
name = "edgerun-aot"
path = "src/aot.rs"

[dependencies]
edgerun-core = { version = "0.1", path = "../edgerun-core" }
anyhow = "1.0"
edgerun-clap = { workspace = true, features = ["std"] }
edgerun-capabilities = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
