[package]
name = "edgerun-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "EdgeRun WASM Toolchain - Validator"

[[bin]]
name = "edgerun-validate"
path = "src/validate.rs"

[dependencies]
wasmparser = "0.224"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }