[package]
name = "edgerun-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun WASM Toolchain - Validator & Runtime"

[[bin]]
name = "edgerun-validate"
path = "src/validate.rs"

[[bin]]
name = "edgerun-runtime"
path = "src/runtime.rs"

[dependencies]
anyhow = "1.0"
edgerun-clap = { workspace = true, features = ["std"] }
edgerun-proto = { workspace = true }
edgerun-capabilities = { workspace = true }
libc = { workspace = true }
wasmparser = "0.224"
wasmtime = "29"
sha2 = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
