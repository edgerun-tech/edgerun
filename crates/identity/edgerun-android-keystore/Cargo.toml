[package]
name = "edgerun-android-keystore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Android Keystore signing provider for Edgerun hardware identities"

[dependencies]
edgerun-protocols = { workspace = true, default-features = false, features = ["core"] }

[features]
default = []
# Real JNI-backed implementation — requires Android NDK toolchain.
android-real = ["dep:jni", "dep:ndk-context"]

[target.'cfg(target_os = "android")'.dependencies]
# Real Android Keystore implementation via JNI (optional)
# Enabled when building for actual Android devices.
# On non-Android targets these deps are feature-inert.
jni = { version = "0.22", optional = true }
ndk-context = { version = "0.1", optional = true }

[lints]
workspace = true
