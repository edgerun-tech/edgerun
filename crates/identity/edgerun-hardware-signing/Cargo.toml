[package]
name = "edgerun-hardware-signing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hardware-backed signing abstraction and provider dispatch for Edgerun"

[features]
default = []
tpm = ["dep:edgerun-tpm"]
android-keystore = ["dep:edgerun-android-keystore"]
# Real JNI-backed Android implementation (requires NDK toolchain)
android-real = ["android-keystore", "edgerun-android-keystore/android-real"]
yubikey = ["dep:edgerun-yubikey"]
# All backends
all-hardware = ["tpm", "android-keystore", "yubikey"]

[dependencies]
edgerun-protocols = { workspace = true, default-features = false, features = ["sign", "core"] }
edgerun-biometrics = { version = "0.1", path = "../../device-types/edgerun-biometrics" }
edgerun-tpm = { version = "0.1", path = "../edgerun-tpm", optional = true }
edgerun-android-keystore = { version = "0.1", path = "../edgerun-android-keystore", optional = true }
edgerun-yubikey = { version = "0.1", path = "../edgerun-yubikey", optional = true }

[lints]
workspace = true
