[package]
name = "edgerun-evdev-input"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux evdev input adapter for Edgerun"

[dependencies]
edgerun-capabilities = { version = "0.1", path = "../edgerun-capabilities" }
edgerun-encoding = { version = "0.1", path = "../edgerun-encoding" }
edgerun-input = { version = "0.1", path = "../edgerun-input" }
edgerun-linux-sysfs = { version = "0.1", path = "../edgerun-linux-sysfs" }

[target.'cfg(not(target_os = "none"))'.dependencies]
libc.workspace = true

[features]
std = []

[[bin]]
name = "evdev_input_tool"
path = "src/bin/evdev-input-tool.rs"
required-features = ["std"]

[lints]
workspace = true
