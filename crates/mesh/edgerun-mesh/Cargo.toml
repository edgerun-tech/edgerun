publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Identity-routed mesh primitives for Edgerun"

[dependencies]
edgerun-hardware-signing = { version = "0.1", path = "../../identity/edgerun-hardware-signing" }
edgerun-crypto = { workspace = true, default-features = false, features = ["p256"] }
edgerun-protocols = { workspace = true, default-features = false, features = ["core"] }
edgerun-json = { version = "0.1", path = "../../utility/edgerun-json", default-features = false }

[lints]
workspace = true
