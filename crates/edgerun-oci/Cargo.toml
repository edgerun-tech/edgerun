[package]
name = "edgerun-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OCI container runtime and registry client — pull, push, login, create, start, exec containers"

[dependencies]
edgerun-json = { path = "../edgerun-json", features = ["serde"] }
edgerun-crypto.workspace = true
edgerun-http = { path = "../edgerun-http" }
edgerun-bare-rt = { path = "../edgerun-bare-rt" }
edgerun-tls = { path = "../edgerun-tls" }
edgerun-secret-service = { path = "../edgerun-secret-service" }
edgerun-core = { path = "../edgerun-core" }
edgerun-encoding = { path = "../edgerun-encoding" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
libc = "0.2"
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }

[features]
default = []
std = ["dep:flate2", "dep:tar", "dep:zstd"]

[[bin]]
name = "ert"
path = "src/bin/ert.rs"
required-features = ["std"]

[lints]
workspace = true
