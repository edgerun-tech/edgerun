[package]
name = "edgerun-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OCI container runtime and registry client — pull, push, login, create, start, exec containers"

[dependencies]
edgerun-json = { version = "0.1", path = "../utility/edgerun-json", default-features = false }
edgerun-clap = { version = "0.1", path = "../utility/edgerun-clap", default-features = false }
edgerun-crypto = { workspace = true, default-features = false }
edgerun-http = { version = "0.1", path = "../edgerun-http", default-features = false, features = ["client", "tls"], optional = true }
edgerun-edgefs = { workspace = true, optional = true }
edgerun-storage = { workspace = true, optional = true }
edgerun-rt = { version = "0.1", path = "../edgerun-rt", optional = true }
edgerun-secret-service = { version = "0.1", path = "../edgerun-secret-service", optional = true }
edgerun-core = { version = "0.1", path = "../protocol/edgerun-core", optional = true }
edgerun-encoding = { version = "0.1", path = "../utility/edgerun-encoding" }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"], optional = true }

[features]
default = []
registry-client = ["dep:edgerun-http"]
edgefs = ["dep:edgerun-edgefs", "dep:edgerun-storage"]
gzip = ["dep:miniz_oxide"]
std = [
    "registry-client",
    "edgerun-http/std",
    "dep:edgerun-rt",
    "dep:edgerun-secret-service",
    "dep:edgerun-core",
]

[[bin]]
name = "ert"
path = "bin/ert.rs"
required-features = ["std"]

[lints]
workspace = true
