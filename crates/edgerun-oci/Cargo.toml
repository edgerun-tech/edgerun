[package]
name = "edgerun-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OCI container runtime and registry client — pull, push, login, create, start, exec containers"

[dependencies]
edgerun-json = { path = "../edgerun-json", default-features = false }
edgerun-crypto = { workspace = true, default-features = false }
edgerun-http = { path = "../edgerun-http", default-features = false, features = ["client", "tls"], optional = true }
edgerun-edgefs = { workspace = true, optional = true }
edgerun-storage = { workspace = true, optional = true }
edgerun-rt = { path = "../edgerun-rt", optional = true }
edgerun-secret-service = { path = "../edgerun-secret-service", optional = true }
edgerun-core = { path = "../edgerun-core", optional = true }
edgerun-encoding = { path = "../edgerun-encoding" }
miniz_oxide = { workspace = true }
ruzstd = { version = "0.8.2", default-features = false, optional = true }

[features]
default = []
registry-client = ["dep:edgerun-http"]
edgefs = ["dep:edgerun-edgefs", "dep:edgerun-storage"]
zstd = ["dep:ruzstd"]
std = [
    "registry-client",
    "dep:edgerun-rt",
    "dep:edgerun-secret-service",
    "dep:edgerun-core",
    "dep:libc",
    "zstd",
]

[target.'cfg(not(target_os = "none"))'.dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "ert"
path = "src/bin/ert.rs"
required-features = ["std"]

[[test]]
name = "registry_integration"
path = "tests/registry_integration.rs"
required-features = ["std"]

[lints]
workspace = true
