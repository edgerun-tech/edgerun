[package]
name = "edgerun-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OCI container runtime and registry client — pull, push, login, create, start, exec containers"

[dependencies]
edgerun-json = { workspace = true, default-features = false }
edgerun-crypto = { workspace = true, default-features = false, features = ["digest"] }
edgerun-node = { version = "0.1", path = "../node/edgerun-node", default-features = false, features = ["https"], optional = true }
edgerun-storage = { workspace = true, optional = true }
edgerun-secret-service = { workspace = true, optional = true }
edgerun-protocols = { workspace = true, default-features = false, features = ["oci"] }
edgerun-encoding = { workspace = true }

[features]
default = []
registry-client = ["dep:edgerun-node", "edgerun-protocols/http"]
edgefs = ["dep:edgerun-storage"]
gzip = ["edgerun-encoding/compression"]
std = [
    "registry-client",
    "dep:edgerun-secret-service",
]

[[bin]]
name = "ert"
path = "bin/ert.rs"
required-features = ["std"]

[lints]
workspace = true
