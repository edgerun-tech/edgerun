[package]
name = "contest"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
nix = { version = "0.31.2", features = ["mount", "socket", "uio", "fs", "process", "user"] }
num_cpus = "1.17"
oci-spec = { version = "0.9.0", features = ["runtime"] }
pnet_datalink = "0.35.0"
procfs = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
test_framework = { path = "../test_framework" }
uuid = "1.23"
which = "8.0.2"
tempfile = "3"
thiserror = "2.0"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
regex = "1"
edgerun_clap = { package = "edgerun-clap", path = "../../../../edgerun-clap", features = ["std"] }
edgerun-crypto = { path = "../../../../edgerun-crypto" }
