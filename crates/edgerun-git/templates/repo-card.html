<article class="repo-card repo-overview">
  <div>
    <h2><a href="/{{repo_name}}/">{{repo_title}}</a></h2>
    <p>{{repo_description}}</p>
    <span>{{default_ref}}</span>
  </div>
  <nav class="repo-card-actions" aria-label="{{repo_title_attr}} navigation">
    <a href="/{{repo_name}}/crates">Crate explorer</a>
    <a href="/{{repo_name}}/src/{{default_ref_attr}}">Source tree</a>
    <a href="/{{repo_name}}/commit/{{default_ref_attr}}">Latest commit</a>
  </nav>
</article>
