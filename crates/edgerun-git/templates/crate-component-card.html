<article class="crate-component" aria-label="{{crate_name_attr}} crate status">
  <div>
    <p class="eyebrow">Workspace crate</p>
    <h1>{{crate_name}}</h1>
    <p>{{crate_description}}</p>
  </div>
  <dl class="component-stats">
    <div><dt>Features</dt><dd>{{feature_count}}</dd></div>
    <div><dt>API</dt><dd>{{api_count}}</dd></div>
    <div><dt>Calls</dt><dd>{{call_count}}</dd></div>
    <div><dt>Tests</dt><dd>{{test_count}}</dd></div>
    <div><dt>Depends on</dt><dd>{{dependency_count}}</dd></div>
    <div><dt>Used by</dt><dd>{{dependent_count}}</dd></div>
  </dl>
  <p class="component-result">{{test_result}}</p>
  <p class="component-actions"><a target="_top" href="/{{repo_name}}/crates/{{crate_name_attr}}">Open crate page</a><a target="_top" href="/{{repo_name}}/src/{{default_ref}}/{{crate_path}}">Source</a></p>
</article>
