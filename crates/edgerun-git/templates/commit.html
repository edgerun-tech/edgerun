<main id="content" class="repo">
  <nav class="crumbs"><a href="/">Repositories</a><span>/</span><a href="/{{repo_name}}/">{{repo_title}}</a></nav>
  <header class="repo-head">
    <div>
      <p class="eyebrow">Commit</p>
      <h1>{{rev}}</h1>
    </div>
    <nav class="repo-actions" aria-label="Commit actions">
      <a class="commit-link" href="/{{repo_name}}/crates">Crates</a>
      <a class="commit-link" href="/{{repo_name}}/src/{{rev}}">Browse tree</a>
    </nav>
  </header>
  <pre class="commit"><code>{{commit}}</code></pre>
</main>
