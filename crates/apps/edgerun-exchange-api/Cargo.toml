[package]
name = "edgerun-exchange-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun Exchange HTTP API service"

[dependencies]
edgerun-protocols = { workspace = true, default-features = false, features = ["core"] }
edgerun-exchange = { version = "0.1", path = "../../edgerun-exchange" }
