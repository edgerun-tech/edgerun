[package]
name = "edgerun-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OAuth helpers for Edgerun service authentication"

[dependencies]
edgerun-crypto = { workspace = true, default-features = false, features = ["hmac", "p256", "rsa"] }
edgerun-node = { version = "0.1", path = "../../node/edgerun-node", default-features = false, features = ["client", "tls"] }
edgerun-log = { workspace = true }
edgerun-json = { workspace = true }
edgerun-secret-service = { workspace = true }
edgerun-encoding = { workspace = true, default-features = false }
edgerun-protocols = { workspace = true, default-features = false, features = ["oauth"] }

[lints]
workspace = true
