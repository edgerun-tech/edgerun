[package]
name = "edgerun-reqwest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun-owned Reqwest-compatible HTTP client facade"

[features]
default = ["cookies", "native", "http1", "http2", "http3", "tls"]
cookies = []
http1 = ["native", "edgerun-http-client/http1"]
http2 = ["native", "edgerun-http-client/http2"]
http3 = ["native", "edgerun-http-client/http3"]
full = ["cookies", "json", "stream", "http1", "http2", "http3", "tls"]
json = []
native = ["dep:edgerun-http-client", "edgerun-http-client/std"]
native-root = ["native"]
tls = ["native", "edgerun-http-client/tls"]
stream = []

[dependencies]
edgerun-bytes = { version = "0.1", path = "../edgerun-bytes" }
edgerun-encoding = { version = "0.1", path = "../edgerun-encoding", default-features = false }
edgerun-futures = { version = "0.1", path = "../edgerun-futures" }
edgerun-http = { version = "0.1", path = "../edgerun-http" }
edgerun-json = { version = "0.1", path = "../edgerun-json", default-features = false }
edgerun-http-client = { version = "0.1", path = "../edgerun-http-client", default-features = false, features = ["client", "std"], optional = true }
edgerun-url = { version = "0.1", path = "../edgerun-url", default-features = false }

[lints]
workspace = true
