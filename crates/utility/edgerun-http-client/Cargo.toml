[package]
name = "edgerun-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned HTTP client and runtime transport boundary"

[features]
default = ["std", "client", "http1", "http2", "http3", "tls"]
std = []
runtime = []
client = ["http", "runtime"]
server = ["http", "runtime"]
static-files = ["server"]
connection-middleware = []
http-compression = ["http1", "edgerun-protocols/http-compression"]
http = ["dep:edgerun-protocols", "edgerun-protocols/http"]
http1 = ["http"]
http2 = ["http", "edgerun-protocols/http2-server", "dep:edgerun-hpack"]
http3 = ["http", "tls", "edgerun-protocols/http3", "edgerun-protocols/quic"]
tls = [
    "dep:edgerun-protocols",
    "dep:edgerun-crypto",
    "dep:edgerun-encoding",
    "edgerun-protocols/tls",
    "edgerun-protocols/tls-x25519",
    "edgerun-protocols/quic",
    "edgerun-crypto/aead",
    "edgerun-crypto/hmac",
    "edgerun-crypto/p256",
    "edgerun-crypto/rsa",
    "edgerun-crypto/x25519",
]

[dependencies]
edgerun-crypto = { workspace = true, default-features = false, optional = true }
edgerun-encoding = { workspace = true, default-features = false, optional = true }
edgerun-hpack = { version = "0.1", path = "../edgerun-hpack", optional = true }
edgerun-log = { version = "0.1", path = "../edgerun-log" }
edgerun-platform = { version = "0.1", path = "../../edgerun-platform" }
edgerun-protocols = { workspace = true, optional = true }
edgerun-runtime = { version = "0.1", path = "../edgerun-runtime", default-features = false, features = ["std"] }

[lints]
workspace = true
