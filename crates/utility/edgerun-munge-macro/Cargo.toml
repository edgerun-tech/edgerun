[package]
name = "munge_macro"
version = "0.4.7"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned proc macro for custom destructuring"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", features = ["clone-impls", "full", "parsing", "printing", "proc-macro"], default-features = false }

[lints]
workspace = true
