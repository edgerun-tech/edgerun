[package]
name = "serde_derive"
version = "1.0.228"
edition = "2021"
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned derive macros for serde"

[features]
default = []
deserialize_in_place = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.74", features = ["proc-macro"], default-features = false }
quote = { version = "1.0.35", features = ["proc-macro"], default-features = false }
syn = { version = "2.0.81", features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"], default-features = false }

[lints]
workspace = true
