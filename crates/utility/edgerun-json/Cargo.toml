[package]
name = "edgerun-json"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true
description = "A zero-dependency JSON crate with owned, borrowed, tape, and compiled-schema fast paths"
readme = "README.md"
repository = "https://github.com/Sylchi/edgerun-json"
homepage = "https://github.com/Sylchi/edgerun-json"
keywords = ["json", "parser", "serializer", "zero-copy", "tape"]
categories = ["encoding", "parser-implementations"]
rust-version.workspace = true

[features]
default = []
std = ["dep:edgerun-error"]
yaml = []
toml = []
derive = ["dep:edgerun-json-derive"]
serde = ["dep:serde"]
schemars = ["dep:schemars"]
ts-rs = ["dep:ts_rs"]

[dependencies]
edgerun-error = { version = "0.1", path = "../edgerun-error", optional = true, default-features = false, features = ["std"] }
edgerun-json-derive = { version = "0.1", path = "../edgerun-json-derive", optional = true }
serde = { package = "edgerun-serde", version = "0.1", path = "../edgerun-serde", optional = true, default-features = false, features = ["alloc"] }
schemars = { package = "edgerun-schemars", version = "0.1", path = "../edgerun-schemars", optional = true }
ts_rs = { package = "edgerun-ts-rs", version = "0.1", path = "../edgerun-ts-rs", optional = true }

[[test]]
name = "derive"
path = "tests/derive.rs"
required-features = ["derive"]

[lints]
workspace = true
