[package]
name = "futures-channel"
version = "0.3.32"
edition = "2018"
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned futures channels compatibility crate"

[features]
alloc = ["futures-core/alloc"]
cfg-target-has-atomic = []
default = ["std"]
sink = ["dep:futures-sink"]
std = ["alloc", "futures-core/std"]
unstable = []

[dependencies]
futures-core = { path = "../edgerun-futures-core", default-features = false }
futures-sink = { path = "../edgerun-futures-sink", optional = true, default-features = false }

[lints]
workspace = true
