[package]
name = "edgerun-tokio-tungstenite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun compatibility surface for tokio-tungstenite-style APIs"

[features]
default = ["connect", "handshake", "proxy", "rustls-tls-native-roots", "stream"]
connect = ["stream", "tokio-tungstenite/connect"]
handshake = ["tokio-tungstenite/handshake"]
proxy = ["tokio-tungstenite/proxy"]
rustls-tls-native-roots = ["stream", "tokio-tungstenite/rustls-tls-native-roots"]
stream = ["tokio-tungstenite/stream"]

[dependencies]
edgerun-tungstenite = { version = "0.1", path = "../edgerun-tungstenite", features = ["deflate"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1.3.1"
rustls = { version = "0.23", default-features = false }
tokio = { version = "1", default-features = false, features = ["net"] }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6", default-features = false }

[lints]
workspace = true
