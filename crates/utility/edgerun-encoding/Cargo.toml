[package]
name = "edgerun-encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Consolidated encoding utilities for the edgerun workspace"

[features]
default = []
std = []
hpack = ["dep:edgerun-hpack"]
text-encoding = ["dep:chardetng", "dep:encoding_rs"]

[dependencies]
chardetng = { version = "0.1.17", optional = true }
edgerun-hpack = { version = "0.1", path = "../edgerun-hpack", optional = true }
encoding_rs = { version = "0.8.35", optional = true }

[lints]
workspace = true
