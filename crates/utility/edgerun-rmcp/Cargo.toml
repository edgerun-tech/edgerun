[package]
name = "edgerun-rmcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun-owned RMCP model compatibility surface"

[features]
default = ["base64", "schemars"]
base64 = []
macros = []
schemars = ["dep:schemars"]
server = ["schemars"]

[dependencies]
chrono = { path = "../../../vendor/cargo/chrono-0.4.43", default-features = false, features = ["clock", "serde", "std"] }
edgerun-encoding = { version = "0.1", path = "../edgerun-encoding" }
edgerun-json = { version = "0.1", path = "../edgerun-json", features = ["serde-compat"] }
serde = { package = "edgerun-serde", version = "0.1", path = "../edgerun-serde", features = ["derive", "rc"] }
pastey = { path = "../../../vendor/cargo/pastey" }
schemars = { package = "edgerun-schemars", path = "../edgerun-schemars", features = ["chrono04"], optional = true }

[lints]
workspace = true
