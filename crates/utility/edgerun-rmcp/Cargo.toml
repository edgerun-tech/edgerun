[package]
name = "edgerun-rmcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned MCP model surface used by Codex"

[lib]
name = "rmcp"
path = "src/lib.rs"

[features]
default = []
base64 = []
macros = []
client = []
server = []
transport-child-process = []
transport-io = []
transport-streamable-http-client = []

[dependencies]
edgerun-json = { version = "0.1", path = "../edgerun-json", default-features = false, features = ["serde"] }
serde = { package = "edgerun-serde", version = "0.1", path = "../edgerun-serde", features = ["derive", "rc", "std"] }

[lints]
workspace = true
