[workspace]

[package]
name = "edgerun-form-urlencoded"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Edgerun-owned form_urlencoded crate: parser/serializer for application/x-www-form-urlencoded"

[lib]
path = "src/lib.rs"

[features]
default = ["alloc"]
alloc = []

[dependencies]
edgerun-percent-encoding = { path = "../edgerun-percent-encoding", features = ["alloc"] }
