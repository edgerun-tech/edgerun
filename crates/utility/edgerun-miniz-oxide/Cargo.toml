[package]
name = "miniz_oxide"
version = "0.8.9"
edition = "2021"
license = "MIT OR Zlib OR Apache-2.0"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned DEFLATE compression compatibility crate"

[features]
block-boundary = []
default = ["with-alloc"]
rustc-dep-of-std = ["adler2/rustc-dep-of-std"]
serde = ["dep:serde"]
std = []
with-alloc = []

[dependencies]
adler2 = { path = "../edgerun-adler2", default-features = false }
serde = { path = "../edgerun-serde-upstream", optional = true, features = ["derive"] }

[lints]
workspace = true
