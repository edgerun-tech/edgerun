[package]
name = "syn"
version = "2.0.117"
edition = "2021"
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned Rust source parser"

[features]
clone-impls = []
default = ["derive", "parsing", "printing", "clone-impls", "proc-macro"]
derive = []
extra-traits = []
fold = []
full = []
parsing = []
printing = ["dep:quote"]
proc-macro = ["proc-macro2/proc-macro", "quote?/proc-macro"]
test = []
visit = []
visit-mut = []

[dependencies]
proc-macro2 = { workspace = true, default-features = false }
quote = { workspace = true, default-features = false, optional = true }
unicode-ident = { path = "../edgerun-unicode-ident" }

[lints]
workspace = true
