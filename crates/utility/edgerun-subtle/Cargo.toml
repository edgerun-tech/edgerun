[package]
name = "edgerun-subtle"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Sylchi/edgerun_reference_core"
homepage = "https://github.com/Sylchi/edgerun_reference_core"
description = "Edgerun-owned no_std constant-time choice and comparison primitives"

[features]
default = []
std = []
i128 = []
const-generics = []
core_hint_black_box = []

[lints.rust]
dead_code = "allow"
missing_docs = "allow"
unexpected_cfgs = "allow"
