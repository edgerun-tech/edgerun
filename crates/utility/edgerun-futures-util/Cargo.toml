[package]
name = "futures-util"
version = "0.3.32"
edition = "2018"
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned futures utilities compatibility crate"

[features]
alloc = ["futures-core/alloc", "futures-task/alloc", "dep:slab"]
async-await = []
async-await-macro = ["async-await", "dep:futures-macro"]
bilock = []
cfg-target-has-atomic = []
channel = ["std", "dep:futures-channel"]
compat = ["std", "futures_01", "libc"]
default = ["std", "async-await", "async-await-macro"]
futures-io = []
futures_01 = []
io = ["std", "futures-io", "memchr"]
io-compat = ["io", "compat", "tokio-io", "libc"]
libc = []
memchr = []
portable-atomic = ["futures-core/portable-atomic"]
sink = ["dep:futures-sink"]
std = ["alloc", "futures-core/std", "futures-task/std", "slab/std"]
tokio-io = []
unstable = ["futures-core/unstable", "futures-task/unstable"]
write-all-vectored = ["io"]

[dependencies]
futures-channel = { path = "../edgerun-futures-channel", optional = true, default-features = false, features = ["std"] }
futures-core = { path = "../edgerun-futures-core", default-features = false }
futures-macro = { path = "../edgerun-futures-macro", optional = true, default-features = false }
futures-sink = { path = "../edgerun-futures-sink", optional = true, default-features = false }
futures-task = { path = "../edgerun-futures-task", default-features = false }
pin-project-lite = { path = "../edgerun-pin-project-lite" }
slab = { path = "../edgerun-slab", optional = true, default-features = false }

[lints]
workspace = true
