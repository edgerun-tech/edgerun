[package]
name = "rkyv_derive"
version = "0.8.16"
edition = "2021"
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned derive macro for rkyv"

[features]
default = []
bytecheck = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1", features = ["proc-macro"], default-features = false }
quote = { version = "1", features = ["proc-macro"], default-features = false }
syn = { version = "2.0.73", features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"], default-features = false }

[lints]
workspace = true
