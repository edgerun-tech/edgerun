[package]
name = "futures-executor"
version = "0.3.32"
edition = "2018"
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned futures executor compatibility crate"

[features]
default = ["std"]
std = ["futures-core/std", "futures-task/std", "futures-util/std"]
thread-pool = ["std"]

[dependencies]
futures-core = { path = "../edgerun-futures-core", default-features = false }
futures-task = { path = "../edgerun-futures-task", default-features = false }
futures-util = { path = "../edgerun-futures-util", default-features = false }

[lints]
workspace = true
