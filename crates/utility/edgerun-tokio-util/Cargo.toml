[package]
name = "edgerun-tokio-util"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun-owned Tokio-util-compatible async utility facade"

[features]
default = ["edgerun-runtime"]
compat = []
edgerun-runtime = ["dep:edgerun-tokio"]
codec = []
compat-util = []
io = []
io-util = []
net = []
rt = []
sync = []
time = []

[dependencies]
edgerun-bytes = { version = "0.1", path = "../edgerun-bytes" }
edgerun-futures = { version = "0.1", path = "../edgerun-futures" }
edgerun-tokio = { version = "0.1", path = "../edgerun-tokio", default-features = false, features = ["edgerun-runtime"], optional = true }

[lints]
workspace = true
