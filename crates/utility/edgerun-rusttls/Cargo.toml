[package]
name = "edgerun-rusttls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun shim for rustls"

[features]
default = []
std = ["pki_types/std", "subtle/std"]

[dependencies]
pki_types = { package = "edgerun-rustls-pki-types", path = "../edgerun-rustls-pki-types", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", path = "../../../vendor/cargo/rustls-webpki", default-features = false, features = ["alloc"] }
subtle = { package = "edgerun-subtle", path = "../edgerun-subtle", default-features = false }
zeroize = { package = "edgerun-zeroize", path = "../edgerun-zeroize", default-features = false }

[lints]
workspace = true
