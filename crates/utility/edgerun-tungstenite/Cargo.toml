[package]
name = "edgerun-tungstenite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun compatibility surface for tungstenite-style WebSocket APIs"

[features]
default = ["deflate", "proxy"]
deflate = ["tungstenite/deflate"]
handshake = ["tungstenite/handshake"]
proxy = ["handshake", "tungstenite/proxy"]
rustls-tls-native-roots = ["handshake", "dep:rustls", "tungstenite/rustls-tls-native-roots"]

[dependencies]
bytes = { package = "edgerun-bytes", version = "0.1", path = "../edgerun-bytes" }
edgerun-encoding = { workspace = true, default-features = false }
edgerun-random = { workspace = true }
http = { package = "edgerun-http", version = "0.1", path = "../edgerun-http" }
rustls = { package = "edgerun-rusttls", path = "../edgerun-rusttls", default-features = false, optional = true }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f", default-features = false }

[lints]
workspace = true
