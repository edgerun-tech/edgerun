[package]
name = "edgerun-tungstenite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun compatibility surface for tungstenite-style WebSocket APIs"

[features]
default = ["deflate", "proxy"]
connect = ["stream", "handshake", "dep:edgerun-tokio"]
deflate = []
handshake = []
proxy = ["handshake"]
stream = ["dep:edgerun-futures"]

[dependencies]
bytes = { package = "edgerun-bytes", version = "0.1", path = "../edgerun-bytes" }
edgerun-crypto = { workspace = true, default-features = false, features = ["sha1"] }
edgerun-encoding = { workspace = true, default-features = false }
edgerun-futures = { workspace = true, optional = true }
edgerun-http = { workspace = true }
edgerun-tokio = { workspace = true, optional = true, features = ["edgerun-runtime", "net"] }

[lints]
workspace = true
