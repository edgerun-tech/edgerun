[package]
name = "ptr_meta_derive"
version = "0.3.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun-owned derive macros for ptr_meta"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1", features = ["proc-macro"], default-features = false }
quote = { version = "1", features = ["proc-macro"], default-features = false }
syn = { version = "2", features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"], default-features = false }

[lints]
workspace = true
