[package]
name = "edgerun-term-native"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "edgerun-term"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.3", default-features = false, features = ["wayland-data-control"] }
anyhow = "1"
dirs = "5.0"
env_logger = "0.11"
log = "0.4"
once_cell = "1.19"
pixels = "0.13"
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
edgerun-term-core = { path = "../edgerun-term-core" }
edgerun-term-ui = { path = "../edgerun-term-ui" }
vte = "0.13"
winit = { version = "0.29", default-features = false, features = [
    "rwh_05",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }

[dev-dependencies]
anyhow = "1"
libc = "0.2"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render_cpu"
harness = false
