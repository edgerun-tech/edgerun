[package]
name = "edgerun-term-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.14", features = ["derive"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
edgerun-term-core = { path = "../edgerun-term-core" }
vte = "0.13"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CanvasRenderingContext2d",
    "ClipboardEvent",
    "CompositionEvent",
    "console",
    "DataTransfer",
    "Document",
    "Element",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    "ResizeObserver",
    "Gpu",
    "GpuAdapter",
    "GpuCanvasContext",
    "GpuCanvasConfiguration",
    "GpuDevice",
    "GpuQueue",
    "GpuTexture",
    "GpuTextureFormat",
    "Node",
    "Window",
    "WebSocket"
] }
wgpu = { version = "0.20", features = ["webgpu"] }
