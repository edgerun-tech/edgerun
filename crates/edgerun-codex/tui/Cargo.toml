[package]
edition.workspace = true
license.workspace = true
name = "codex-tui"
version.workspace = true

[[bin]]
name = "codex-tui"
path = "src/main.rs"

[[bin]]
name = "edgerun-codex"
path = "src/bin/edgerun-codex.rs"

[dependencies]
codex-core = { workspace = true, features = ["native-transport"] }
edgerun-codelyzer = { path = "../../edgerun-codelyzer", default-features = false, features = ["lang-rust", "std", "vfs"] }
edgerun-http = { workspace = true }
edgerun-json = { workspace = true }
edgerun-tokio = { workspace = true, features = ["rt", "sync"] }
edgerun-ui-core = { workspace = true, features = ["sdl", "tabler-svg-atlas"] }
edgerun-vfs = { workspace = true, features = ["std"] }

[lints]
workspace = true
