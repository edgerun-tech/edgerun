[package]
edition.workspace = true
license.workspace = true
name = "codex-tui"
version.workspace = true

[[bin]]
name = "codex-tui"
path = "src/main.rs"

[dependencies]
codex-core = { workspace = true, features = ["native-transport"] }
crossterm = "0.29"
edgerun-http = { workspace = true }
edgerun-json = { workspace = true, features = ["serde-compat"] }
edgerun-tokio = { workspace = true, features = ["rt", "sync"] }
ratatui = "0.29"

[lints]
workspace = true
