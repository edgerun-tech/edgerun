[package]
edition.workspace = true
license.workspace = true
name = "codex-host"
version.workspace = true

[[bin]]
name = "codex-host"
path = "src/main.rs"

[dependencies]
codex-core = { workspace = true, features = ["native-transport"] }
edgerun-crypto = { workspace = true, default-features = false, features = ["ed25519", "x25519", "aead", "hmac"] }
edgerun-http = { workspace = true }
edgerun-json = { workspace = true }
edgerun-tokio = { workspace = true, features = ["rt", "sync"] }
edgerun-work = { workspace = true, features = ["std"] }

[lints]
workspace = true
