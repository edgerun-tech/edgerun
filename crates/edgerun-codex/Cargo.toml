[workspace]
resolver = "2"
members = [
    "api",
    "app-protocol",
    "client",
    "code",
    "core",
    "debug-context",
    "host",
    "model/catalog",
    "model/info",
    "model/provider",
    "patch",
    "protocol",
    "shell",
    "tui",
    "tools",
    "ui-native",
    "ui-web",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints]

[workspace.lints.rust]

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[workspace.dependencies]
codex-api = { path = "api", default-features = false }
codex-app-server-protocol = { path = "app-protocol" }
codex-client = { path = "client", default-features = false }
codex-code-mode = { path = "code" }
codex-core = { path = "core", default-features = false }
codex-model-provider = { path = "model/provider", default-features = false }
codex-model-provider-info = { path = "model/info" }
codex-models-manager = { path = "model/catalog" }
codex-protocol = { path = "protocol" }
codex-apply-patch = { path = "patch" }
codex-response-debug-context = { path = "debug-context" }
codex-shell-command = { path = "shell" }
codex-tools = { path = "tools" }
edgerun-async-channel = { path = "../utility/edgerun-async-channel" }
edgerun-async-trait = { path = "../utility/edgerun-async-trait" }
edgerun-bytes = { path = "../utility/edgerun-bytes" }
edgerun-deno-core-icudata = { path = "../utility/edgerun-deno-core-icudata" }
edgerun-encoding = { path = "../utility/edgerun-encoding", default-features = false }
edgerun-error = { path = "../utility/edgerun-error", features = ["anyhow-compat"] }
edgerun-eventsource-stream = { path = "../utility/edgerun-eventsource-stream" }
edgerun-futures = { path = "../utility/edgerun-futures" }
edgerun-http = { path = "../utility/edgerun-http" }
edgerun-ui-core = { path = "../utility/edgerun-ui-core" }
edgerun-inventory = { path = "../utility/edgerun-inventory" }
edgerun-json = { path = "../utility/edgerun-json", default-features = false, features = ["derive", "schemars", "ts-rs"] }
edgerun-locale = { path = "../utility/edgerun-locale" }
edgerun-random = { path = "../utility/edgerun-random" }
edgerun-reqwest = { path = "../utility/edgerun-reqwest", default-features = false }
serde = { package = "edgerun-serde", path = "../utility/edgerun-serde", features = ["std"] }
edgerun-shlex = { path = "../utility/edgerun-shlex", default-features = false }
edgerun-similar = { path = "../utility/edgerun-similar" }
edgerun-strum = { path = "../utility/edgerun-strum" }
edgerun-strum-macros = { path = "../utility/edgerun-strum-macros" }
edgerun-time = { path = "../utility/edgerun-time", default-features = false, features = ["chrono"] }
edgerun-tokio = { path = "../utility/edgerun-tokio" }
edgerun-tokio-tungstenite = { path = "../utility/edgerun-tokio-tungstenite", default-features = false, features = ["connect", "handshake", "proxy", "stream"] }
edgerun-tokio-util = { path = "../utility/edgerun-tokio-util" }
edgerun-tungstenite = { path = "../utility/edgerun-tungstenite", default-features = false, features = ["deflate", "proxy"] }
edgerun-url = { path = "../utility/edgerun-url", default-features = false }
edgerun-zstd = { path = "../utility/edgerun-zstd" }
landlock = { package = "edgerun-landlock", path = "../utility/edgerun-landlock" }
opentelemetry = { package = "edgerun-opentelemetry", path = "../utility/edgerun-opentelemetry" }
rmcp = { package = "edgerun-rmcp", path = "../utility/edgerun-rmcp", default-features = false }
opentelemetry_sdk = { package = "edgerun-opentelemetry-sdk", path = "../utility/edgerun-opentelemetry-sdk" }
schemars = { package = "edgerun-schemars", path = "../utility/edgerun-schemars" }
seccompiler = { package = "edgerun-seccompiler", path = "../utility/edgerun-seccompiler" }
tracing = { package = "edgerun-log", path = "../utility/edgerun-log", features = ["tracing-compat"] }
tracing-opentelemetry = { package = "edgerun-tracing-opentelemetry", path = "../utility/edgerun-tracing-opentelemetry" }
ts-rs = { package = "edgerun-ts-rs", path = "../utility/edgerun-ts-rs" }

[patch.crates-io]
bytecheck = { path = "../utility/edgerun-bytecheck" }
bytecheck_derive = { path = "../utility/edgerun-bytecheck-derive" }
hashbrown = { path = "../utility/edgerun-hashbrown" }
munge = { path = "../utility/edgerun-munge" }
munge_macro = { path = "../utility/edgerun-munge-macro" }
ptr_meta = { path = "../utility/edgerun-ptr-meta" }
ptr_meta_derive = { path = "../utility/edgerun-ptr-meta-derive" }
rancor = { path = "../utility/edgerun-rancor" }
rend = { path = "../utility/edgerun-rend" }
tinyvec = { path = "../utility/edgerun-tinyvec" }
tinyvec_macros = { path = "../utility/edgerun-tinyvec-macros" }
