[workspace]
resolver = "2"
members = [
    "app-server-protocol",
    "apply-patch",
    "code-mode",
    "codex-api",
    "codex-client",
    "core",
    "model-provider",
    "model-provider-info",
    "models-manager",
    "protocol",
    "response-debug-context",
    "shell-command",
    "tools",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints]

[workspace.lints.rust]

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[workspace.dependencies]
codex-app-server-protocol = { path = "app-server-protocol" }
codex-apply-patch = { path = "apply-patch" }
codex-code-mode = { path = "code-mode" }
codex-api = { path = "codex-api" }
codex-client = { path = "codex-client" }
codex-core = { path = "core" }
codex-model-provider = { path = "model-provider" }
codex-model-provider-info = { path = "model-provider-info" }
codex-models-manager = { path = "models-manager" }
codex-protocol = { path = "protocol" }
codex-response-debug-context = { path = "response-debug-context" }
codex-shell-command = { path = "shell-command" }
codex-tools = { path = "tools" }
edgerun-async-channel = { path = "../utility/edgerun-async-channel" }
edgerun-async-trait = { path = "../utility/edgerun-async-trait" }
edgerun-bytes = { path = "../utility/edgerun-bytes" }
edgerun-clap = { path = "../utility/edgerun-clap", default-features = false, features = ["derive", "std"] }
edgerun-deno-core-icudata = { path = "../utility/edgerun-deno-core-icudata" }
edgerun-encoding = { path = "../utility/edgerun-encoding", default-features = false }
edgerun-error = { path = "../utility/edgerun-error", features = ["anyhow-compat"] }
edgerun-eventsource-stream = { path = "../utility/edgerun-eventsource-stream" }
edgerun-glob = { path = "../utility/edgerun-glob", default-features = false }
edgerun-http = { path = "../utility/edgerun-http" }
edgerun-inventory = { path = "../utility/edgerun-inventory" }
edgerun-json = { path = "../utility/edgerun-json", default-features = false, features = ["derive"] }
edgerun-locale = { path = "../utility/edgerun-locale" }
edgerun-quick-xml = { path = "../utility/edgerun-quick-xml" }
edgerun-random = { path = "../utility/edgerun-random" }
edgerun-shlex = { path = "../utility/edgerun-shlex", default-features = false }
edgerun-similar = { path = "../utility/edgerun-similar" }
edgerun-time = { path = "../utility/edgerun-time", default-features = false, features = ["chrono"] }
edgerun-tokio-tungstenite = { path = "../utility/edgerun-tokio-tungstenite", features = ["proxy", "rustls-tls-native-roots"] }
edgerun-tungstenite = { path = "../utility/edgerun-tungstenite", features = ["deflate", "proxy"] }
edgerun-url = { path = "../utility/edgerun-url", default-features = false }
edgerun-uuid = { path = "../utility/edgerun-uuid", features = ["serde", "v4", "v7"] }
edgerun-zstd = { path = "../utility/edgerun-zstd" }
futures = { version = "0.3", default-features = false }
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
landlock = "0.4.4"
opentelemetry = "0.31.0"
reqwest = { version = "0.12", features = ["cookies"] }
rmcp = { version = "0.15.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.3"
rustls-pki-types = "1.14.0"
schemars = "0.8.22"
seccompiler = "0.5.0"
serde = "1"
serde_with = "3.17"
strum = "0.27.2"
strum_macros = "0.28.0"
tokio = "1"
tokio-util = "0.7.18"
tracing = { package = "edgerun-log", path = "../utility/edgerun-log", features = ["tracing-compat"] }
tracing-opentelemetry = "0.32.0"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
ts-rs = "11"
v8 = "=146.4.0"
