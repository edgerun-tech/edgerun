[package]
edition.workspace = true
autobins = false
autotests = false
license.workspace = true
name = "codex-core"
version.workspace = true

[lib]
name = "codex_core"
path = "src/stub_lib.rs"

[[example]]
name = "live_smoke"
path = "examples/live_smoke.rs"
required-features = ["native-transport"]

[features]
default = ["native-transport"]
model-provider = [
    "dep:codex-model-provider",
    "dep:codex-model-provider-info",
    "dep:codex-models-manager",
]
native-transport = [
    "codex-client/reqwest-transport",
]

[lints]
workspace = true

[dependencies]
codex-api = { workspace = true, default-features = false }
codex-apply-patch = { workspace = true }
codex-client = { workspace = true, default-features = false }
codex-model-provider = { workspace = true, default-features = false, optional = true }
codex-model-provider-info = { workspace = true, optional = true }
codex-models-manager = { workspace = true, optional = true }
codex-protocol = { workspace = true }
codex-shell-command = { workspace = true }
codex-tools = { path = "../tools", default-features = false }
edgerun-json = { workspace = true }
edgerun-http = { workspace = true }
edgerun-crypto = { workspace = true, default-features = false }

[dev-dependencies]
edgerun-async-trait = { workspace = true }
edgerun-bytes = { workspace = true }
edgerun-futures = { workspace = true }
edgerun-http = { workspace = true }
edgerun-tokio = { workspace = true, features = ["rt", "sync"] }
