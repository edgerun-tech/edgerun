[package]
edition.workspace = true
autobins = false
license.workspace = true
name = "codex-core"
version.workspace = true

[lib]
name = "codex_core"
path = "src/stub_lib.rs"

[features]
default = ["native-transport"]
native-transport = [
    "codex-api/native-transport",
    "codex-model-provider/native-transport",
]

[lints]
workspace = true

[dependencies]
codex-api = { workspace = true, default-features = false }
codex-apply-patch = { workspace = true }
codex-model-provider = { workspace = true, default-features = false }
codex-model-provider-info = { workspace = true }
codex-models-manager = { workspace = true }
codex-protocol = { workspace = true }
codex-shell-command = { workspace = true }
codex-tools = { workspace = true }
edgerun-json = { workspace = true, features = ["serde-compat"] }
