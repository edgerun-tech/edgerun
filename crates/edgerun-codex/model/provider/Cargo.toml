[package]
edition.workspace = true
license.workspace = true
name = "codex-model-provider"
version.workspace = true

[lib]
doctest = false
name = "codex_model_provider"
path = "src/lib.rs"

[features]
default = ["native-transport"]
native-transport = [
    "codex-api/native-transport",
    "codex-client/native-transport",
]

[lints]
workspace = true

[dependencies]
edgerun-async-trait = { workspace = true }
codex-api = { workspace = true, default-features = false }
codex-client = { workspace = true, default-features = false }
codex-model-provider-info = { workspace = true }
codex-models-manager = { workspace = true }
codex-protocol = { workspace = true }
codex-response-debug-context = { workspace = true }
edgerun-http = { workspace = true }
edgerun-json = { workspace = true }
edgerun-tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
