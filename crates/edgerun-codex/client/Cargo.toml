[package]
autobins = false
edition.workspace = true
license.workspace = true
name = "codex-client"
version.workspace = true

[[bin]]
name = "custom_ca_probe"
path = "src/bin/custom_ca_probe.rs"
required-features = ["native-transport"]

[features]
default = ["native-transport"]
reqwest-transport = [
    "dep:edgerun-reqwest",
    "edgerun-reqwest/cookies",
    "edgerun-reqwest/http1",
    "edgerun-reqwest/http2",
    "edgerun-reqwest/http3",
    "edgerun-reqwest/native-root",
    "edgerun-reqwest/rustls-tls-native-roots",
    "edgerun-reqwest/stream",
]
native-transport = [
    "reqwest-transport",
]

[dependencies]
edgerun-async-trait = { workspace = true }
edgerun-bytes = { workspace = true }
edgerun-encoding = { workspace = true }
edgerun-error = { workspace = true }
edgerun-eventsource-stream = { workspace = true }
edgerun-http = { workspace = true }
edgerun-json = { workspace = true }
edgerun-random = { workspace = true }
edgerun-futures = { workspace = true }
edgerun-reqwest = { workspace = true, default-features = false, optional = true }
edgerun-tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tracing = { workspace = true }

[lints]
workspace = true
