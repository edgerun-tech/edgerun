[package]
name = "codex-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
edgerun-async-channel = { workspace = true }
edgerun-async-trait = { workspace = true }
codex-client = { workspace = true }
codex-protocol = { workspace = true }
edgerun-bytes = { workspace = true }
edgerun-encoding = { workspace = true }
edgerun-error = { workspace = true }
edgerun-eventsource-stream = { workspace = true }
edgerun-http = { workspace = true }
edgerun-json = { workspace = true, features = ["serde-compat"] }
edgerun-tokio-tungstenite = { workspace = true }
edgerun-tungstenite = { workspace = true }
edgerun-time = { workspace = true }
edgerun-url = { workspace = true }
edgerun-futures = { workspace = true }
edgerun-reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
edgerun-tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
edgerun-tokio-util = { workspace = true, features = ["codec", "io"] }
