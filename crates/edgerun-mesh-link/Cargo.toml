[package]
name = "edgerun-mesh-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Mesh link discovery and transport helpers for Edgerun"

[dependencies]
edgerun-mesh = { version = "0.1", path = "../edgerun-mesh" }
edgerun-hardware-signing = { version = "0.1", path = "../edgerun-hardware-signing" }

[target.'cfg(target_os = "linux")'.dependencies]
edgerun-network-interface = { version = "0.1", path = "../edgerun-network-interface" }

[dev-dependencies]
edgerun-core = { version = "0.1", path = "../edgerun-core" }
edgerun-crypto = { workspace = true, default-features = false, features = ["p256"] }
edgerun-mesh = { version = "0.1", path = "../edgerun-mesh" }

[lints]
workspace = true
