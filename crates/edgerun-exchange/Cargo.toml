[package]
name = "edgerun-exchange"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EdgeRun Exchange — provider adapters and routing"

[dependencies]
edgerun-protocols = { version = "0.1", path = "../protocol/edgerun-protocols", default-features = false, features = ["core", "wire"] }
edgerun-wallet = { version = "0.1", path = "../edgerun-wallet" }
edgerun-node = { version = "0.1", path = "../node/edgerun-node", default-features = false, features = ["client"], optional = true }
edgerun-json = { version = "0.1", path = "../utility/edgerun-json" }
edgerun-crypto = { version = "0.1", path = "../utility/edgerun-crypto", default-features = false }
edgerun-log = { version = "0.1", path = "../utility/edgerun-log" }

[dev-dependencies]

[[test]]
name = "integration"
required-features = ["provider-http"]

[features]
provider-http = ["dep:edgerun-node"]
ffio = ["provider-http"]

[lints]
workspace = true
