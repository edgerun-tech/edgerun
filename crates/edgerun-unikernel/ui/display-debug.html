<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edgerun Panel Debug</title>
  <link rel="stylesheet" href="./display-debug.css">
</head>
<body>
  <main class="panel">
    <section class="header">
      <div class="title">EDGERUN JC3248W535</div>
      <div class="subtitle">RGB565 / TOUCH / TEXT</div>
    </section>
    <section class="bars" aria-label="color bars">
      <div class="bar white"></div>
      <div class="bar red"></div>
      <div class="bar green"></div>
      <div class="bar blue"></div>
      <div class="bar cyan"></div>
      <div class="bar magenta"></div>
      <div class="bar yellow"></div>
      <div class="bar black"></div>
    </section>
    <section class="ramps">
      <div class="ramp gray"><span>GRAY</span></div>
      <div class="ramp red"><span>RED</span></div>
      <div class="ramp green"><span>GREEN</span></div>
      <div class="ramp blue"><span>BLUE</span></div>
    </section>
    <section class="grid">
      <div class="box warm">A1</div>
      <div class="box cool">B2</div>
      <div class="box dark">C3</div>
      <div class="box light">D4</div>
    </section>
    <section class="footer">
      <div>0,0</div>
      <div>160,240</div>
      <div>319,479</div>
    </section>
  </main>
</body>
</html>
