[package]
name = "edgerun-unikernel"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Edgerun unikernel - bare-metal bootable"
build = "build.rs"

[features]
default = []
html-ui = []
esp32s3-ble = ["edgerun-platform/esp32s3-ble"]
esp32s3-ble-blob = ["edgerun-platform/esp32s3-ble-blob", "esp32s3-ble"]
esp32s3-ble-stub = ["edgerun-platform/esp32s3-ble-stub", "esp32s3-ble"]
esp32s3-headless = []
esp32s3-wifi-mmio = ["edgerun-platform/esp32s3-wifi-mmio", "dep:edgerun-wifi"]
esp32s3-wifi-blob = ["edgerun-platform/esp32s3-wifi-blob", "dep:edgerun-wifi"]
esp32s3-wifi-phy-probe = ["esp32s3-wifi-blob", "edgerun-platform/esp32s3-wifi-phy-probe"]
esp32s3-wifi-ram-phy-patch = ["esp32s3-wifi-blob", "edgerun-platform/esp32s3-wifi-ram-phy-patch"]

[dependencies]
edgerun-platform = { version = "0.1", path = "../edgerun-platform" }
edgerun-rt = { version = "0.1", path = "../edgerun-rt" }
edgerun-dhcp = { version = "0.1", path = "../edgerun-dhcp" }
edgerun-http = { version = "0.1", path = "../edgerun-http", default-features = false, features = ["client"] }
edgerun-tftp = { version = "0.1", path = "../edgerun-tftp" }
edgerun-tpm = { version = "0.1", path = "../identity/edgerun-tpm", default-features = false }
edgerun-crypto = { version = "0.1", path = "../utility/edgerun-crypto", default-features = false }
edgerun-oci = { version = "0.1", path = "../edgerun-oci", default-features = false, features = ["registry-client", "edgefs"] }
edgerun-edgefs = { version = "0.1", path = "../authority/edgerun-edgefs" }
edgerun-storage = { version = "0.1", path = "../authority/edgerun-storage" }
edgerun-capabilities = { version = "0.1", path = "../capability/edgerun-capabilities" }
edgerun-display = { version = "0.1", path = "../edgerun-display" }
edgerun-input = { version = "0.1", path = "../edgerun-input" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
edgerun-virtio = { version = "0.1", path = "../edgerun-virtio" }
edgerun-rtl8125 = { version = "0.1", path = "../edgerun-rtl8125" }
edgerun-event = { version = "0.1", path = "../edgerun-event", features = ["virtio"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
edgerun-wifi = { version = "0.1", path = "../edgerun-wifi", optional = true }

[lints]
workspace = true
