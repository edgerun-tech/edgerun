[package]
name = "edgerun-unikernel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/edgerun-tech/edgerun"
homepage = "https://github.com/edgerun-tech/edgerun"
description = "Edgerun unikernel - bare-metal bootable"
build = "build.rs"

[features]
default = []
html-ui = []
event-virtio = ["dep:edgerun-virtio"]
runtime = [
  "dep:edgerun-node",
  "dep:edgerun-protocols",
  "dep:edgerun-tpm",
  "edgerun-protocols/dhcp",
  "edgerun-protocols/ethernet-ipv4",
  "edgerun-protocols/tftp",
  "edgerun-protocols/wifi",
]
x86-runtime = ["runtime", "event-virtio"]
esp32s3-ble = ["edgerun-platform/esp32s3-ble"]
esp32s3-ble-blob = ["edgerun-platform/esp32s3-ble-blob", "esp32s3-ble"]
esp32s3-ble-stub = ["edgerun-platform/esp32s3-ble-stub", "esp32s3-ble"]
esp32s3-headless = []
esp32s3-wifi-mmio = ["edgerun-platform/esp32s3-wifi-mmio"]
esp32s3-wifi-blob = ["edgerun-platform/esp32s3-wifi-blob"]
esp32s3-wifi-phy-probe = ["esp32s3-wifi-blob", "edgerun-platform/esp32s3-wifi-phy-probe"]
esp32s3-wifi-ram-phy-patch = ["esp32s3-wifi-blob", "edgerun-platform/esp32s3-wifi-ram-phy-patch"]

[dependencies]
edgerun-platform = { version = "0.1", path = "../edgerun-platform" }
edgerun-node = { version = "0.1", path = "../node/edgerun-node", default-features = false, features = ["http"], optional = true }
edgerun-protocols = { workspace = true, default-features = false, optional = true }
edgerun-tpm = { version = "0.1", path = "../identity/edgerun-tpm", default-features = false, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
edgerun-virtio = { workspace = true, optional = true }

[target.'cfg(target_arch = "xtensa")'.dependencies]

[package.metadata.cargo-machete]
ignored = [
  "edgerun-node",
  "edgerun-platform",
  "edgerun-protocols",
  "edgerun-tpm",
]

[workspace]

[profile.release]
lto = true
