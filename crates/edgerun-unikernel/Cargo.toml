[package]
name = "edgerun-unikernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Edgerun unikernel - bare-metal bootable"
build = "build.rs"

[features]
default = []

[dependencies]
edgerun-virtio = { path = "../edgerun-virtio" }
edgerun-platform = { path = "../edgerun-platform" }
edgerun-bare-rt = { path = "../edgerun-bare-rt" }
edgerun-dhcp = { path = "../edgerun-dhcp" }
edgerun-tftp = { path = "../edgerun-tftp" }
getrandom = { version = "0.2", features = ["rdrand"] }
