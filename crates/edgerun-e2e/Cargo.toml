[package]
name = "edgerun-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "End-to-end Edgerun protocol and node integration flows"

[dependencies]
edgerun-core = { version = "0.1", path = "../edgerun-core" }
edgerun-hardware-signing = { version = "0.1", path = "../edgerun-hardware-signing" }
edgerun-storage = { version = "0.1", path = "../edgerun-storage" }
edgerun-capabilities = { version = "0.1", path = "../edgerun-capabilities" }
edgerun-remote-capability = { version = "0.1", path = "../edgerun-remote-capability" }
edgerun-mesh = { version = "0.1", path = "../edgerun-mesh" }
edgerun-mesh-link = { version = "0.1", path = "../edgerun-mesh-link" }
edgerun-mesh-session = { version = "0.1", path = "../edgerun-mesh-session" }
edgerun-crypto = { workspace = true, default-features = false, features = ["p256"] }

[features]
default = []
std = ["dep:edgerun-oci", "edgerun-oci/std"]

[target.'cfg(not(target_os = "none"))'.dependencies]
edgerun-oci = { version = "0.1", path = "../edgerun-oci", optional = true }

[dev-dependencies]

[lints]
workspace = true
