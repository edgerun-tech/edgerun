[package]
name = "edgerun-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "edgerund"
path = "src/main.rs"

[features]
default = ["all-hardware"]
hardware = [
    "dep:edgerun-evdev-input",
    "dep:edgerun-alsa-speaker",
    "dep:edgerun-alsa-microphone",
    "dep:edgerun-microphone",
    "dep:edgerun-v4l2-camera",
    "dep:edgerun-camera-biometrics",
    "dep:edgerun-speaker",
    "dep:edgerun-audio-liveliness",
]
all-hardware = [
    "hardware",
    # GPU / display
    "dep:edgerun-gpu",
    "dep:edgerun-linux-gpu",
    "dep:edgerun-display",
    "dep:edgerun-drm-display",
    # Input / biometrics
    "dep:edgerun-fingerprint",
    "dep:edgerun-goodix-fingerprint",
    "dep:edgerun-audio-calibration",
    "dep:edgerun-biometrics",
    # Connectivity
    "dep:edgerun-bluetooth",
    "dep:edgerun-mgmt-bluetooth",
    "dep:edgerun-wifi",
    "dep:edgerun-linux-wifi",
    "dep:edgerun-usb",
    "dep:edgerun-linux-usb",
    "dep:edgerun-pci",
    "dep:edgerun-linux-pci",
    "dep:edgerun-nfc",
    "dep:edgerun-linux-nfc",
    "dep:edgerun-npu",
    "dep:edgerun-linux-npu",
    "dep:edgerun-power",
    "dep:edgerun-linux-power",
    "dep:edgerun-cec",
    "dep:edgerun-linux-cec",
    "dep:edgerun-amd-xdna",
    # Mesh extras
    "dep:edgerun-mesh-session",
    "dep:edgerun-mesh-daemon",
    "dep:edgerun-mesh-capability",
    # Storage
    "dep:edgerun-virtual-disk",
    # Misc
    "dep:edgerun-json",
    "dep:edgerun-machine-report",
    "dep:edgerun-rand_core",
]

[dependencies]
edgerun-core = { path = "../edgerun-core" }
edgerun-proto = { path = "../edgerun-proto" }
edgerun-capabilities = { path = "../edgerun-capabilities" }
edgerun-capability-policy = { path = "../edgerun-capability-policy" }
edgerun-stream = { path = "../edgerun-stream" }
edgerun-storage = { path = "../edgerun-storage" }
edgerun-remote-capability = { path = "../edgerun-remote-capability" }
edgerun-mesh = { path = "../edgerun-mesh" }
edgerun-mesh-link = { path = "../edgerun-mesh-link" }
edgerun-mesh-router = { path = "../edgerun-mesh-router" }
edgerun-linux-netif = { path = "../edgerun-linux-netif" }
edgerun-network-interface = { path = "../edgerun-network-interface" }
p256.workspace = true
prost.workspace = true
prost-types.workspace = true
edgerun-rt = { path = "../edgerun-rt" }

edgerun-log = { path = "../edgerun-log" }
libc = { path = "../libc" }

# Hardware signing is required for node identity and stream writing
edgerun-hardware-signing = { path = "../edgerun-hardware-signing" }
edgerun-tpm = { path = "../edgerun-tpm" }
edgerun-yubikey = { path = "../edgerun-yubikey" }

# Optional hardware backends (enable with --features hardware)
edgerun-evdev-input = { path = "../edgerun-evdev-input", optional = true }
edgerun-alsa-speaker = { path = "../edgerun-alsa-speaker", optional = true }
edgerun-alsa-microphone = { path = "../edgerun-alsa-microphone", optional = true }
edgerun-microphone = { path = "../edgerun-microphone", optional = true }
edgerun-v4l2-camera = { path = "../edgerun-v4l2-camera", optional = true }
edgerun-camera-biometrics = { path = "../edgerun-camera-biometrics", optional = true }
edgerun-speaker = { path = "../edgerun-speaker", optional = true }
edgerun-audio-liveliness = { path = "../edgerun-audio-liveliness", optional = true }

# GPU / display
edgerun-gpu = { path = "../edgerun-gpu", optional = true }
edgerun-linux-gpu = { path = "../edgerun-linux-gpu", optional = true }
edgerun-display = { path = "../edgerun-display", optional = true }
edgerun-drm-display = { path = "../edgerun-drm-display", optional = true }

# Input / biometrics
edgerun-fingerprint = { path = "../edgerun-fingerprint", optional = true }
edgerun-goodix-fingerprint = { path = "../edgerun-goodix-fingerprint", optional = true }
edgerun-audio-calibration = { path = "../edgerun-audio-calibration", optional = true }
edgerun-biometrics = { path = "../edgerun-biometrics", optional = true }

# Connectivity
edgerun-bluetooth = { path = "../edgerun-bluetooth", optional = true }
edgerun-mgmt-bluetooth = { path = "../edgerun-mgmt-bluetooth", optional = true }
edgerun-wifi = { path = "../edgerun-wifi", optional = true }
edgerun-linux-wifi = { path = "../edgerun-linux-wifi", optional = true }
edgerun-usb = { path = "../edgerun-usb", optional = true }
edgerun-linux-usb = { path = "../edgerun-linux-usb", optional = true }
edgerun-pci = { path = "../edgerun-pci", optional = true }
edgerun-linux-pci = { path = "../edgerun-linux-pci", optional = true }
edgerun-nfc = { path = "../edgerun-nfc", optional = true }
edgerun-linux-nfc = { path = "../edgerun-linux-nfc", optional = true }
edgerun-npu = { path = "../edgerun-npu", optional = true }
edgerun-linux-npu = { path = "../edgerun-linux-npu", optional = true }
edgerun-power = { path = "../edgerun-power", optional = true }
edgerun-linux-power = { path = "../edgerun-linux-power", optional = true }
edgerun-cec = { path = "../edgerun-cec", optional = true }
edgerun-linux-cec = { path = "../edgerun-linux-cec", optional = true }
edgerun-amd-xdna = { path = "../edgerun-amd-xdna", optional = true }

# Mesh extras
edgerun-mesh-session = { path = "../edgerun-mesh-session", optional = true }
edgerun-mesh-daemon = { path = "../edgerun-mesh-daemon", optional = true }
edgerun-mesh-capability = { path = "../edgerun-mesh-capability", optional = true }

# Storage
edgerun-virtual-disk = { path = "../edgerun-virtual-disk", optional = true }

# Misc
edgerun-json = { path = "../edgerun-json", optional = true }
edgerun-machine-report = { path = "../edgerun-machine-report", optional = true }
edgerun-rand_core = { path = "../edgerun-rand_core", optional = true, package = "rand_core" }

# OCI container runtime (required for ExecuteWorkload)
edgerun-oci-registry = { path = "../edgerun-oci-registry" }
edgerun-oci-runtime = { path = "../edgerun-oci-runtime" }

[dev-dependencies]
edgerun-hardware-signing = { path = "../edgerun-hardware-signing" }
edgerun-alsa-microphone = { path = "../edgerun-alsa-microphone" }
