[package]
name = "edgerun-android-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Android NDK hardware capability providers for edgerun nodes"

[dependencies]
edgerun-capabilities = { path = "../edgerun-capabilities" }
edgerun-biometrics = { path = "../edgerun-biometrics" }
edgerun-input = { path = "../edgerun-input" }

[target.'cfg(not(target_os = "none"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
once_cell = { version = "1", optional = true }

[dev-dependencies]
edgerun-android-keystore = { path = "../edgerun-android-keystore" }

[features]
default = []
# Enable all NDK-backed providers + logcat logging
android-real = [
    "dep:once_cell",
]

[lints]
workspace = true
