[package]
name = "edgerun-android-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Android NDK hardware capability providers for edgerun nodes"

[dependencies]
edgerun-capabilities = { version = "0.1", path = "../edgerun-capabilities" }
edgerun-biometrics = { version = "0.1", path = "../edgerun-biometrics" }
edgerun-input = { version = "0.1", path = "../edgerun-input" }

[target.'cfg(target_os = "android")'.dependencies]
once_cell = { version = "1", optional = true }

[dev-dependencies]
edgerun-android-keystore = { version = "0.1", path = "../edgerun-android-keystore" }

[features]
default = []
# Enable all NDK-backed providers + logcat logging
android-real = [
    "dep:once_cell",
]

[lints]
workspace = true
