[package]
name = "edgerun-linux-wifi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
edgerun-capabilities = { path = "../edgerun-capabilities" }
edgerun-linux-netif = { path = "../edgerun-linux-netif" }
edgerun-linux-sysfs = { path = "../edgerun-linux-sysfs" }
edgerun-network-interface = { path = "../edgerun-network-interface" }
edgerun-wifi = { path = "../edgerun-wifi" }
edgerun-encoding = { path = "../edgerun-encoding" }
edgerun-crypto = { workspace = true, default-features = false, features = ["hmac", "pbkdf2", "sha1"] }
edgerun-log = { path = "../edgerun-log" }

[target.'cfg(not(target_os = "none"))'.dependencies]
libc.workspace = true

[features]
std = []

[[bin]]
name = "linux_wifi_tool"
path = "src/bin/linux-wifi-tool.rs"
required-features = ["std"]

[lints]
workspace = true
