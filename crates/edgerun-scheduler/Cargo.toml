[package]
name = "edgerun-scheduler"
version = "0.1.0"
edition = "2021"

[dependencies]
edgerun-solana = { path = "../edgerun-solana" }
edgerun-config = { path = "../edgerun-config" }
edgerun-mesh = { path = "../edgerun-mesh" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-error = { path = "../edgerun-error" }
edgerun-json = { path = "../edgerun-json", features = ["serde"] }
serde = { version = "1", features = ["derive"] }