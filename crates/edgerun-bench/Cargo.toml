[package]
name = "edgerun-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Benchmark harnesses for Edgerun signing and mesh paths"

[dependencies]
edgerun-core.workspace = true
edgerun-encoding = { path = "../edgerun-encoding" }
edgerun-mesh = { path = "../edgerun-mesh" }
edgerun-tpm = { path = "../edgerun-tpm" }
edgerun-hardware-signing = { path = "../edgerun-hardware-signing", features = ["tpm"] }
edgerun-yubikey = { path = "../edgerun-yubikey" }
edgerun-crypto = { workspace = true, default-features = false, features = ["p256"] }

[[bin]]
name = "edgerun-bench"
path = "src/main.rs"
required-features = ["std"]

[features]
std = []

[lints]
workspace = true
