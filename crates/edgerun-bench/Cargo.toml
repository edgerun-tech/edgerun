[package]
name = "edgerun-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmark harnesses for Edgerun signing and mesh paths"

[dependencies]
edgerun-protocols = { workspace = true, default-features = false, features = ["core"] }
edgerun-encoding = { version = "0.1", path = "../utility/edgerun-encoding" }
edgerun-mesh = { version = "0.1", path = "../mesh/edgerun-mesh" }
edgerun-tpm = { version = "0.1", path = "../identity/edgerun-tpm" }
edgerun-hardware-signing = { version = "0.1", path = "../identity/edgerun-hardware-signing", features = ["tpm"] }
edgerun-yubikey = { version = "0.1", path = "../identity/edgerun-yubikey" }
edgerun-crypto = { workspace = true, default-features = false, features = ["p256"] }

[[bin]]
name = "edgerun-bench"
path = "src/main.rs"
required-features = ["std"]

[features]
std = []

[lints]
workspace = true
