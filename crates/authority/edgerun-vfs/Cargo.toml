[package]
name = "edgerun-vfs"
version.workspace = true
edition.workspace = true
description = "In-memory virtual filesystem with git-aware write-back for transparent RAM acceleration"
license = "MIT OR Apache-2.0"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["vfs", "filesystem", "in-memory", "copy-on-write", "ram"]
categories = ["filesystem", "caching", "development-tools"]
autobins = false

[dependencies]
edgerun-glob.workspace = true
edgerun-regex.workspace = true
edgerun-crypto = { version = "0.1", path = "../../utility/edgerun-crypto", default-features = false, features = ["sha1"] }
edgerun-log = { version = "0.1", path = "../../utility/edgerun-log" }

[target.'cfg(not(target_os = "none"))'.dependencies]
edgerun-inotify = { version = "0.1", path = "../../linux-adapters/edgerun-inotify", optional = true }

[lints]
workspace = true

[features]
std = []
mount = ["std", "dep:edgerun-inotify"]
