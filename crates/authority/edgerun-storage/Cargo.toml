[package]
name = "edgerun-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Durable event, object, index, and blob storage for Edgerun nodes"

[dependencies]
edgerun-rt = { version = "0.1", path = "../../edgerun-rt" }
edgerun-core = { version = "0.1", path = "../../protocol/edgerun-core" }
edgerun-sign = { workspace = true, default-features = false }
edgerun-stream = { version = "0.1", path = "../edgerun-stream" }
edgerun-virtual-disk = { version = "0.1", path = "../edgerun-virtual-disk", default-features = false }
edgerun-verify = { workspace = true, default-features = false }
edgerun-crypto = { workspace = true, default-features = false, features = ["aead", "pbkdf2"] }
edgerun-encoding = { version = "0.1", path = "../../utility/edgerun-encoding", default-features = false }
edgerun-log = { version = "0.1", path = "../../utility/edgerun-log" }

[dev-dependencies]
edgerun-keygen = { workspace = true, default-features = false }
edgerun-sign-p256 = { workspace = true, default-features = false }

[features]
bare-rt = []

[lints]
workspace = true
