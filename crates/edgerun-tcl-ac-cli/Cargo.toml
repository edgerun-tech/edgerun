[package]
name = "edgerun-tcl-ac-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line tool for TCL air conditioner integration"

[[bin]]
name = "tcl-ac"
path = "src/main.rs"
required-features = ["std"]

[dependencies]
edgerun-tcl-ac = { path = "../edgerun-tcl-ac" }
edgerun-matter = { path = "../edgerun-matter" }
edgerun-bluetooth-gatt = { path = "../edgerun-bluetooth-gatt" }
edgerun-mgmt-bluetooth = { path = "../edgerun-mgmt-bluetooth" }
edgerun-capabilities = { path = "../edgerun-capabilities" }
edgerun-clap = { path = "../edgerun-clap", features = ["std"] }
edgerun-json = { path = "../edgerun-json", default-features = false }

[features]
std = []

[lints]
workspace = true
