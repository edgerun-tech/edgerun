[package]
name = "edgerun-tcl-ac-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line tool for TCL air conditioner integration"

[[bin]]
name = "tcl-ac"
path = "src/main.rs"
required-features = ["std"]

[dependencies]
edgerun-tcl-ac = { version = "0.1", path = "../edgerun-tcl-ac" }
edgerun-matter = { version = "0.1", path = "../edgerun-matter" }
edgerun-bluetooth-gatt = { version = "0.1", path = "../edgerun-bluetooth-gatt" }
edgerun-mgmt-bluetooth = { version = "0.1", path = "../edgerun-mgmt-bluetooth" }
edgerun-capabilities = { version = "0.1", path = "../capability/edgerun-capabilities" }
edgerun-clap = { version = "0.1", path = "../utility/edgerun-clap", features = ["std"] }
edgerun-json = { version = "0.1", path = "../utility/edgerun-json", default-features = false }

[features]
std = []

[lints]
workspace = true
