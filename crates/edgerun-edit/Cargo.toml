[package]
name = "edgerun-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Collaborative editing service and CLI for Edgerun"

[[bin]]
name = "edgerun-edit"
path = "src/main.rs"
required-features = ["std"]

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["std"]

[dependencies]
edgerun-http = { version = "0.1", path = "../edgerun-http", default-features = false, features = ["server"] }
edgerun-rt = { version = "0.1", path = "../edgerun-rt" }
edgerun-clap = { version = "0.1", path = "../edgerun-clap", features = ["std"], optional = true }
edgerun-json = { workspace = true }

[features]
default = []
std = [
    "dep:edgerun-clap",
    "dep:syn",
    "dep:proc-macro2",
    "dep:quote",
    "dep:prettyplease",
]

[target.'cfg(not(target_os = "none"))'.dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits", "printing"], optional = true }
proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
prettyplease = { version = "0.2", optional = true }

[lints]
workspace = true
