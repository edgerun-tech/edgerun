[package]
name = "edgerun-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unified multi-protocol server: HTTP, SMTP, IMAP, LMTP, DNS, DHCP, TFTP, Proxy"

[[bin]]
name = "edgerun-server"
path = "src/bin/edgerun-server.rs"
required-features = ["std", "smtp", "imap", "dns", "tls"]

[dependencies]
edgerun-http = { version = "0.1", path = "../edgerun-http", default-features = false, features = ["connection-middleware", "http-compression", "server"] }
edgerun-email = { version = "0.1", path = "../edgerun-email", optional = true }
edgerun-dns = { version = "0.1", path = "../edgerun-dns", default-features = false, optional = true }
edgerun-acme = { version = "0.1", path = "../edgerun-acme", features = ["dns_challenge"] }
edgerun-analytics = { version = "0.1", path = "../edgerun-analytics" }
edgerun-crypto = { version = "0.1", path = "../utility/edgerun-crypto", default-features = false, features = ["p256"] }
edgerun-encoding = { version = "0.1", path = "../utility/edgerun-encoding" }
edgerun-email-auth = { version = "0.1", path = "../edgerun-email-auth" }
edgerun-machine-report = { version = "0.1", path = "../edgerun-machine-report", features = ["std"] }
edgerun-url = { version = "0.1", path = "../utility/edgerun-url" }
edgerun-dhcp = { version = "0.1", path = "../edgerun-dhcp", optional = true }
edgerun-tftp = { version = "0.1", path = "../edgerun-tftp", optional = true }
edgerun-proxy = { version = "0.1", path = "../edgerun-proxy", optional = true }
edgerun-rt = { version = "0.1", path = "../edgerun-rt" }
edgerun-tls = { version = "0.1", path = "../edgerun-tls", optional = true }
edgerun-log = { version = "0.1", path = "../utility/edgerun-log" }
[features]
default = ["smtp", "imap", "lmtp", "dns", "dhcp", "tftp", "tls"]
std = []
smtp = ["dep:edgerun-email", "edgerun-email/tls", "edgerun-email/dkim"]
imap = ["dep:edgerun-email", "edgerun-email/tls"]
lmtp = ["dep:edgerun-email"]
dns = ["dep:edgerun-dns", "edgerun-dns/dnssec"]
dhcp = ["dep:edgerun-dhcp"]
tftp = ["dep:edgerun-tftp", "edgerun-tftp/server"]
proxy = ["dep:edgerun-proxy"]
tls = ["dep:edgerun-tls", "edgerun-http/tls"]
http3 = ["tls", "edgerun-http/http3"]

[lints]
workspace = true
