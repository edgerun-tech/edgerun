[package]
name = "edgerun-server"
version.workspace = true
edition.workspace = true
description = "Unified multi-protocol server: HTTP, SMTP, IMAP, LMTP, DNS, DHCP, TFTP, Proxy"

[[bin]]
name = "http-server"
path = "src/bin/http-server.rs"
required-features = ["std"]

[dependencies]
edgerun-http = { path = "../edgerun-http", default-features = false, features = ["connection-middleware", "http3"] }
edgerun-email = { path = "../edgerun-email", optional = true }
edgerun-email-auth = { path = "../edgerun-email-auth", optional = true }
edgerun-dns = { path = "../edgerun-dns", optional = true }
edgerun-dhcp = { path = "../edgerun-dhcp", optional = true }
edgerun-tftp = { path = "../edgerun-tftp", optional = true }
edgerun-proxy = { path = "../edgerun-proxy", optional = true }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-tls = { path = "../edgerun-tls" }
edgerun-log = { path = "../edgerun-log" }

[features]
default = ["smtp", "imap", "lmtp", "dns", "dhcp", "tftp", "tls"]
std = []
smtp = ["dep:edgerun-email", "edgerun-email/tls", "dep:edgerun-email-auth", "edgerun-email/dkim"]
imap = ["dep:edgerun-email", "edgerun-email/tls"]
lmtp = ["dep:edgerun-email"]
dns = ["dep:edgerun-dns"]
dhcp = ["dep:edgerun-dhcp"]
tftp = ["dep:edgerun-tftp", "edgerun-tftp/server"]
proxy = ["dep:edgerun-proxy"]
tls = []
