[package]
name = "edgerun-server"
version = "0.1.0"
edition = "2024"
description = "Unified multi-protocol server: HTTP/1.1, HTTP/2, HTTP/3, DNS, DHCP, TFTP"

[[bin]]
name = "http-server"
path = "src/bin/http-server.rs"

[dependencies]
edgerun-http = { path = "../edgerun-http", features = ["tls"] }
edgerun-email = { path = "../edgerun-email", optional = true }
edgerun-dns = { path = "../edgerun-dns", optional = true }
edgerun-dhcp = { path = "../edgerun-dhcp", optional = true }
edgerun-tftp = { path = "../edgerun-tftp", optional = true }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-tls = { path = "../edgerun-tls" }
edgerun-log = { path = "../edgerun-log" }

[features]
default = ["smtp", "imap", "lmtp", "dns", "dhcp", "tftp"]
smtp = ["dep:edgerun-email", "edgerun-email/tls"]
imap = ["dep:edgerun-email", "edgerun-email/tls"]
lmtp = ["dep:edgerun-email"]
dns = ["dep:edgerun-dns"]
dhcp = ["dep:edgerun-dhcp"]
tftp = ["dep:edgerun-tftp"]
