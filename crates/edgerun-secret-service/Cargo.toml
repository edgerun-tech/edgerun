[package]
name = "edgerun-secret-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "edgerun_secret_service"
path = "src/lib.rs"

[[bin]]
name = "edgerun-secret-service"
path = "src/main.rs"
required-features = ["std"]

[dependencies]
edgerun-biometrics = { path = "../edgerun-biometrics" }
edgerun-storage = { path = "../edgerun-storage" }
edgerun-core = { path = "../edgerun-core" }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false }
edgerun-json = { path = "../edgerun-json", default-features = false, features = ["alloc"] }
edgerun-log = { path = "../edgerun-log" }
edgerun-proto = { path = "../edgerun-proto" }
prost.workspace = true

[features]
std = []

[lints]
workspace = true
