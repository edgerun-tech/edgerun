[package]
name = "edgerun-email-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Email authentication: SPF, DKIM, DMARC evaluation"

[dependencies]
edgerun-dns = { path = "../edgerun-dns", default-features = false }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false }
edgerun-log = { path = "../edgerun-log" }
edgerun-crypto = { path = "../edgerun-crypto", default-features = false, features = ["rsa"] }
