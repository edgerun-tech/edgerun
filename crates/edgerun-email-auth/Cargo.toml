[package]
name = "edgerun-email-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Email authentication: SPF, DKIM, DMARC evaluation"

[dependencies]
edgerun-dns = { path = "../edgerun-dns" }
edgerun-encoding = { path = "../edgerun-encoding" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-crypto = { path = "../edgerun-crypto" }
# RSA/SHA2 are only used for DKIM email auth - transitively via edgerun-crypto
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
signature = "2"
