[package]
name = "edgerun-hardware-signing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hardware-backed signing abstraction and provider dispatch for Edgerun"

[features]
default = []
tpm = ["dep:edgerun-tpm"]
android-keystore = ["dep:edgerun-android-keystore"]
# Real JNI-backed Android implementation (requires NDK toolchain)
android-real = ["android-keystore", "edgerun-android-keystore/android-real"]
yubikey = ["dep:edgerun-yubikey"]
# All backends
all-hardware = ["tpm", "android-keystore", "yubikey"]

[dependencies]
edgerun-core = { path = "../edgerun-core" }
edgerun-biometrics = { path = "../edgerun-biometrics" }
edgerun-tpm = { path = "../edgerun-tpm", optional = true }
edgerun-android-keystore = { path = "../edgerun-android-keystore", optional = true }
edgerun-yubikey = { path = "../edgerun-yubikey", optional = true }

[lints]
workspace = true
