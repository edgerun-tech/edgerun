<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>edgerun-agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
    #header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
    #header h1 { font-size: 15px; font-weight: 600; color: #58a6ff; }
    #status { font-size: 12px; color: #8b949e; }
    #status.connected { color: #3fb950; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
    .msg-user { background: #1f6feb33; align-self: flex-end; border: 1px solid #1f6feb55; }
    .msg-assistant { background: #161b22; align-self: flex-start; border: 1px solid #30363d; }
    .msg-error { background: #7f1d1d; align-self: flex-start; }
    .msg-thinking { color: #8b949e; font-style: italic; }
    .cmd { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; font-size: 12px; color: #79c0ff; }
    .cmd-output { background: #0d1117; border: 1px solid #21262d; border-radius: 4px; padding: 8px; font-size: 12px; overflow-x: auto; color: #8b949e; }
    #input-area { padding: 12px 20px; border-top: 1px solid #30363d; background: #161b22; display: flex; gap: 8px; }
    #input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-family: inherit; font-size: 13px; resize: none; outline: none; min-height: 42px; max-height: 120px; }
    #input:focus { border-color: #58a6ff; }
    #send { padding: 10px 20px; background: #1f6feb; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 600; font-size: 13px; }
    #send:hover { background: #388bfd; }
    #send:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
    #tools-toggle { font-size: 12px; color: #8b949e; cursor: pointer; }
    #tools-toggle:hover { color: #c9d1d9; }
    #tools-panel { display: none; padding: 8px 20px; background: #161b22; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; }
    #tools-panel.visible { display: block; }
    .tools-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .tool-tag { background: #21262d; padding: 2px 8px; border-radius: 4px; color: #79c0ff; }
  </style>
</head>
<body>
  <div id="header">
    <h1>&#9889; edgerun-agent</h1>
    <div>
      <span id="status" class="connected">connected</span>
      <span id="tools-toggle" onclick="toggleTools()"> [commands]</span>
    </div>
  </div>
  <div id="tools-panel">
    <div class="tools-list" id="tools-list">Loading...</div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Ask me anything... (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>

  <script>
    let busy = false;

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = `msg msg-${role}`;
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
      return div;
    }

    function addHtml(html, role) {
      const div = document.createElement('div');
      div.className = `msg msg-${role}`;
      div.innerHTML = html;
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
      return div;
    }

    function formatReply(text) {
      let html = esc(text);
      html = html.replace(/\$\s+(.+)/g, '<span class="cmd">$ $1</span>');
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre class="cmd-output"><code>$2</code></pre>');
      return html;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text || busy) return;

      input.value = '';
      input.style.height = 'auto';
      busy = true;
      document.getElementById('send').disabled = true;

      addMsg(text, 'user');
      addMsg('Thinking...', 'thinking');

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, use_tools: true }),
        });

        const data = await resp.json();

        const thinkingEl = document.querySelector('.msg-thinking:last-of-type');
        if (thinkingEl) thinkingEl.remove();

        if (data.error && !data.reply) {
          addMsg(`Error: ${data.error}`, 'error');
        } else {
          addHtml(formatReply(data.reply || ''), 'assistant');
        }
      } catch (e) {
        const thinkingEl = document.querySelector('.msg-thinking:last-of-type');
        if (thinkingEl) thinkingEl.remove();
        addMsg(`Connection error: ${e.message}`, 'error');
      }

      busy = false;
      document.getElementById('send').disabled = false;
    }

    async function loadCommands() {
      try {
        const resp = await fetch('/commands');
        const data = await resp.json();
        const list = document.getElementById('tools-list');
        list.innerHTML = data.commands
          .map(c => `<span class="tool-tag">${esc(c)}</span>`)
          .join('');
      } catch {
        document.getElementById('tools-list').textContent = 'Failed to load commands';
      }
    }

    function toggleTools() {
      document.getElementById('tools-panel').classList.toggle('visible');
    }

    document.getElementById('send').addEventListener('click', send);
    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    document.getElementById('input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    loadCommands();
  </script>
</body>
</html>
