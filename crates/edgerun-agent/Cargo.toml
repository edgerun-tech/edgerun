[package]
name = "edgerun-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Edgerun workspace crates
edgerun-server = { path = "../edgerun-server" }
edgerun-http = { path = "../edgerun-http" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-json = { workspace = true, features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Code analysis
tree-sitter = "0.22"
tree-sitter-rust = "0.21"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
[[bin]]
name = "edgerun-agent"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
