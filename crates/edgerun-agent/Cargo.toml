[package]
name = "edgerun-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Edgerun workspace crates
edgerun-server = { path = "../edgerun-server" }
edgerun-http = { path = "../edgerun-http" }
edgerun-tls = { path = "../edgerun-tls" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-json = { workspace = true, features = ["serde"] }
edgerun-encoding = { workspace = true }
edgerun-edit = { path = "../edgerun-edit" }

# Serialization
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Filesystem & search
glob = "0.3"
regex = "1"

# Tree-sitter for multi-language parsing (from codeanalyzer)
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
# tree-sitter-typescript = "0.21"
# tree-sitter-c = "0.21"
# tree-sitter-python = "0.21"
# tree-sitter-go = "0.21"
# tree-sitter-javascript = "0.21"
# tree-sitter-java = "0.21"

# AST editing
syn = { version = "2", features = ["full", "extra-traits", "printing"] }
prettyplease = "0.2"
quote = "1"
proc-macro2 = "1"

# Parallel processing
rayon = "1.10"

# Memory mapping for large files
memmap2 = { version = "0.9", optional = true }

# SQLite for caching with connection pooling
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Embeddings & ML (for NPU/iGPU acceleration) - optional
candle-core = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
ort = { version = "2.0.0-rc.12", features = ["download-binaries"], optional = true }
tokenizers = { version = "0.19", optional = true }

# Vector search
usearch = { version = "2.0", optional = true }

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]
ml-acceleration = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:candle-nn",
    "dep:ort",
    "dep:tokenizers",
    "dep:usearch",
]

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[lints]
