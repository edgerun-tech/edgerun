[package]
name = "edgerun-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
edgerun-config = { path = "../edgerun-config" }

# CLI
edgerun-clap = { path = "../edgerun-clap" }

# Code analysis
tree-sitter = "0.22"
tree-sitter-rust = "0.21"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
[[bin]]
name = "edgerun-agent"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
