[package]
name = "edgerun-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Durable event, object, index, and blob storage for Edgerun nodes"

[dependencies]
edgerun-rt = { version = "0.1", path = "../edgerun-rt" }
edgerun-core = { version = "0.1", path = "../edgerun-core" }
edgerun-sign = { workspace = true, default-features = false }
edgerun-stream = { version = "0.1", path = "../edgerun-stream" }
edgerun-verify = { workspace = true, default-features = false }
edgerun-hardware-signing = { version = "0.1", path = "../edgerun-hardware-signing", default-features = false }
edgerun-crypto = { workspace = true, default-features = false, features = ["aead", "p256", "pbkdf2"] }
edgerun-encoding = { version = "0.1", path = "../utility/edgerun-encoding", default-features = false }
edgerun-log = { version = "0.1", path = "../utility/edgerun-log" }

[features]
bare-rt = []

[lints]
workspace = true
