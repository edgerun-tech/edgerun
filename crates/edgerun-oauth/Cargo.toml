[package]
name = "edgerun-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
edgerun-crypto = { path = "../edgerun-crypto", default-features = false, features = ["hmac", "p256", "rsa"] }
edgerun-http = { path = "../edgerun-http", default-features = false, features = ["client", "tls"] }
edgerun-log = { path = "../edgerun-log" }
edgerun-json = { path = "../edgerun-json" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-secret-service = { path = "../edgerun-secret-service" }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false }

[lints]
workspace = true
