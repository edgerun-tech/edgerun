[package]
name = "edgerun-v4l2-camera"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux V4L2 camera adapter for Edgerun"

[dependencies]
edgerun-devices.workspace = true
edgerun-protocols = { workspace = true, default-features = false, features = ["core"] }
edgerun-capabilities = { version = "0.1", path = "../../capability/edgerun-capabilities" }
edgerun-encoding = { version = "0.1", path = "../../utility/edgerun-encoding" }

[dev-dependencies]
edgerun-linux-sysfs = { version = "0.1", path = "../edgerun-linux-sysfs" }

[[bin]]
name = "v4l2_camera_tool"
path = "src/bin/v4l2-camera-tool.rs"
required-features = ["std"]

[features]
std = []

[lints]
workspace = true
