[package]
name = "edgerun-solana"
version = "0.1.1"
edition = "2021"

[dependencies]
bs58 = "0.5"
edgerun-error = { path = "../edgerun-error" }
serde = { version = "1", features = ["derive"] }
edgerun-http = { path = "../edgerun-http" }
edgerun-json = { path = "../edgerun-json", features = ["serde"] }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-crypto = { path = "../edgerun-crypto" }

[dev-dependencies]
mockall = "0.13"
