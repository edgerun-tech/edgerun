[package]
name = "edgerun-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "no_std Solana client primitives for Edgerun marketplace flows"

[dependencies]
edgerun-error.workspace = true
edgerun-http = { path = "../edgerun-http", default-features = false, features = ["client", "tls"] }
edgerun-json = { path = "../edgerun-json", default-features = false }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-crypto = { path = "../edgerun-crypto", default-features = false, features = ["ed25519"] }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false }

[lints]
workspace = true
