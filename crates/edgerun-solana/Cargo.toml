[package]
name = "edgerun-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std Solana client primitives for Edgerun marketplace flows"

[dependencies]
edgerun-error.workspace = true
edgerun-http = { version = "0.1", path = "../edgerun-http", default-features = false, features = ["client", "tls"] }
edgerun-json = { version = "0.1", path = "../edgerun-json", default-features = false }
edgerun-rt = { version = "0.1", path = "../edgerun-rt" }
edgerun-crypto = { version = "0.1", path = "../edgerun-crypto", default-features = false, features = ["ed25519"] }
edgerun-encoding = { version = "0.1", path = "../edgerun-encoding", default-features = false }

[features]
default = []
std = ["edgerun-http/std"]

[lints]
workspace = true
