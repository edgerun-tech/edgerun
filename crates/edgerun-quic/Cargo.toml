[package]
name = "edgerun-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "QUIC transport protocol (RFC 9000)"

[lints]
workspace = true

[dependencies]
edgerun-tls = { path = "../edgerun-tls", default-features = false }
edgerun-crypto = { path = "../edgerun-crypto", default-features = false, features = ["aead", "hmac", "p256"] }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false, features = ["alloc"] }
