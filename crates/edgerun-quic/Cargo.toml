[package]
name = "edgerun-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "QUIC transport protocol (RFC 9000)"

[features]
default = ["std"]
std = ["edgerun-tls/std", "edgerun-encoding/std"]

[lints]
workspace = true

[dependencies]
edgerun-tls = { path = "../edgerun-tls", default-features = false }
edgerun-crypto = { path = "../edgerun-crypto" }
edgerun-bare-rt = { path = "../edgerun-bare-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false, features = ["alloc"] }
