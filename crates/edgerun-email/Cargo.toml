[package]
name = "edgerun-email"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Complete email server: SMTP (RFC 5321), IMAP (RFC 3501), LMTP (RFC 2033)"

[[bin]]
name = "edgerun-mailq"
path = "src/bin/edgerun-mailq.rs"

[features]
default = ["dkim"]
tls = ["dep:edgerun-tls"]
dkim = ["dep:edgerun-email-auth"]

[lints]
workspace = true

[dependencies]
edgerun-bare-rt = { path = "../edgerun-bare-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-dns = { path = "../edgerun-dns", default-features = false }
edgerun-email-auth = { path = "../edgerun-email-auth", optional = true }
edgerun-crypto = { path = "../edgerun-crypto", default-features = false }
edgerun-tls = { path = "../edgerun-tls", optional = true }
edgerun-encoding = { path = "../edgerun-encoding" }
