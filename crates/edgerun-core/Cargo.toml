[package]
name = "edgerun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core Edgerun protocol types, validation, commands, and crypto-facing helpers"

[dependencies]
edgerun-proto = { version = "0.1", path = "../edgerun-proto" }
edgerun-crypto = { workspace = true, default-features = false, features = ["hmac", "p256"] }
edgerun-encoding = { version = "0.1", path = "../edgerun-encoding", default-features = false }
edgerun-json = { version = "0.1", path = "../edgerun-json", default-features = false }
prost.workspace = true
prost-types.workspace = true

[features]
conformance = ["edgerun-json/yaml"]

[lints]
workspace = true
