[package]
name = "edgerun-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Built-in SSH transport primitives for Edgerun deployment"

[features]
default = ["std"]
std = []

[dependencies]
edgerun-crypto = { workspace = true, default-features = false, features = ["aes", "hmac", "x25519"] }
edgerun-encoding = { workspace = true }
edgerun-protocols = { workspace = true, default-features = false, features = ["ssh", "sign", "verify", "ed25519"] }

[lints]
workspace = true
