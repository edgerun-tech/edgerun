[package]
name = "edgerun-tuya"
version.workspace = true
edition.workspace = true

[dependencies]
edgerun-capabilities = { path = "../edgerun-capabilities" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-json = { path = "../edgerun-json", default-features = false }

[[bin]]
name = "tuya-discover"
path = "src/bin/tuya-discover.rs"
required-features = ["std"]

[[bin]]
name = "tuya-control"
path = "src/bin/tuya-control.rs"
required-features = ["std"]

[features]
std = []

[lints]
workspace = true
