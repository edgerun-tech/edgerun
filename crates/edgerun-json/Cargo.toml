[package]
name = "edgerun-json"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "A zero-dependency JSON crate with owned, borrowed, tape, and compiled-schema fast paths"
readme = "README.md"
repository = "https://github.com/Sylchi/edgerun-json"
homepage = "https://github.com/Sylchi/edgerun-json"
keywords = ["json", "parser", "serializer", "zero-copy", "tape"]
categories = ["encoding", "parser-implementations"]
rust-version.workspace = true

[features]
default = ["alloc"]
std = []
alloc = []
indexmap = []
raw_value = ["serde"]
preserve_order = ["indexmap"]
serde = ["dep:serde_crate"]
# Enable YAML serialization/deserialization (requires serde)
yaml = ["serde"]
# Enable TOML serialization/deserialization (requires serde)
toml = ["serde"]
# Compatibility testing feature - allows using this crate as serde_json drop-in
compat_test = []
# Enable serde_json comparison benchmarks (pulls in serde_json from crates.io)
serde_json_bench = ["dep:serde_json_upstream", "serde"]

[dependencies]
serde_crate = { package = "serde", version = "1", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(not(target_os = "none"))'.dependencies]
serde_json_upstream = { package = "serde_json", version = "1", optional = true }

[dev-dependencies]
serde_crate = { package = "serde", version = "1", features = ["derive"] }

[[bin]]
name = "edgerun-json-benchmark"
path = "src/bin/benchmark.rs"
required-features = ["std", "serde_json_bench"]

[[test]]
name = "error_position_tests"
required-features = ["serde_json_bench"]

[[test]]
name = "json_test_suite"
required-features = ["serde_json_bench"]

[[test]]
name = "serde_json_comparison"
required-features = ["serde_json_bench"]

[lints]
workspace = true
