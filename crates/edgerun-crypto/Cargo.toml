[package]
name = "edgerun-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# All registry crypto crates — types flow through this single dependency boundary
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "sha256", "arithmetic", "pkcs8"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "digest", "rand_core"] }
ed448-goldilocks = { version = "0.14.0-pre.11", default-features = false, features = ["signing"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
digest = { version = "0.10", default-features = false }
ecdsa = { version = "0.16", default-features = false, features = ["der", "digest", "hazmat"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["hazmat", "sec1", "arithmetic"] }
signature = { version = "2", default-features = false }
der = { version = "0.7", default-features = false, features = ["alloc", "derive", "oid"] }
sec1 = { version = "0.7", default-features = false }
primeorder = { version = "0.13", default-features = false }
ff = { version = "0.13", default-features = false }
group = { version = "0.13", default-features = false }
rfc6979 = { version = "0.4", default-features = false }
crypto-bigint = { version = "0.5", default-features = false }
crypto-common = { version = "0.1", default-features = false }
block-buffer = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }
generic-array = { version = "0.14", default-features = false }
typenum = "1"
base16ct = { version = "0.2", default-features = false }
const-oid = { version = "0.9", default-features = false }
getrandom = { version = "0.2", default-features = false }

# X.509 certificate generation (uses same der/const-oid/p256/ecdsa stack above)
x509-cert = { version = "0.2", default-features = false, features = ["builder", "pem"] }
rcgen = "0.14.7"
