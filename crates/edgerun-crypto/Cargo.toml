[package]
name = "edgerun-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "arithmetic", "pkcs8", "sha2", "ecdh"] }
ecdsa = { version = "0.16", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
elliptic-curve = { version = "0.13", default-features = false }
sha2 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }
signature = { version = "2", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac-crate = { package = "hmac", version = "0.12", default-features = false }
pbkdf2-crate = { package = "pbkdf2", version = "0.12", default-features = false, features = ["hmac"] }
sha1-crate = { package = "sha1", version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
x509-cert = { version = "0.3.0-rc.4", default-features = false, features = ["pem"] }
der = { version = "0.7", default-features = false }
typenum = "1.17"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[dependencies.getrandom]
version = "0.2"
default-features = false
features = ["rdrand"]

[lints]
workspace = true
