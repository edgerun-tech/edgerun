[package]
name = "edgerun-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

#[features]
pem-encoding = ["dep:pem", "dep:x509-cert", "dep:time", "dep:rcgen"]

[dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "sha256", "arithmetic", "pkcs8", "pem"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "digest", "rand_core"] }
ed448-goldilocks = { version = "0.14.0-pre.11", default-features = false, features = ["signing"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
digest = { version = "0.10", default-features = false }
ecdsa = { version = "0.16", default-features = false, features = ["der", "digest", "hazmat", "pkcs8"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["hazmat", "sec1", "arithmetic"] }
signature = { version = "2", default-features = false }
der = { version = "0.7", default-features = false, features = ["alloc", "derive", "oid"] }
sec1 = { version = "0.8", default-features = false }
primeorder = { version = "0.13", default-features = false }
ff = { version = "0.13", default-features = false }
group = { version = "0.13", default-features = false }
rfc6979 = { version = "0.4", default-features = false }
crypto-bigint = { version = "0.7", default-features = false }
crypto-common = { version = "0.2", default-features = false }
block-buffer = { version = "0.12", default-features = false }
rand_core = "0.10"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }
generic-array = { version = "1.3", default-features = false }
typenum = "1"
base16ct = { version = "1.0", default-features = false }
const-oid = { path = "vendor/const-oid-0.9", version = "0.9.6" }
# For bare-metal, use rdrand crate at runtime
pkcs8 = { version = "0.10", default-features = false, features = ["pem", "alloc"] }

[dependencies.pem]
version = "3"
optional = true

[dependencies.x509-cert]
version = "0.2"
default-features = false
features = ["builder", "pem"]
optional = true

[dependencies.rcgen]
version = "0.14.7"
optional = true

[dependencies.time]
version = "0.3"
optional = true

[lints]
workspace = true