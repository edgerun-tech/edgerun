[package]
name = "edgerun-marketplace-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line tooling for the Edgerun compute marketplace"

[[bin]]
name = "edgerun-marketplace"
path = "src/main.rs"
required-features = ["std"]

[dependencies]
edgerun-solana = { path = "../edgerun-solana", default-features = false }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-json = { path = "../edgerun-json", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
edgerun-clap = { path = "../edgerun-clap", features = ["std"] }

[features]
std = ["edgerun-solana/std"]

[lints]
workspace = true
