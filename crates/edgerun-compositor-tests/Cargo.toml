[package]
name = "edgerun-compositor-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Wayland protocol conformance tests for edgerun-compositor"

[lib]
name = "edgerun_compositor_tests"
path = "src/lib.rs"

[[test]]
name = "protocol_conformance"
path = "src/lib.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
libc = "0.2"
