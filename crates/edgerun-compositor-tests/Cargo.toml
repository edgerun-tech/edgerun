[package]
name = "edgerun-compositor-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Wayland protocol conformance tests for edgerun-compositor"

[lib]
name = "edgerun_compositor_tests"
path = "src/lib.rs"

[[bin]]
name = "protocol-conformance"
path = "src/bin/protocol-conformance.rs"

[dependencies]
libc = "0.2"
edgerun-compositor = { path = "../edgerun-compositor" }

[dev-dependencies]
edgerun-compositor = { path = "../edgerun-compositor" }
