[package]
name = "edgerun-compositor"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "Wayland compositor — zero external C dependencies, direct Linux kernel only"

[[bin]]
name = "edgerun-compositor"
path = "src/main.rs"

[dependencies]
edgerun-evdev-input = { path = "../edgerun-evdev-input" }
edgerun-input = { path = "../edgerun-input" }
libc = "0.2"
