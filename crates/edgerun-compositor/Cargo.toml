[package]
name = "edgerun-compositor"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Wayland compositor — zero external C dependencies, direct Linux kernel only"
autobins = false

[dependencies]
edgerun-devices = { version = "0.1", path = "../device-types/edgerun-devices" }
edgerun-protocols = { version = "0.1", path = "../protocol/edgerun-protocols", default-features = false, features = ["wayland"] }
edgerun-evdev-input = { version = "0.1", path = "../linux-adapters/edgerun-evdev-input" }
edgerun-ui-core = { version = "0.1", path = "../utility/edgerun-ui-core", default-features = false }
