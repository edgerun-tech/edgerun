[package]
name = "edgerun-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Universal no_std signature verification dispatcher for EdgeRun envelopes"

[dependencies]
edgerun-crypto = { workspace = true, default-features = false }

[features]
default = ["all"]
all = ["ed25519", "p256", "rsa", "hmac"]
ed25519 = ["edgerun-crypto/ed25519"]
p256 = ["edgerun-crypto/p256"]
rsa = ["edgerun-crypto/rsa"]
hmac = ["edgerun-crypto/hmac"]

[lints]
workspace = true
