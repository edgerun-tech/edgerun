[package]
name = "edgerun-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "deterministic wasm unit SDK for composing Edgerun apps"

[[bin]]
name = "edgerun-sdk"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["dep:edgerun-crypto", "dep:edgerun-deploy", "dep:edgerun-machine-report", "dep:edgerun-protocols", "dep:edgerun-ssh"]

[dependencies]
edgerun-crypto = { workspace = true, features = ["ed25519"], optional = true }
edgerun-deploy = { workspace = true, features = ["std"], optional = true }
edgerun-machine-report = { version = "0.1", path = "../node/edgerun-machine-report", optional = true }
edgerun-protocols = { workspace = true, default-features = false, features = ["seal", "wire"], optional = true }
edgerun-ssh = { workspace = true, features = ["std"], optional = true }

[lints]
workspace = true
