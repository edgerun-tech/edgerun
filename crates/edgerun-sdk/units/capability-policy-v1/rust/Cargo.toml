[package]
name = "edgerun-sdk-unit-capability-policy-v1"
version = "0.1.1"
edition = "2021"
publish = false

[package.metadata.edgerun.unit]
id = "capability-policy-v1"
standard = "edgerun.v0.capability"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
edgerun-unit = { path = "../../../../edgerun-unit" }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
strip = true
