[package]
name = "edgerun-sdk-unit-hmac-sha256-rfc2104"
version = "0.1.1"
edition = "2021"
publish = false

[package.metadata.edgerun.unit]
id = "hmac-sha256-rfc2104"
standard = "RFC2104"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
edgerun-crypto = { version = "0.1.1", path = "../../../../utility/edgerun-crypto", default-features = false }
edgerun-unit = { version = "0.1.1", path = "../../../../edgerun-unit" }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
strip = true
