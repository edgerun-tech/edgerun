[package]
name = "edgerun-sdk-unit-crc32-ieee-v1"
version = "0.1.1"
edition = "2021"
publish = false

[package.metadata.edgerun.unit]
id = "crc32-ieee-v1"
standard = "IEEE802.3"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
edgerun-unit = { version = "0.1.1", path = "../../../../edgerun-unit" }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
strip = true
