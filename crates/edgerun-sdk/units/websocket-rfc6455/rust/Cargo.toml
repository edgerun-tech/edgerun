[package]
name = "edgerun-sdk-unit-websocket-rfc6455"
version = "0.1.1"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[package.metadata.edgerun.unit]
id = "websocket-rfc6455"
standard = "RFC6455"

[dependencies]
edgerun-protocols = { path = "../../../../protocol/edgerun-protocols", default-features = false, features = ["websocket"] }
edgerun-unit = { path = "../../../../edgerun-unit" }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
strip = true
