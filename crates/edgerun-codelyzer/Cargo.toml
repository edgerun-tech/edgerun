[package]
name = "edgerun-codelyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "edgerun-build"
autobins = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "edgerun-apk-api-calls"
path = "src/bin/apk_api_calls.rs"

[[bin]]
name = "edgerun-dead-code"
path = "src/bin/dead_code.rs"

[[bin]]
name = "edgerun-build"
path = "src/bin/edgerun_build.rs"

[[bin]]
name = "edgerun-work-wire-gen"
path = "src/bin/work_wire_gen.rs"

[features]
default = ["std", "lang-rust", "vfs"]
std = ["edgerun-vfs?/std"]
lang-rust = []
lang-typescript = []
lang-c = []
lang-python = []
lang-go = []
lang-java = []
lang-javascript = []
mount = ["vfs"]
vfs = ["dep:edgerun-vfs"]
wire-rkyv = ["dep:rkyv"]

[dependencies]
edgerun-json = { workspace = true, features = ["toml"] }
edgerun-encoding = { workspace = true }
edgerun-vfs = { workspace = true, optional = true }
rkyv = { workspace = true, features = ["std", "bytecheck"], optional = true }
