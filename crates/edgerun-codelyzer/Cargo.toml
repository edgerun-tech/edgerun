[package]
name = "edgerun-codelyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["lang-rust"]
lang-rust = []
lang-typescript = []
lang-c = []
lang-python = []
lang-go = []
lang-java = []
lang-javascript = []
mount = ["vfs"]
vfs = []

[dependencies]
edgerun-crypto = { workspace = true, default-features = false, features = ["sha1"] }
edgerun-json = { workspace = true, features = ["toml"] }
edgerun-log.workspace = true
rkyv.workspace = true
