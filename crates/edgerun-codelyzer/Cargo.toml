[package]
name = "edgerun-codelyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
server = ["dep:edgerun-http", "dep:edgerun-rt", "dep:edgerun-log", "dep:tokio", "edgerun-http/http1"]

[dependencies]
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
dirs = "5"
glob = "0.3"
grep = "0.3"
regex = "1"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
prost = "0.13"

# edgerun dependencies
edgerun-http = { workspace = true, optional = true, features = ["server"] }
edgerun-rt = { workspace = true, optional = true }
edgerun-log = { workspace = true, optional = true }

# Async runtime for server
tokio = { version = "1", optional = true, features = ["fs", "io-util"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser"
harness = false
