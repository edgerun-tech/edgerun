[package]
name = "edgerun-codelyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-c", "lang-go", "lang-java"]
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-c = ["dep:tree-sitter-c"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-javascript = ["dep:tree-sitter-javascript"]

[dependencies]
tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
edgerun-crypto = { workspace = true, default-features = false, features = ["sha1"] }
edgerun-glob.workspace = true
edgerun-regex.workspace = true
grep = "0.3"
regex = "1"
dirs = "5"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
# prost-build removed - using custom binary protocol

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser"
harness = false
