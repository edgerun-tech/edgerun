[package]
name = "edgerun-codelyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "edgerun-apk-api-calls"
path = "src/bin/apk_api_calls.rs"

[features]
default = ["lang-rust"]
lang-rust = []
lang-typescript = []
lang-c = []
lang-python = []
lang-go = []
lang-java = []
lang-javascript = []
mount = ["vfs"]
vfs = []

[dependencies]
edgerun-crypto = { workspace = true, default-features = false, features = ["sha1"] }
edgerun-json = { workspace = true, features = ["toml"] }
edgerun-log.workspace = true
miniz_oxide = { path = "../utility/edgerun-miniz-oxide", default-features = false, features = ["with-alloc"] }
rkyv.workspace = true
