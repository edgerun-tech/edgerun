[package]
name = "edgerun-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Unified DNS + DHCP server — one binary to replace dnsmasq + BIND + CoreDNS + ISC DHCP"

[[bin]]
name = "edgerun-net"
path = "src/main.rs"

[dependencies]
edgerun-dns = { path = "../edgerun-dns" }
edgerun-dhcpv6 = { path = "../edgerun-dhcpv6" }
edgerun-config = { path = "../edgerun-config" }
edgerun-log = { path = "../edgerun-log" }
edgerun-inotify = { path = "../edgerun-inotify" }
signal-hook = "0.3"
edgerun-clap = { path = "../edgerun-clap" }

[lints]
workspace = true
