[package]
name = "edgerun-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP/1.1, HTTP/2, and HTTP/3 with HPACK/QPACK compression"

[features]
default = []
std = ["edgerun-tls?/std"]
client = ["http1", "http2", "runtime", "dep:edgerun-log"]
connection-middleware = []
http-compression = ["edgerun-protocols/http-compression"]
http1 = ["runtime", "dep:edgerun-encoding"]
http2 = ["runtime", "edgerun-protocols/http2-server", "dep:edgerun-hpack", "dep:edgerun-log"]
http3 = ["client", "server", "tls", "edgerun-protocols/http3", "edgerun-protocols/quic", "dep:edgerun-crypto", "dep:edgerun-qpack", "dep:edgerun-encoding", "dep:edgerun-log"]
runtime = ["dep:edgerun-rt"]
server = ["http1", "http2", "runtime", "dep:edgerun-log"]
static-files = ["std", "server"]
tls = ["dep:edgerun-tls"]

[dependencies]
edgerun-tls = { version = "0.1", path = "../edgerun-tls", optional = true }
edgerun-crypto = { version = "0.1", path = "../utility/edgerun-crypto", default-features = false, optional = true }
edgerun-rt = { version = "0.1", path = "../edgerun-rt", optional = true }
edgerun-log = { version = "0.1", path = "../utility/edgerun-log", optional = true }
edgerun-protocols = { workspace = true, default-features = false, features = ["http"] }
edgerun-encoding = { version = "0.1", path = "../utility/edgerun-encoding", default-features = false, optional = true }
edgerun-hpack = { version = "0.1", path = "../utility/edgerun-hpack", optional = true }
edgerun-qpack = { version = "0.1", path = "../utility/edgerun-qpack", optional = true }

[[test]]
name = "http3_integration"
required-features = ["std", "http3"]

[[test]]
name = "integration_unified"
required-features = ["std", "client", "server", "tls", "http3"]

[[test]]
name = "tls_journey"
required-features = ["std", "client", "server", "tls"]

[lints]
workspace = true
