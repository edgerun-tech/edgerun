[package]
name = "edgerun-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP/1.1, HTTP/2, and HTTP/3 with HPACK/QPACK compression"

[features]
default = []
connection-middleware = []

[dependencies]
edgerun-tls = { path = "../edgerun-tls" }
edgerun-crypto = { path = "../edgerun-crypto" }
edgerun-bare-rt = { path = "../edgerun-bare-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-dns = { path = "../edgerun-dns" }
edgerun-error.workspace = true
edgerun-encoding = { path = "../edgerun-encoding", default-features = false, features = ["alloc"] }
edgerun-hpack = { path = "../edgerun-hpack" }
edgerun-qpack = { path = "../edgerun-qpack" }
edgerun-quic = { path = "../edgerun-quic" }
miniz_oxide.workspace = true
brotli.workspace = true

[dev-dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
edgerun-json = { workspace = true }
futures = "0.3"

[lints]
workspace = true
