[package]
name = "edgerun-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dependency-free HTTP/1.1, HTTP/2, and HTTP/3 implementation with HPACK/QPACK compression, stream multiplexing, and flow control"
readme = "README.md"
documentation = "https://docs.rs/edgerun-http"
keywords = ["http", "http2", "http3", "quic", "hpack"]
categories = ["network-programming", "web-programming"]

[features]
default = []
tls = []

[dependencies]
edgerun-tls = { path = "../edgerun-tls" }
edgerun-crypto = { path = "../edgerun-crypto" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-dns = { path = "../edgerun-dns" }
hpack-patched = { path = "crates/hpack-patched" }
httlib-huffman = "0.3"
flate2.workspace = true
brotli.workspace = true
sha2.workspace = true
num-bigint.workspace = true
edgerun-qpack = { path = "../edgerun-qpack" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[[bin]]
name = "http-server"
path = "src/bin/http-server.rs"
required-features = ["tls"]
