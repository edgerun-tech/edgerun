[package]
name = "edgerun-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP/1.1, HTTP/2, and HTTP/3 with HPACK/QPACK compression"

[features]
default = ["client", "server", "http1", "http2", "static-files", "http-compression", "http3", "tls"]
std = []
client = ["http1", "http2", "runtime", "dep:edgerun-dns", "dep:edgerun-log"]
connection-middleware = []
http-compression = ["dep:brotli", "dep:miniz_oxide"]
http1 = ["runtime", "dep:edgerun-encoding"]
http2 = ["runtime", "dep:edgerun-hpack", "dep:edgerun-log"]
http3 = ["client", "server", "tls", "dep:edgerun-crypto", "dep:edgerun-quic", "dep:edgerun-qpack", "dep:edgerun-encoding", "dep:edgerun-log"]
runtime = ["dep:edgerun-rt"]
server = ["http1", "http2", "runtime", "dep:edgerun-log"]
static-files = ["server"]
tls = ["dep:edgerun-tls"]

[dependencies]
edgerun-tls = { path = "../edgerun-tls", optional = true }
edgerun-crypto = { path = "../edgerun-crypto", default-features = false, optional = true }
edgerun-rt = { path = "../edgerun-rt", optional = true }
edgerun-log = { path = "../edgerun-log", optional = true }
edgerun-dns = { path = "../edgerun-dns", default-features = false, optional = true }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false, features = ["alloc"], optional = true }
edgerun-hpack = { path = "../edgerun-hpack", optional = true }
edgerun-qpack = { path = "../edgerun-qpack", optional = true }
edgerun-quic = { path = "../edgerun-quic", optional = true }
miniz_oxide = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }

[dev-dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
edgerun-json = { workspace = true }

[[test]]
name = "http3_integration"
required-features = ["http3"]

[[test]]
name = "integration_unified"
required-features = ["tls"]

[[test]]
name = "tls_journey"
required-features = ["tls"]

[lints]
workspace = true
