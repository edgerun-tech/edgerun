[package]
name = "edgerun-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dependency-free HTTP/1.1, HTTP/2, and HTTP/3 implementation with HPACK/QPACK compression, stream multiplexing, and flow control"
readme = "README.md"
documentation = "https://docs.rs/edgerun-http"
keywords = ["http", "http2", "http3", "quic", "hpack"]
categories = ["network-programming", "web-programming"]

[features]
default = []
tls = ["edgerun-tls"]

[dependencies]
edgerun-tls = { path = "../edgerun-tls", optional = true }
edgerun-crypto = { path = "../edgerun-crypto" }
edgerun-rt = { path = "../edgerun-rt" }
edgerun-log = { path = "../edgerun-log" }
edgerun-dns = { path = "../edgerun-dns" }
hpack-patched = "0.3"

[[bin]]
name = "h2spec-server"
path = "src/bin/h2spec-server.rs"
required-features = ["tls"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
