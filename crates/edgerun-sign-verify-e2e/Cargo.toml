[package]
name = "edgerun-sign-verify-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Focused EdgeRun protocol keygen/bootstrap/signer/verifier E2E tests, WASM build target, and microbenchmarks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
edgerun-core = { workspace = true, default-features = false }
edgerun-verify = { workspace = true, default-features = false }
edgerun-sign = { workspace = true, default-features = false }
edgerun-sign-p256 = { workspace = true, default-features = false }
edgerun-keygen = { workspace = true, default-features = false }
edgerun-node-bootstrap = { workspace = true, default-features = false }

[features]
default = ["std"]
std = [
  "edgerun-core/std",
  "edgerun-sign/std",
  "edgerun-sign-p256/std",
  "edgerun-keygen/std",
  "edgerun-node-bootstrap/std",
]

[[bin]]
name = "edgerun-sign-verify-bench"
path = "src/bin/bench.rs"
required-features = ["std"]

[lints]
workspace = true
