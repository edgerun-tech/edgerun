[package]
name = "edgerun-vfs"
version.workspace = true
edition.workspace = true
description = "In-memory virtual filesystem with git-aware write-back for transparent RAM acceleration"
license = "MIT"
readme = "README.md"
keywords = ["vfs", "filesystem", "in-memory", "copy-on-write", "ram"]
categories = ["filesystem", "caching", "development-tools"]

[dependencies]
sha1 = { version = "0.10", default-features = false }
edgerun-glob.workspace = true
edgerun-regex.workspace = true
edgerun-bare-rt = { path = "../edgerun-bare-rt" }
edgerun-log = { path = "../edgerun-log" }

[target.'cfg(not(target_os = "none"))'.dependencies]
rayon = "1.10"
dashmap = { version = "5", features = ["rayon"] }
ignore = "0.4"
edgerun-clap = { path = "../edgerun-clap" }
libc = "0.2"
edgerun-inotify = { path = "../edgerun-inotify" }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "mount_ramfs"
path = "src/bin/mount_ramfs.rs"

[[bin]]
name = "vfs-benchmark"
path = "src/bin/benchmark.rs"

[[bench]]
name = "vfs_bench"
harness = false

[lints]
workspace = true
