[package]
name = "edgerun-vfs"
version = "0.1.0"
edition = "2021"
description = "In-memory virtual filesystem with git-aware write-back for transparent RAM acceleration"
license = "MIT"
readme = "README.md"
keywords = ["vfs", "filesystem", "in-memory", "copy-on-write", "ram"]
categories = ["filesystem", "caching", "development-tools"]

[dependencies]
rayon = "1.10"
sha1 = "0.10"
regex = "1"
glob = "0.3"
dashmap = { version = "5", features = ["rayon"] }
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
notify = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "mount_ramfs"
path = "src/bin/mount_ramfs.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bench]]
name = "vfs_bench"
harness = false

[lints]
workspace = true