[package]
name = "edgerun-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kubernetes-compatible DNS/DHCP configuration with event-sourced state"

[dependencies]
edgerun-dns = { path = "../edgerun-dns" }
edgerun-dhcpv6 = { path = "../edgerun-dhcpv6" }
edgerun-encoding = { path = "../edgerun-encoding" }
edgerun-json = { path = "../edgerun-json", features = ["std", "serde", "yaml"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[lints]
workspace = true

[profile.release]
panic = "abort"
