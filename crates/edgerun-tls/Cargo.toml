[package]
name = "edgerun-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dependency-free TLS 1.2/1.3 client implementation using workspace crypto"
readme = "README.md"
documentation = "https://docs.rs/edgerun-tls"
keywords = ["tls", "ssl", "https", "security", "crypto"]
categories = ["cryptography", "network-programming"]

[dependencies]
edgerun-http = { path = "../edgerun-http" }
p256 = { path = "../edgerun-p256", default-features = false }
