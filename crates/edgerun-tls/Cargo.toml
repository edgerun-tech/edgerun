[package]
name = "edgerun-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TLS 1.2/1.3 client implementation using workspace crypto primitives"
readme = "README.md"
documentation = "https://docs.rs/edgerun-tls"
keywords = ["tls", "ssl", "https", "security", "crypto"]
categories = ["cryptography", "network-programming"]

[features]
default = []
# Compatibility only: TLS is no_std and uses edgerun-rt unconditionally.
std = []

[dependencies]
edgerun-crypto = { workspace = true, default-features = false, features = ["aead", "ed25519", "hmac", "p256", "rsa", "x25519"] }
edgerun-encoding = { path = "../edgerun-encoding", default-features = false }
edgerun-rt.workspace = true

[lints]
workspace = true
