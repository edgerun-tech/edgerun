[package]
name = "edgerun-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TLS 1.2/1.3 client implementation using workspace crypto primitives"
readme = "README.md"
documentation = "https://docs.rs/edgerun-tls"
keywords = ["tls", "ssl", "https", "security", "crypto"]
categories = ["cryptography", "network-programming"]

[dependencies]
libc = "0.2"
edgerun-crypto.workspace = true
edgerun-core = { path = "../edgerun-core" }

[dev-dependencies]
hex-literal = "0.4"
libc = "0.2"
socket2 = "0.6"
