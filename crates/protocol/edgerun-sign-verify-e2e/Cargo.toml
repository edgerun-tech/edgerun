[package]
name = "edgerun-sign-verify-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Focused EdgeRun protocol keygen/bootstrap/stream/signer/verifier E2E tests, WASM build target, and microbenchmarks"
autobins = false

[lib]
crate-type = ["rlib"]

[dependencies]
edgerun-protocols = { workspace = true, default-features = false, features = ["node-bootstrap", "sign-p256", "keygen", "verify", "core"] }
edgerun-stream = { workspace = true }

[features]
default = ["std"]
std = [
  "edgerun-stream/std",
]

[lints]
workspace = true
