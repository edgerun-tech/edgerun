[package]
name = "edgerun-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Transport-independent protocol parsers, encoders, and state machines"

[dependencies]
edgerun-crypto = { version = "0.1", path = "../../utility/edgerun-crypto", default-features = false, features = ["aead", "ed25519", "hmac", "p256", "rsa", "x25519"], optional = true }
edgerun-core = { version = "0.1", path = "../edgerun-core", default-features = false, optional = true }
edgerun-encoding = { version = "0.1", path = "../../utility/edgerun-encoding", default-features = false, optional = true }
edgerun-hpack = { version = "0.1", path = "../../utility/edgerun-hpack", optional = true }
edgerun-json = { version = "0.1", path = "../../utility/edgerun-json", default-features = false, optional = true }
edgerun-url = { version = "0.1", path = "../../utility/edgerun-url", default-features = false, optional = true }
edgerun-wire = { version = "0.1", path = "../edgerun-wire", default-features = false, optional = true }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"], optional = true }

[features]
default = []
acme = ["dep:edgerun-crypto", "dep:edgerun-encoding", "dep:edgerun-json", "dep:edgerun-url"]
block = ["dep:edgerun-encoding", "wire"]
bluetooth-gatt = ["dep:edgerun-encoding"]
bluetooth-mgmt = ["dep:edgerun-encoding"]
cec = []
core = ["dep:edgerun-core"]
ed25519 = ["dep:edgerun-crypto", "edgerun-crypto/ed25519"]
proxy = ["dep:edgerun-encoding"]
pxe = []
quectel-ec200a = []
dbus = ["dep:edgerun-encoding"]
dhcp = ["dep:edgerun-encoding"]
dhcpv6 = ["dep:edgerun-encoding"]
dns = ["dep:edgerun-encoding"]
dnssec = ["dns", "dep:edgerun-crypto", "edgerun-crypto/ed25519", "edgerun-crypto/p256", "edgerun-crypto/sha1"]
email-auth = ["dep:edgerun-crypto", "dep:edgerun-encoding"]
emrtd = []
goodix-fingerprint = ["dep:edgerun-encoding"]
http = ["dep:edgerun-encoding"]
http2-server = ["http", "dep:edgerun-hpack"]
http-compression = ["http", "dep:edgerun-encoding", "dep:miniz_oxide"]
http3 = ["http", "dep:edgerun-encoding"]
imap = ["dep:edgerun-encoding"]
keygen = ["sign-p256"]
lmtp = ["smtp"]
matter = ["dep:edgerun-encoding"]
nbd = ["block", "dep:edgerun-encoding"]
ndef = ["dep:edgerun-encoding"]
node-bootstrap = ["keygen", "sign-p256", "verify"]
oci = ["dep:edgerun-json"]
oauth = ["dep:edgerun-crypto", "dep:edgerun-encoding"]
quic = ["tls"]
seal = ["keygen", "dep:edgerun-crypto", "edgerun-crypto/aead"]
sign = ["verify"]
sign-p256 = ["sign"]
smtp = ["dep:edgerun-encoding"]
ssh = ["dep:edgerun-encoding"]
tls = ["dep:edgerun-crypto", "dep:edgerun-encoding"]
tcl-ac = ["dep:edgerun-crypto", "edgerun-crypto/aes", "edgerun-crypto/hmac"]
tsig = ["dns", "dep:edgerun-crypto", "dep:edgerun-encoding", "edgerun-crypto/hmac"]
tftp = ["dep:edgerun-encoding"]
tuya = ["dep:edgerun-crypto", "dep:edgerun-encoding", "dep:edgerun-json", "edgerun-crypto/aead", "edgerun-crypto/hmac"]
usb = ["dep:edgerun-encoding"]
verify = ["core"]
websocket = ["dep:edgerun-crypto", "dep:edgerun-encoding", "edgerun-crypto/sha1"]
wifi = ["dep:edgerun-encoding"]
wire = ["dep:edgerun-wire"]

[lints]
workspace = true
