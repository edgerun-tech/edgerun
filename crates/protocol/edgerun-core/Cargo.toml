[package]
name = "edgerun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core Edgerun protocol types, validation, commands, and crypto-facing helpers"

[dependencies]
edgerun-wire = { workspace = true }
edgerun-crypto = { workspace = true, default-features = false, features = ["hmac", "p256"] }
edgerun-encoding = { version = "0.1", path = "../../utility/edgerun-encoding", default-features = false }
edgerun-json = { version = "0.1", path = "../../utility/edgerun-json", default-features = false }

[features]
default = []
std = []
conformance = ["std", "edgerun-json/yaml"]

[lints]
workspace = true
