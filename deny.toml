# edgerun protocol workspace dependency policy.
#
# cargo-deny enforces these rules at CI / local audit time.
# Run:  cargo deny check
#
# CRITICAL: serde_json is banned as a direct dependency in this workspace.
# The edgerun protocol uses CSE-v0 CBOR for all canonicalization.
# If you need to serialize something for hashing or signing, use CSE-v0.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# CRITICAL: serde_json is banned as a direct dependency in this workspace.
# The edgerun protocol uses protobuf for all canonicalization.
# If you need to serialize something for hashing or signing, use protobuf.
# serde_json may only appear as a transitive dependency of dev/criterion.
[[bans.deny]]
name = "serde_json"
wrappers = ["criterion", "tinytemplate"]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
